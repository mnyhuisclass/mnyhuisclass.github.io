<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Resilient City</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&family=Overpass+Mono:wght@500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: a municipal planning desk. Highway-sign header, zoning map on the left, planner's drawer (build / library / journal) on the right. */
:root{
  --paper:#E8EEEA; --panel:#F6F8F6; --panel2:#DDE5E0; --ink:#1B2A33; --muted:#53666F; --line:#C1CDC7;
  --sign:#0E6B4A; --sign-ink:#FFFFFF; --warnsign:#F2C230; --warnsign-ink:#1B1B12;
  --accent:#0E6B4A; --accent-ink:#FFFFFF; --focus:#1F6FC9;
  --good:#2C7A4C; --warn:#A8660A; --bad:#B23A2E; --scrim:rgba(14,24,34,.55);
  --grass:#C4D9A8; --forest:#6E9A5B; --tree:#2F5A2A; --river:#6FA3CF; --ocean:#4A7FAE; --wave:#E3F0F9; --sand:#E8DAAE; --rubble:#9A9488; --road:#5E6770; --roadline:#F2E6A8; --gridline:rgba(27,42,51,.10); --safe:#0E6B4A;
  --res:#E9C23F; --com:#D2544A; --ind:#8A69B5; --park:#4F9A4C;
  --flood:#1F6FC9; --fire:#D9531E; --hurricane:#0F8C8B; --quake:#8C5A2B; --tornado:#6A4FC0; --drought:#B98208; --shelter:#34495E; --on-haz:#FFFFFF;
  --power:#A86F00; --water:#1A80A6; --smog:#5E554B;
  --f-ui:'Overpass','Segoe UI',system-ui,sans-serif;
  --f-read:'Source Serif 4',Georgia,'Times New Roman',serif;
  --f-mono:'Overpass Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1822; --panel:#13212E; --panel2:#1B2D3C; --ink:#E2EBEE; --muted:#97A9B2; --line:#2A3E4F;
  --sign:#0B5A3E; --sign-ink:#FFFFFF; --warnsign:#E8B923; --warnsign-ink:#1B1B12;
  --accent:#43C08D; --accent-ink:#06241A; --focus:#7DB6F5;
  --good:#5CC98A; --warn:#E3A33A; --bad:#EF6B5E; --scrim:rgba(0,0,0,.6);
  --grass:#2C4632; --forest:#1D3A24; --tree:#5C9A55; --river:#2F6496; --ocean:#1F4A73; --wave:#8DBCE3; --sand:#5E5438; --rubble:#5F5D55; --road:#8E99A5; --roadline:#3B4652; --gridline:rgba(226,235,238,.07); --safe:#5CD39E;
  --res:#E2BB38; --com:#E0675C; --ind:#A386D6; --park:#5DAA58;
  --flood:#4C93E6; --fire:#F07038; --hurricane:#2DB5B2; --quake:#C28A55; --tornado:#9077E0; --drought:#E0A92A; --shelter:#8EA5BA; --on-haz:#0B141C; --power:#E8B54A; --water:#4BB8DA; --smog:#A39A8F;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0E1822; --panel:#13212E; --panel2:#1B2D3C; --ink:#E2EBEE; --muted:#97A9B2; --line:#2A3E4F;
  --sign:#0B5A3E; --sign-ink:#FFFFFF; --warnsign:#E8B923; --warnsign-ink:#1B1B12;
  --accent:#43C08D; --accent-ink:#06241A; --focus:#7DB6F5;
  --good:#5CC98A; --warn:#E3A33A; --bad:#EF6B5E; --scrim:rgba(0,0,0,.6);
  --grass:#2C4632; --forest:#1D3A24; --tree:#5C9A55; --river:#2F6496; --ocean:#1F4A73; --wave:#8DBCE3; --sand:#5E5438; --rubble:#5F5D55; --road:#8E99A5; --roadline:#3B4652; --gridline:rgba(226,235,238,.07); --safe:#5CD39E;
  --res:#E2BB38; --com:#E0675C; --ind:#A386D6; --park:#5DAA58;
  --flood:#4C93E6; --fire:#F07038; --hurricane:#2DB5B2; --quake:#C28A55; --tornado:#9077E0; --drought:#E0A92A; --shelter:#8EA5BA; --on-haz:#0B141C; --power:#E8B54A; --water:#4BB8DA; --smog:#A39A8F;
  color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1340px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}

/* Highway guide sign header */
.sign{background:var(--sign);color:var(--sign-ink);border-radius:10px;padding:5px}
.sign-in{border:2px solid color-mix(in srgb,var(--sign-ink) 85%,transparent);border-radius:7px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{margin:0;font-weight:800;font-size:clamp(22px,3.2vw,32px);letter-spacing:.02em;line-height:1;text-transform:uppercase}
.brand span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;margin-top:4px}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat b{font-family:var(--f-mono);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.stat small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.forecast{display:flex;align-items:center;gap:10px;background:var(--warnsign);color:var(--warnsign-ink);border-radius:6px;padding:6px 12px 6px 8px;border:2px solid var(--warnsign-ink);max-width:100%}
.forecast .dia{width:26px;height:26px;flex:none;transform:rotate(45deg);border:2px solid var(--warnsign-ink);border-radius:3px;display:grid;place-items:center}
.forecast .dia i{transform:rotate(-45deg);font-style:normal;font-weight:800;font-size:15px}
.forecast b{display:block;font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:14px;line-height:1.1}
.forecast small{font-size:12px}

.idrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end}
.field{display:flex;flex-direction:column;gap:2px;min-width:0}
.field label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;width:220px;max-width:100%}
.idrow .spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:600;line-height:1.2}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn.small{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}

.workspace{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start}
.workspace>.mapcard{grid-column:2}
#build-drawer{grid-column:1;margin-right:16px}
#lib-drawer{grid-column:3;margin-left:16px}
.mtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.btn.toggle{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.btn.toggle[aria-expanded="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chev{width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg)}
.btn.toggle[aria-expanded="true"] .chev{transform:rotate(135deg)}
.chev.r{transform:rotate(135deg)}
.btn.toggle[aria-expanded="true"] .chev.r{transform:rotate(-45deg)}
.toolchip{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.toolchip .pill{font-family:var(--f-ui);font-size:13px;padding:5px 10px;border-color:var(--accent)}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:6px 10px 6px 14px;min-height:50px}
.dhead h2{margin:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
.dbody{padding:12px;display:flex;flex-direction:column;gap:14px;overflow:auto;-webkit-overflow-scrolling:touch;min-height:0}
@media (max-width:1099px){
  .workspace>.drawer{position:fixed;z-index:40;margin:0!important;top:calc(12px + env(safe-area-inset-top,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));max-height:none!important;width:min(370px,calc(100vw - 24px));box-shadow:0 12px 40px rgba(0,0,0,.35)}
  #build-drawer{left:max(12px,env(safe-area-inset-left,0px))}
  #lib-drawer{right:max(12px,env(safe-area-inset-right,0px))}
}

.mapcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.maphead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.maphead h2{margin:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}
.maphead select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:100%}
#mapwrap{position:relative;width:100%;min-width:0}
#map{display:block;margin:0 auto;border-radius:4px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:crosshair}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block;border:1px solid color-mix(in srgb,var(--ink) 30%,transparent)}
.info{min-height:44px;font-size:13.5px;background:var(--panel2);border-radius:6px;padding:8px 10px}
.info b{font-weight:800}
.status{font-size:13.5px;font-weight:600;min-height:20px}
.status.bad{color:var(--bad)} .status.good{color:var(--good)}
.turnbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.turnbar .income{font-size:13px;color:var(--muted)}
.turnbar .income b{font-family:var(--f-mono);color:var(--ink)}

/* Drawer */
.drawer{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-width:0;width:350px;position:sticky;top:calc(12px + env(safe-area-inset-top,0px));max-height:calc(100vh - 24px)}
.tabs{display:flex;flex:1}
.tabs button{flex:1;background:none;border:0;padding:11px 6px;cursor:pointer;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.forecast{cursor:pointer;text-align:left;font-family:inherit}
.lower{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:10px}
@media (max-width:760px){.lower{grid-template-columns:minmax(0,1fr)}}
.advisor,.dash{display:flex;flex-direction:column;gap:6px;min-width:0}
.advisor h3,.dash h3{margin:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.dash{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.dash h3+.drow{margin-top:-2px}
.adv{display:grid;grid-template-columns:5px minmax(0,1fr);gap:10px;font-size:13.5px;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.adv p{margin:0}
.adv b{display:inline-block;min-width:66px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sev{border-radius:3px;background:var(--good)}
.sev.s1{background:var(--accent)} .sev.s2{background:var(--warn)} .sev.s3{background:var(--bad)}
.drow{display:grid;grid-template-columns:52px minmax(0,1fr) 58px;gap:8px;align-items:center;font-size:12.5px}
.drow .v{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.drow .v.over{color:var(--bad);font-weight:700}
.dbar{position:relative;height:10px;background:var(--panel2);border-radius:5px;overflow:hidden}
.dbar i{position:absolute;top:0;bottom:0;background:var(--c)}
.dbar.center::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--ink);opacity:.5}
.stat.clock b{min-width:5.6em}
.stat.clock b.low{color:var(--warnsign)}
.checklist{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.checklist ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 16px}
.checklist li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:6px;align-items:start}
.checklist li .ok{color:var(--good);font-weight:800}
.checklist li .no{color:var(--bad);font-weight:800}
.checklist small{display:block;color:var(--muted);font-size:12.5px}
.checklist p{margin:0;font-weight:600}

.group{display:flex;flex-direction:column;gap:6px}
.ghead{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.ghead .dot{width:10px;height:10px;border-radius:50%}
.ghead em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:600}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tool{display:flex;gap:8px;align-items:center;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 8px;cursor:pointer;min-width:0}
.tool:hover{border-color:var(--ink)}
.tool[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.tool .sw{flex:none;width:28px;height:28px;border-radius:5px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:11px;background:var(--c);color:var(--on-haz)}
.tool .tx{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.tool .tx b{font-size:13px}
.tool .tx small{font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}
.locked{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px dashed var(--line);border-radius:6px;padding:8px 10px;font-size:13px;color:var(--muted)}

.pcard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--paper);border-left:5px solid var(--c)}
.pcard .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--c)}
.pcard h3{margin:0;font-family:var(--f-read);font-weight:600;font-size:18px;text-wrap:balance}
.pcard p{margin:0;font-size:13px;color:var(--muted)}
.meters{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:11.5px;border-radius:99px;padding:2px 8px;border:1px solid var(--line);font-family:var(--f-mono);font-variant-numeric:tabular-nums;background:var(--panel)}
.pill.ok{border-color:var(--good);color:var(--good)}
.pill.bonus{border-color:var(--warn);color:var(--warn)}
.pcard .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

.jentry{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:3px}
.jentry .jt{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.jentry b{font-size:14px}
.jentry p{margin:0;font-family:var(--f-read);font-size:14.5px}
details.teacher{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
details.teacher summary{cursor:pointer;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.trow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.trow select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.note{font-size:12.5px;color:var(--muted)}

/* Overlays */
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.dialog{background:var(--panel);color:var(--ink);border-radius:12px;border:1px solid var(--line);width:100%;max-width:640px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;margin:auto 0}
.dialog h2{margin:0;font-size:22px;font-weight:800;text-wrap:balance}
.dialog .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--c,var(--muted))}
.dialog p{margin:0}
.dialog .actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.dialog textarea,.reader textarea{width:100%;min-height:90px;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-family:var(--f-read);font-size:15px;resize:vertical}
.choices{display:flex;flex-direction:column;gap:6px}
.choice{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:6px;padding:7px 10px;cursor:pointer;background:var(--paper)}
.choice:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.choice input{margin-top:3px;accent-color:var(--accent)}
.choice.right{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.choice.wrong{border-color:var(--bad)}
.choice.disabled{cursor:default}
.steps{display:flex;flex-direction:column;gap:8px;margin:0;padding-left:22px}
.steps li{padding-left:4px}
.feedback{font-size:14px;border-radius:6px;padding:8px 10px;background:var(--panel2)}
.feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}
.feedback.good,.feedback.bad{font-weight:600}
.feedback span{color:var(--ink);font-weight:400}
.reportgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.reportgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rstat{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px;display:flex;flex-direction:column}
.rstat b{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.rstat small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ps{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14.5px}
.ps dt{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted);padding-top:3px}
.ps dd{margin:0}

/* Reader */
.reader{background:var(--panel);border-radius:12px;border:1px solid var(--line);width:100%;max-width:1240px;display:flex;flex-direction:column;margin:auto 0;min-height:0}
.rhead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);border-top:6px solid var(--c);border-radius:12px 12px 0 0}
.rhead .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--c)}
.rhead h2{margin:0;font-family:var(--f-read);font-weight:600;font-size:clamp(22px,3vw,30px);text-wrap:balance}
.rbody{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
@media (max-width:860px){.rbody{grid-template-columns:minmax(0,1fr)}}
.passage{padding:18px 22px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
@media (max-width:860px){.passage{border-right:0;border-bottom:1px solid var(--line)}}
.para{display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 8px}
.para .pn{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:4px}
.para p{margin:0;font-family:var(--f-read);font-size:17px;line-height:1.62;max-width:66ch}
.para .role{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.para .role select{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:4px 8px;max-width:100%}
.tag{font-size:12px;font-weight:800;border-radius:4px;padding:2px 7px;letter-spacing:.04em}

<script>
(function(){
"use strict";
// ---------- Map ----------
const W=24,H=16,N=W*H;
const GRID=Array.from({length:H},()=>Array(W).fill('.'));
const put=(ch,pts)=>pts.forEach(([x,y])=>{if(x>=0&&x<W&&y>=0&&y<H)GRID[y][x]=ch});
const span=(y,x0,x1)=>Array.from({length:x1-x0+1},(_,k)=>[x0+k,y]);
for(let y=0;y<H;y++){put('O',[[22,y],[23,y]]);put('s',[[21,y]])}
put('s',[[20,14],[20,15]]);
put('F',[...span(0,0,5),...span(1,0,4),...span(2,0,3),...span(3,0,2),...span(4,0,1),[0,5],...span(0,17,19),...span(1,18,19),[18,2]]);
put('~',[[7,0],[7,1],[7,2],[7,3],[8,3],[8,4],[8,5],[8,6],[9,6],[9,7],[9,8],[9,9],[10,9],[10,10],[10,11],[11,11],[11,12],...span(13,11,21)]);
put('~',[[16,0],[16,1],[16,2],[16,3],[15,3],[15,4],[15,5],[14,5],[14,6],[14,7],[13,7],[13,8],[12,8],[12,9],[11,9]]);
put('x',[[0,10],[1,11],[2,12],[3,13],[4,14],[5,15]]);
const MAP=GRID.map(r=>r.join(''));
const TN={'.':'grass','F':'forest','~':'river','O':'ocean','s':'sand','x':'fault'};
const TNAME={grass:'Open land',forest:'State forest',river:'River',ocean:'Ocean',sand:'Sandy coastline',fault:'Fault line'};
const terr=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)terr.push(TN[MAP[y][x]]);
const tx=i=>i%W, ty=i=>Math.floor(i/W);
const cheb=(a,b)=>Math.max(Math.abs(tx(a)-tx(b)),Math.abs(ty(a)-ty(b)));
const eucl=(a,b)=>Math.hypot(tx(a)-tx(b),ty(a)-ty(b));
function distField(pred){const src=[];for(let i=0;i<N;i++)if(pred(terr[i]))src.push(i);return Array.from({length:N},(_,i)=>src.length?Math.min(...src.map(j=>cheb(i,j))):99)}
const dRiver=distField(t=>t==='river'),dForest=distField(t=>t==='forest'),dOcean=distField(t=>t==='ocean'),dFault=distField(t=>t==='fault');
const isLand=i=>terr[i]!=='river'&&terr[i]!=='ocean';

// ---------- Hazards ----------
const HAZ={
 flood:{name:'Flood',color:'--flood',icon:'F',problem:'Heavy rain sent the river over its banks and into the low land nearby.'},
 fire:{name:'Wildfire',color:'--fire',icon:'W',problem:'Hot, dry wind pushed a wildfire out of the state forest toward town.'},
 hurricane:{name:'Hurricane',color:'--hurricane',icon:'H',problem:'A hurricane pushed a wall of storm surge onto the coast.'},
 quake:{name:'Earthquake',color:'--quake',icon:'E',problem:'Rocks along the fault slipped, and the ground shook across the city.'},
 tornado:{name:'Tornado',color:'--tornado',icon:'T',problem:'A tornado dropped from a thunderstorm and tore a path across the city.'},
 drought:{name:'Drought',color:'--drought',icon:'D',problem:'Weeks without rain shrank the river and emptied the city’s water supply.'}
};
const HKEYS=Object.keys(HAZ);
const SCHEDULE=['flood','fire','hurricane','quake','tornado','drought'];
const DISASTER_GAP=3, FIRST_DISASTER=4;

function zoneChance(h,i,path){
  if(!isLand(i))return 0;
  switch(h){
    case 'flood':return dRiver[i]<=2?.75:0;
    case 'fire':return (dForest[i]<=2&&terr[i]!=='forest')?.75:0;
    case 'hurricane':return dOcean[i]<=4?.7:.12;
    case 'quake':return dFault[i]<=2?.55:.2;
    case 'tornado':return path&&path.has(i)?.85:0;
    case 'drought':return .35;
  }return 0;
}
function highRisk(h,i,path){
  if(!isLand(i))return false;
  switch(h){
    case 'flood':return dRiver[i]<=2;
    case 'fire':return dForest[i]<=2&&terr[i]!=='forest';
    case 'hurricane':return dOcean[i]<=4;
    case 'quake':return dFault[i]<=2;
    case 'tornado':return path?path.has(i):true;
    case 'drought':return true;
  }return false;
}

// ---------- Buildings ----------
const BASIC={
 road:{name:'Road',cost:10,code:'',color:'--road',desc:'Homes, shops and factories must touch a road to count.'},
 bridge:{name:'Bridge',cost:40,code:'=',color:'--road',ruleText:'on river',desc:'Carries a road across the river. Connects like a road.'},

 factory:{name:'Industrial Zone',cost:80,code:'I',color:'--ind',zone:'I',desc:'Factories. Each level earns $10 a day and adds 8 jobs, but pollutes nearby land.'},
 powerline:{name:'Power Line',cost:10,code:'',color:'--power',desc:'Carries electricity from a power plant or solar farm. Runs across empty land, the river, and Residential or Commercial zones. Tap a line again to remove it.'},
 park:{name:'Park',cost:30,code:'P',color:'--park',desc:'Raises land value for 2 tiles around it.'},
 power:{name:'Power Plant',cost:150,code:'PP',color:'--power',util:'power',cap:60,upkeep:6,pollute:30,desc:'Powers 60 zone levels on its road network. Upkeep $6 a day. Pollutes nearby land.'},
 solar:{name:'Solar Farm',cost:220,code:'SF',color:'--power',util:'power',cap:35,upkeep:2,desc:'Clean power for 35 zone levels. Upkeep $2 a day. No pollution.'},
 tower:{name:'Water Treatment',cost:80,code:'WT',color:'--water',util:'water',cap:40,upkeep:3,desc:'Water for 40 zone levels on its road network. Upkeep $3 a day.'},
 pump:{name:'Pump Station',cost:130,code:'PS',color:'--water',util:'water',cap:90,upkeep:4,rule:'river1',ruleText:'next to river',desc:'Pumps river water for 90 zone levels. Upkeep $4 a day.'}
};
const STRATS={
 levee:{name:'Levee',from:['flood'],cost:120,code:'LV',r:2,prot:{flood:{p:.8,h:.5}},rule:'river1',ruleText:'next to river',desc:'Earthen wall that holds the river in its channel. Protects tiles within 2.'},
 wetland:{name:'Wetland Park',from:['flood'],cost:150,code:'WP',r:3,prot:{flood:{p:.6,h:.3}},rule:'river2',ruleText:'within 2 of river',desc:'Soaks up floodwater like a sponge. Protects tiles within 3.'},
 raisedhome:{name:'Raised Home',from:['flood'],cost:90,code:'RH',home:true,prot:{flood:{p:1,h:1}},desc:'House on stilts. Floodwater flows underneath. 6 residents.'},
 firebreak:{name:'Firebreak',from:['fire'],cost:60,code:'FB',r:2,prot:{fire:{p:.7,h:.4}},rule:'forest1',ruleText:'next to forest',desc:'Cleared strip with no fuel, so fire slows. Protects tiles within 2.'},
 firestation:{name:'Fire Station',from:['fire'],cost:200,code:'FS',r:4,prot:{fire:{p:.45,h:.7}},desc:'Crews arrive in minutes. Protects tiles within 4.'},
 firesafehome:{name:'Fire-Safe Home',from:['fire'],cost:90,code:'FH',home:true,prot:{fire:{p:.85,h:1}},desc:'Tile roof, ember screens, 30 ft of defensible space. 6 residents.'},
 seawall:{name:'Seawall',from:['hurricane'],cost:150,code:'SW',r:3,prot:{hurricane:{p:.8,h:.5}},rule:'sand',ruleText:'on coastline',desc:'Concrete wall that blocks storm surge. Protects tiles within 3.'},
 dunes:{name:'Dunes & Mangroves',from:['hurricane'],cost:100,code:'DM',r:2,prot:{hurricane:{p:.6,h:.3}},rule:'sand',ruleText:'on coastline',desc:'Natural barrier that slows waves. Cheaper than a wall. Protects within 2.'},
 shelter:{name:'Storm Shelter',from:['hurricane','tornado'],cost:160,code:'SS',color:'--shelter',r:3,prot:{hurricane:{p:0,h:.95},tornado:{p:0,h:.95}},desc:'Keeps people safe in hurricanes and tornadoes. Protects people within 3.'},
 quakehome:{name:'Quake-Safe Home',from:['quake'],cost:100,code:'QH',home:true,prot:{quake:{p:1,h:1}},desc:'Base-isolation pads absorb shaking. 6 residents.'},
 retrofit:{name:'Retrofit Office',from:['quake'],cost:180,code:'RO',r:3,prot:{quake:{p:.6,h:.5}},desc:'Crews add steel braces to older buildings within 3.'},
 eew:{name:'Quake Warning Sensor',from:['quake'],cost:120,code:'EW',r:5,prot:{quake:{p:0,h:.7}},desc:'Alerts seconds before shaking: drop, cover, hold on. Protects people within 5.'},
 siren:{name:'Warning Siren',from:['tornado'],cost:80,code:'WS',r:4,prot:{tornado:{p:0,h:.7}},desc:'Tells everyone to get inside now. Protects people within 4.'},
 saferoom:{name:'Safe-Room Home',from:['tornado'],cost:100,code:'SR',home:true,prot:{tornado:{p:.5,h:1}},desc:'Reinforced safe room and roof straps. 6 residents.'},
 reservoir:{name:'Reservoir',from:['drought'],cost:200,code:'RV',r:5,prot:{drought:{p:.7,h:0}},rule:'river1',ruleText:'next to river',desc:'Stores water from wet seasons for dry ones. Protects within 5.'},
 recycling:{name:'Water Recycling Plant',from:['drought'],cost:180,code:'WR',r:4,prot:{drought:{p:.6,h:0}},desc:'Cleans used water so it can be used again. Protects within 4.'},
 raingarden:{name:'Rain Garden',from:['drought'],cost:50,code:'RG',r:2,prot:{drought:{p:.4,h:0}},desc:'Catches runoff and refills groundwater. Protects within 2.'}
};
for(const k in STRATS){const s=STRATS[k];if(!s.color)s.color=HAZ[s.from[0]].color;if(s.home)s.zone='R'}
const DEF=k=>BASIC[k]||STRATS[k];
const isHome=t=>!!(t&&DEF(t)&&DEF(t).home);
const needsRoad=t=>isHome(t)||t==='shop'||t==='factory'||(BASIC[t]&&!!BASIC[t].util);
const destroyable=t=>isHome(t)||t==='shop'||t==='factory'||t==='park';
const roadLike=t=>t==='road'||t==='bridge';
const zoneOf=t=>t&&DEF(t)?DEF(t).zone||null:null;
const isUtil=t=>!!(t&&BASIC[t]&&BASIC[t].util);
const linesOK=t=>{const z=zoneOf(t);return z==='R'||z==='C'};

// ---------- Passages ----------
const ROLES={problem:'Problem',cause:'Cause of the problem',solution:'Solution',result:'Result'};
const PASSAGES=[
{id:'flood',title:'When the River Rises',teaser:'Why riverside towns flood, and three ways to fight back.',
 unlocks:['levee','wetland','raisedhome'],
 keywords:['levee','wetland','floodplain','pavement','paved','raise','raised','stilts','sponge','inspect','weak spot','soak','low land','dollar','combine'],
 paras:[
 ['problem','Many towns are built beside rivers because rivers provide water, transportation, and rich soil for farming. But living near a river comes with a serious problem: flooding. When heavy rain falls or snow melts quickly, a river can rise over its banks and pour into streets, homes, and businesses. Floods are the most common natural disaster in the United States, and they cause billions of dollars in damage every year.'],
 ['cause','Why do floods hurt cities so badly? One reason is pavement. In a forest or meadow, rainwater soaks into the soil. In a city, roads, parking lots, and rooftops cover the ground, so the water has nowhere to go. It rushes into the river all at once, making the water rise faster and higher. Many cities also built homes on low land called floodplains, right where a river naturally spreads out.'],
 ['solution','One solution is to build levees. A levee is a long wall of packed earth or concrete built along a riverbank to hold water inside the river’s channel. Levees have protected cities like Sacramento, California, for over a century. However, engineers warn that levees must be inspected and repaired often, because a single weak spot can let water break through.'],
 ['solution','Another solution works with nature instead of against it. Wetlands act like giant sponges, soaking up floodwater and releasing it slowly. Some cities are turning low land beside the river into wetland parks. Families can also raise their homes on tall foundations or stilts so floodwater flows underneath instead of through the living room.'],
 ['result','These solutions are making a difference. Studies show that every dollar spent preparing for disasters can save about six dollars in repairs later. Cities that combine strong levees, healthy wetlands, and raised buildings suffer less damage and recover more quickly when the river rises again.']],
 dok2:[
 {q:'What problem does the author describe in paragraph 1?',o:['Rivers make it hard for people to travel between towns.','Towns built beside rivers can be damaged by flooding.','Snow melts too slowly in the spring.','Cities do not have enough rich soil for farming.'],a:1,ex:'Paragraph 1 says living near a river “comes with a serious problem: flooding.”'},
 {q:'According to paragraph 2, how does pavement make floods worse?',o:['It cracks and lets water leak into homes.','It soaks up too much water during storms.','It keeps rain from soaking into the ground, so water rushes into the river all at once.','It makes rivers wider and slower.'],a:2,ex:'Paragraph 2: in a city “the water has nowhere to go. It rushes into the river all at once.”'},
 {q:'Which phrase from paragraph 4 signals that the author is introducing a second solution?',o:['“soaking up floodwater”','“Another solution works with nature”','“on tall foundations”','“through the living room”'],a:1,ex:'“Another solution” is a signal phrase that tells the reader a new solution is coming.'}],
 dok3:[
 {q:'Riverton has money for only ONE flood project. The town owns a lot of empty, low land beside the river. Based on the passage, which project makes the most sense?',o:['Pave the empty land to make a parking lot','Turn the low land into a wetland park','Build new homes on the low land','Do nothing, because floods are rare'],a:1,ex:'Wetlands soak up floodwater like sponges, and Riverton already has low riverside land to use. Paving would make flooding worse (paragraph 2), and floods are the most common disaster (paragraph 1).'},
 {q:'The author warns that levees “must be inspected and repaired often, because a single weak spot can let water break through.” What can you conclude about relying on levees alone?',o:['Levees are useless and should never be built.','Levees work best when no one inspects them.','A city is safer when it combines levees with other solutions.','Levees only work in California.'],a:2,ex:'Because one weak spot can fail, the last paragraph says cities that combine levees, wetlands, and raised buildings suffer less damage.'}]},
{id:'fire',title:'Living with Fire',teaser:'Why wildfires are getting worse, and how towns at the forest edge stay standing.',
 unlocks:['firebreak','firestation','firesafehome'],
 keywords:['firebreak','fuel','ember','embers','defensible','roof','vent','vents','brush','fire station','cleared','minutes','together','wind','drought'],
 paras:[
 ['problem','In the western United States, wildfires are growing larger and more dangerous. Each year, fires burn millions of acres of forest and grassland. As more people build homes at the edge of forests, an area experts call the wildland-urban interface, more neighborhoods sit directly in the path of these fires.'],
 ['cause','Several causes have made today’s fires worse. Hotter summers and longer droughts dry out trees and grass, turning them into fuel. For many years, people also put out every small fire as quickly as possible. That sounds helpful, but it allowed dead branches and brush to pile up on the forest floor. When a fire finally starts, all that extra fuel makes it burn hotter and spread faster. Strong winds can carry burning embers more than a mile ahead of the flames.'],
 ['solution','To solve this problem, communities create firebreaks. A firebreak is a wide strip of land where trees and brush have been cleared away. When a wildfire reaches the firebreak, it runs out of fuel and slows down, giving firefighters a chance to stop it. Fire stations built close to at-risk neighborhoods also help, because crews can arrive in minutes instead of hours.'],
 ['solution','Homeowners can be part of the solution, too. Most homes that burn in wildfires are lit by flying embers, not by the wall of flames. Fire-safe homes have metal or tile roofs, screens over vents to block embers, and a “defensible space” of at least 30 feet where plants are trimmed and dry leaves are cleared away.'],
 ['result','These steps work best together. Researchers who studied neighborhoods after large California wildfires found that homes with fire-resistant roofs and cleared space around them were much more likely to survive. When a community combines firebreaks, nearby fire stations, and fire-safe homes, a fire that could have destroyed a town may pass by with far less damage.']],
 dok2:[
 {q:'According to paragraph 1, why are more neighborhoods in danger from wildfires?',o:['Firefighters have moved away from forests.','More people are building homes at the edge of forests.','Forests are growing into the middle of cities.','Grassland is being turned into farms.'],a:1,ex:'Paragraph 1: “As more people build homes at the edge of forests… more neighborhoods sit directly in the path.”'},
 {q:'According to paragraph 2, why did putting out every small fire make later fires worse?',o:['Firefighters ran out of water.','Small fires stopped new trees from growing.','Dead branches and brush piled up, giving future fires more fuel.','It made summers hotter.'],a:2,ex:'Paragraph 2: it “allowed dead branches and brush to pile up,” and “extra fuel makes it burn hotter.”'},
 {q:'How does a firebreak help stop a wildfire?',o:['It removes fuel, so the fire slows down and firefighters can stop it.','It sprays water on the flames automatically.','It warns people to leave their homes.','It blocks the wind from blowing embers.'],a:0,ex:'Paragraph 3: the fire “runs out of fuel and slows down, giving firefighters a chance to stop it.”'}],
 dok3:[
 {q:'The author states that most homes are lit by flying embers, not by the wall of flames. Which solution does this fact support most strongly?',o:['Putting out every small fire quickly','Building more homes at the forest edge','Fire-safe homes with ember screens and metal or tile roofs','Planting more trees close to houses'],a:2,ex:'If embers are the main danger, homes need roofs and vent screens that embers cannot ignite (paragraph 4).'},
 {q:'Pine Valley’s mayor says, “We’ll build one big fire station. We don’t need firebreaks or fire-safe homes.” Based on the passage, how would you evaluate this plan?',o:['It is strong, because fire stations are the only solution the author trusts.','It is weak, because the author says the steps work best together, and firebreaks slow fires so crews can stop them.','It is strong, because embers cannot reach homes near a fire station.','It is weak, because the author says fire stations make fires spread faster.'],a:1,ex:'Paragraph 5 opens with “These steps work best together.” One station alone leaves fuel and embers unchecked.'}]},
{id:'hurricane',title:'Holding Back the Sea',teaser:'Storm surge is a hurricane’s deadliest weapon. Walls, dunes, and shelters push back.',

 paras:[

function tileAt(e){const r=cv.getBoundingClientRect();const x=Math.floor((e.clientX-r.left)/(r.width/W)),y=Math.floor((e.clientY-r.top)/(r.height/H));return(x>=0&&y>=0&&x<W&&y<H)?y*W+x:null}

function growthChecklist(i){
  const s=sim,z=zoneOf(state.b[i]),L=state.lv[i]||0,cap=capLevel(i,s);
  const dem={R:s.dR,C:s.dC,I:s.dI}[z],meter={R:'Homes',C:'Shops',I:'Jobs'}[z];
  const want={R:'more homes',C:'more shops',I:'more factories'}[z];
  const demFix={R:'Create jobs: zone Commercial or Industrial land.',C:'Grow more homes so shops have customers.',I:'Grow more homes so factories have workers.'}[z];
  const pOver=s.pcap&&s.puse>s.pcap,wOver=s.wcap&&s.wuse>s.wcap;
  const items=[
    [s.road[i],'Touches a road','Connect it to a road.'],
    [s.power[i],'Has power',pOver?'Power is overloaded. Build another Power Plant or Solar Farm.':'Connect it to a Power Plant or Solar Farm with a road or power line.'],
    [s.water[i],'Has water',wOver?'Water is maxed out. Build another Water Treatment plant or Pump Station.':'Connect it by road to a Water Treatment plant or Pump Station.'],
    [dem>0,`People want ${want} (${meter} meter ${dem>0?'+':''}${Math.round(dem)})`,demFix]];
  if(z!=='I')items.push(L>=3?[true,'Already the biggest size','']:[L<cap,`Land value ${s.val[i]} allows up to: ${LVNAME[z][cap]}`,'Raise land value: build Parks nearby and keep smoke away.']);
  if(z==='R')items.push([s.pol[i]<=45,`Air is clean enough (smoke ${s.pol[i]})`,'Too smoky, so families move out. Keep factories and coal power 4+ tiles away, or use a Solar Farm.']);
  const allOk=items.every(x=>x[0]);
  const sum=L>=3&&allOk?'This zone is fully grown.':allOk?'Everything is ready. It has a 60% chance to grow when the day ends.':'Fix the ✗ items so it can grow.';
  return `<div class="checklist"><b>Why isn’t this growing?</b><ul>${items.map(([ok,label,fix])=>`<li><span class="${ok?'ok':'no'}" aria-label="${ok?'Yes':'No'}">${ok?'✓':'✗'}</span><span>${esc(label)}${!ok&&fix?`<small>${esc(fix)}</small>`:''}</span></li>`).join('')}</ul><p>${sum}</p></div>`;
}
function renderInfo(){

    if(isLand(i)&&t&&destroyable(t)){const ps=HKEYS.map(h=>[h,protFor(i,h)]).filter(([,p])=>p.src.length);if(ps.length)line+=` · Protected from: ${ps.map(([h])=>HAZ[h].name).join(', ')}`}

// ---------- Actions ----------
function validate(i,tool){
  const t=terr[i],d=DEF(tool);
  if(tool==='bridge'){if(t!=='river')return'Bridges can only be built on river tiles. Use Road on land.'}else if(!isLand(i))return'You can’t build on water. Build a Bridge to cross the river.';
  if(t==='forest')return'This is protected state forest. Build next to it instead.';
  if(state.b[i])return'This lot is taken. Use Bulldoze to clear it first.';
  if(state.pl[i]&&!linesOK(tool))return'A power line runs here. Only Residential or Commercial zones can go under it. Tap the line with the Power Line tool to remove it.';
  if(STRATS[tool]&&!unlocked(tool))return`${d.name} is locked. Finish the standard questions for “${PBY[d.from[0]].title}” in the Library.`;
  if(d.rule==='river1'&&dRiver[i]>1)return`A ${d.name} must be built right next to the river.`;
  if(d.rule==='river2'&&dRiver[i]>2)return`A ${d.name} must be within 2 tiles of the river.`;
  if(d.rule==='forest1'&&dForest[i]>1)return`A ${d.name} must be built right next to the forest.`;
  if(d.rule==='sand'&&t!=='sand')return`${d.name} must be built on the sandy coastline.`;
  if(state.money<d.cost)return`You need ${money(d.cost)} but have ${money(state.money)}. Read a passage in the Library to earn more.`;
  return null;
}
function place(i,tool){const d=DEF(tool);state.money-=d.cost;state.b[i]=tool;state.lv[i]=0;save();say(`Built ${d.name} for ${money(d.cost)}.${zoneOf(tool)?' It will grow when it has a road, power, water, and demand.':''}`,'good');renderAll()}
function act(i){
  const tool=ui.tool;
  if(!tool||tool==='inspect'){ui.inspect=i;draw();renderInfo();return}
  if(tool==='powerline'){
    if(state.pl[i]){state.pl[i]=false;state.money+=5;save();say('Removed the power line. You got $5 back.','good');renderAll();return}
    const t=state.b[i],tr=terr[i];
    if(tr==='ocean')return say('Power lines can\u2019t go in the ocean.','bad');
    if(tr==='forest')return say('This is protected state forest. Run the line around it.','bad');
    if(t&&roadLike(t))return say('Roads already carry power. Put power lines where there is no road.','bad');
    if(t&&!linesOK(t))return say('Power lines can only cross empty land, the river, and Residential or Commercial zones.','bad');
    if(state.money<10)return say('A power line costs $10.','bad');
    state.money-=10;state.pl[i]=true;save();say('Built a power line for $10.','good');renderAll();return}
  if(tool==='bulldoze'){
    const t=state.b[i];if(!t){if(state.pl[i]){state.pl[i]=false;state.money+=5;save();say('Removed the power line. You got $5 back.','good');renderAll();return}return say('Nothing to clear here.','bad')}
    if(t==='rubble'){if(state.money<20)return say('Clearing rubble costs $20.','bad');state.money-=20;state.b[i]=null;state.lv[i]=0;save();say('Cleared the rubble for $20.','good');renderAll();return}
    const d=DEF(t),refund=Math.floor(d.cost/2);state.money+=refund;state.b[i]=null;state.lv[i]=0;save();say(`Bulldozed the ${d.name}. You got ${money(refund)} back, half of what it cost.`,'good');renderAll();return}
  const err=validate(i,tool);if(err)return say(err,'bad');
  if(STRATS[tool]&&!state.permits[tool])return openPermit(tool,i);
  place(i,tool);
}
function endDay(auto){
  const s=analyze();state.money=Math.max(0,state.money+s.income);state.lastIncome=s.income;
  const g=growCity();state.year++;state.dayMs=DAY_MS;
  say(`${auto?'Midnight! ':''}Day ${state.year} begins. The city earned ${money(s.income)}. ${g.grew} zone${g.grew===1?'':'s'} grew${g.shrank?`, ${g.shrank} shrank`:''}.`,s.income>=0?'good':'bad');
  if(state.year>=state.nextYear){if(ui.modal)state.disasterDue=true;else runDisaster(nextHazard(),true)}
  save();renderAll();
}
function tornadoPath(){const y0=Math.random()*(H-2),y1=Math.random()*(H-2);const s=new Set();for(let x=0;x<W;x++){const y=Math.round(y0+(y1-y0)*x/(W-1));s.add(y*W+x);if(y+1<H)s.add((y+1)*W+x)}return s}
function runDisaster(h,scheduled){
  state.disasterDue=false;
  const path=h==='tornado'?tornadoPath():null;
  let atRisk=0,lostHigh=0,saved=0,hurt=0;const lost=[],zone=[];
  for(let i=0;i<N;i++){if(highRisk(h,i,path)&&isLand(i))zone.push(i)}
  const before=state.b.slice(),blv=state.lv.slice();
  for(let i=0;i<N;i++){
    const t=before[i];if(!destroyable(t))continue;const c=zoneChance(h,i,path);if(c<=0)continue;
    const hi=highRisk(h,i,path);const pr=protFor(i,h);if(hi)atRisk++;
    if(Math.random()<c*(1-pr.p)){lost.push(i);if(hi)lostHigh++;
      if(isHome(t)&&h!=='drought'){for(let k=0;k<RES[blv[i]||0];k++)if(Math.random()<.5*(1-pr.h))hurt++}}
    else if(hi&&pr.p>0)saved++;
  }
  for(const i of lost){state.b[i]='rubble';state.lv[i]=0}
  const cost=hurt*10;state.money=Math.max(0,state.money-cost);
  const pct=atRisk?Math.round(100*(atRisk-lostHigh)/atRisk):100;
  const grade=pct>=90?'A':pct>=75?'B':pct>=60?'C':pct>=40?'D':'F';
  const used=new Set();for(let i=0;i<N;i++){const s=STRATS[before[i]];if(s&&s.prot[h])used.add(s.name)}
  const rec={year:state.year,h,atRisk,lost:lost.length,saved,hurt,cost,pct,grade,solutions:[...used]};
  state.history.push(rec);state.last={h,zone,lost,year:state.year};state.pending=state.history.length-1;
  journal('disaster',`${HAZ[h].name} · grade ${grade}`,`${atRisk} buildings were in the danger zone. ${lost.length} lost, ${hurt} residents hurt. Solutions in place: ${rec.solutions.length?rec.solutions.join(', '):'none'}.`);
  if(scheduled){state.dIndex++;state.nextHaz=null;state.nextYear=state.year+DISASTER_GAP}
  ui.overlay='last';$('#overlay').value='last';
  save();renderAll();openReport(state.pending);
}

  <li><b>Zone and grow.</b> Zone land for homes (R), shops (C), and jobs (I). Zones grow bigger when they touch a road with a Power Plant and Water Treatment plant, when people want them (see the Demand meters), and when land value is high. Keep smoky factories away from homes, and add parks.</li>

// ---------- Reader ----------
function openReader(pid,step){rs(pid);ui.reader={pid,step:step||(dok2Done(pid)?3:state.read[pid].roles.submitted?2:1)};ui.modal='reader';renderReader(true)}
function qState(pid,key){const r=rs(pid);if(!r.q[key])r.q[key]={tries:0,done:false,correct:false,earned:0,choice:null,just:''};return r.q[key]}
function renderQ(p,kind,k){
  const key=kind+'-'+k;const Q=(kind==='d2'?p.dok2:p.dok3)[k];const s=qState(p.id,key);const full=kind==='d2'?PAY.d2:PAY.d3;
  const ch=s.done?s.choice:(ui.choices[p.id+key]??null);
  let h=`<div class="q"><div class="qh"><span>${kind==='d2'?'DOK 2 · Question '+(k+1):'DOK 3 · Bonus '+(k+1)}</span><span>${s.done?(s.earned?'+'+money(s.earned):'$0'):money(s.tries?full/2:full)}</span></div><div class="qt">${esc(Q.q)}</div><div class="choices">`;
  Q.o.forEach((o,j)=>{let cls='choice';if(s.done){cls+=' disabled';if(j===Q.a)cls+=' right';else if(j===s.choice)cls+=' wrong'}
    h+=`<label class="${cls}"><input type="radio" name="${key}" value="${j}" ${ch===j?'checked':''} ${s.done?'disabled':''} data-q="${key}"> <span>${esc(o)}</span></label>`});
  h+='</div>';
  if(kind==='d3'){const dv=s.done?s.just:(ui.drafts[p.id+key]||'');
    h+=`<label for="j-${key}"><b>Explain your thinking.</b> Use at least 15 words and a detail or quote from the passage.</label><textarea id="j-${key}" data-just="${key}" ${s.done?'readonly':''}>${esc(dv)}</textarea><div class="wc" data-wc="${key}">${words(dv)} words</div>`}
  if(s.done)h+=s.correct?`<div class="feedback good">Correct! +${money(s.earned)}. <span>${esc(Q.ex)}</span></div>`:`<div class="feedback bad">The best answer is: ${esc(Q.o[Q.a])} <span>${esc(Q.ex)}</span></div>`;
  else{if(s.tries===1)h+=`<div class="feedback bad">Not quite. Look back at the passage and try once more for half credit.</div>`;
    if(ui.qerr&&ui.qerr.key===key)h+=`<div class="feedback bad">${esc(ui.qerr.msg)}</div>`;
    h+=`<div><button class="btn primary" data-check="${key}">Check answer</button></div>`}
  return h+'</div>';
}
function renderReader(first){
  const {pid,step}=ui.reader;const p=PBY[pid];const r=rs(pid);const hz=HAZ[pid];const e=earned(pid);
  const qp=modal.querySelector('.qpane');const keep={o:modal.scrollTop,q:qp?qp.scrollTop:0};
  let paras=p.paras.map(([role,text],k)=>{
    let ctl='';
    if(!r.roles.submitted){ctl=`<label class="sr" for="role-${k}">Role of paragraph ${k+1}</label><select id="role-${k}" data-role="${k}"><option value="">Tag this paragraph…</option>${Object.entries(ROLES).map(([v,l])=>`<option value="${v}" ${r.roles.picks[k]===v?'selected':''}>${l}</option>`).join('')}</select>`}
    else{const pk=r.roles.picks[k];ctl=pk===role?`<span class="tag ok">✓ ${ROLES[role]}</span>`:`<span class="tag no">You chose ${ROLES[pk]||'nothing'}</span><span class="tag ok">Answer: ${ROLES[role]}</span>`}
    return `<div class="para"><span class="pn">¶${k+1}</span><p>${esc(text)}</p><div class="role">${ctl}</div></div>`}).join('');
  const d2=dok2Done(pid);
  let q=`<div class="steptabs" role="tablist">
    <button data-step="1" aria-selected="${step===1}">1 · Map the structure</button>
    <button data-step="2" aria-selected="${step===2}">2 · Standard (DOK 2)</button>
    <button data-step="3" aria-selected="${step===3}">3 · Bonus (DOK 3)</button></div>`;
  if(step===1){
    const n=r.roles.picks.filter(Boolean).length;
    q+=`<p>Problem and solution texts follow a pattern. Tag each paragraph in the passage with its job. Each correct tag earns ${money(PAY.role)}.</p>
    <dl class="bank"><dt>Problem</dt><dd>problem, danger, threat, risk, challenge</dd><dt>Cause</dt><dd>because, why, one reason, causes, makes it worse</dd><dt>Solution</dt><dd>one solution, another, to solve, can help, method</dd><dt>Result</dt><dd>as a result, made a difference, shows, studies found</dd></dl>`;
    if(r.roles.submitted)q+=`<div class="feedback good">You tagged ${r.roles.correct} of 5 correctly and earned ${money(r.roles.earned)}. <span>Check the tags beside each paragraph, then move to Step 2.</span></div><div><button class="btn primary" data-step="2">Go to standard questions</button></div>`;
    else q+=`<div class="wc">${n} of 5 tagged</div><div><button class="btn primary" id="roles-submit" ${n<5?'disabled':''}>Check my structure map</button></div>`;
  }else if(step===2){
    if(!r.roles.submitted)q+=`<div class="lockbox">Map the structure in Step 1 first.</div>`;
    else{q+=`<p>Each correct answer earns ${money(PAY.d2)} (${money(PAY.d2/2)} on a second try). Finishing all three unlocks: <b>${p.unlocks.map(k=>esc(STRATS[k].name)).join(', ')}</b>.</p>`;q+=p.dok2.map((_,k)=>renderQ(p,'d2',k)).join('');
      if(d2)q+=`<div class="feedback good">Solutions unlocked! <span>Find them in the Build tab, or try the bonus questions.</span></div><div><button class="btn primary" data-step="3">Try the bonus challenge</button></div>`}
  }else{
    if(!d2)q+=`<div class="lockbox">Finish the standard questions in Step 2 to open the bonus challenge.</div>`;
    else{q+=`<p>Bonus questions ask you to <b>evaluate</b> solutions and <b>apply</b> them to new situations. A correct answer with a strong explanation earns ${money(PAY.d3)}. Your explanations go in your journal for your teacher.</p>`;q+=p.dok3.map((_,k)=>renderQ(p,'d3',k)).join('')}
  }
  const html=`<div class="reader" role="dialog" aria-modal="true" aria-labelledby="rt" style="--c:var(${hz.color})">
    <div class="rhead"><div><div class="eyebrow">${hz.name} · Problem &amp; solution passage</div><h2 id="rt">${esc(p.title)}</h2></div>
    <div class="meters"><span class="pill ${d2?'ok':''}">Standard ${money(e.s)} / ${money(MAX_STD)}</span><span class="pill ${dok3Done(pid)?'bonus':''}">Bonus ${money(e.b)} / ${money(MAX_BONUS)}</span><span class="pill">Budget ${money(state.money)}</span><button class="btn small" data-close>Close</button></div></div>
    <div class="rbody"><article class="passage">${paras}</article><section class="qpane">${q}</section></div></div>`;
  modal.innerHTML=html;if(first){modal.hidden=false;document.body.style.overflow='hidden';modal.scrollTop=0}else{modal.scrollTop=keep.o;const np=modal.querySelector('.qpane');if(np)np.scrollTop=keep.q}
  ui.qerr=null;
}
function checkQ(key){
  const {pid}=ui.reader;const p=PBY[pid];const kind=key.slice(0,2),k=+key.slice(3);const Q=(kind==='d2'?p.dok2:p.dok3)[k];const s=qState(pid,key);
  const ch=ui.choices[pid+key];if(ch==null){ui.qerr={key,msg:'Choose an answer first.'};return renderReader()}
  if(kind==='d3'){const t=ui.drafts[pid+key]||'';if(words(t)<15){ui.qerr={key,msg:`Your explanation has ${words(t)} words. Write at least 15.`};return renderReader()}
    if(!hasEvidence(t,pid)){ui.qerr={key,msg:'Add evidence: use a fact, a key term, or a quote from the passage.'};return renderReader()}s.just=t}
  s.tries++;s.choice=ch;const full=kind==='d2'?PAY.d2:PAY.d3;
  if(ch===Q.a){s.done=true;s.correct=true;s.earned=s.tries===1?full:full/2;state.money+=s.earned;say(`Correct! +${money(s.earned)}`,'good')}
  else if(s.tries>=2){s.done=true;s.earned=0}
  if(kind==='d3'&&s.done)journal('dok3',`${p.title}: ${Q.q}`,`Answer: ${Q.o[ch]} (${s.correct?'correct':'incorrect'}). Explanation: ${s.just}`);
  const r=rs(pid);if(dok2Done(pid)&&!r.announced){r.announced=true;journal('unlock',`Unlocked ${p.unlocks.map(x=>STRATS[x].name).join(', ')}`,`Finished the standard questions for “${p.title}.”`)}
  save();renderReader();renderHeader();
}
function submitRoles(){const {pid}=ui.reader;const p=PBY[pid];const r=rs(pid);let c=0;p.paras.forEach(([role],k)=>{if(r.roles.picks[k]===role)c++});r.roles.submitted=true;r.roles.correct=c;r.roles.earned=c*PAY.role;state.money+=r.roles.earned;save();renderReader();renderHeader()}

function buildReport(){
  const ec=economy();const L=[];
  L.push('RESILIENT CITY — PLANNER REPORT');
  L.push(`Planner: ${state.student||'(no name)'}   City: ${state.city||'(unnamed)'}   Day: ${state.year}`);
  L.push(`Residents: ${ec.pop}   Budget: ${money(state.money)}`);
  L.push('');L.push('DISASTERS');
  if(!state.history.length)L.push('  None yet.');
  state.history.forEach(r=>L.push(`  Day ${r.year} ${HAZ[r.h].name}: grade ${r.grade} (${r.pct}% of at-risk buildings saved, ${r.lost} lost, ${r.hurt} hurt). Solutions: ${r.solutions.join(', ')||'none'}`));
  L.push('');L.push('READING (problem & solution passages)');
  PASSAGES.forEach(p=>{const r=state.read[p.id];if(!r){L.push(`  ${p.title}: not started`);return}const e=earned(p.id);
    const d2=p.dok2.map((_,k)=>{const s=r.q['d2-'+k];return s&&s.done?(s.correct?(s.tries===1?'✓':'✓(2nd)'):'✗'):'-'}).join(' ');
    const d3=p.dok3.map((_,k)=>{const s=r.q['d3-'+k];return s&&s.done?(s.correct?(s.tries===1?'✓':'✓(2nd)'):'✗'):'-'}).join(' ');
    L.push(`  ${p.title}: structure ${r.roles.submitted?r.roles.correct+'/5':'-'} | DOK 2 ${d2} | DOK 3 ${d3} | earned ${money(e.s)} standard + ${money(e.b)} bonus`)});
  const sect=(type,title)=>{const js=state.journal.filter(j=>j.type===type);if(!js.length)return;L.push('');L.push(title);js.forEach(j=>{L.push(`  [Day ${j.year}] ${j.title}`);if(j.text)L.push(`    ${j.text}`)})};
  sect('dok3','DOK 3 EXPLANATIONS');sect('permit','BUILDING PERMITS (problem → solution)');sect('plan','REBUILDING PLANS');
  return L.join('\n');
}

function boot(data){
  state=(data&&data.state)||load()||fresh();
  if(!Array.isArray(state.lv))state.lv=state.b.map(t=>zoneOf(t)?1:0);
  if(typeof state.dayMs!=='number')state.dayMs=DAY_MS;
  if(!Array.isArray(state.pl)||state.pl.length!==N)state.pl=Array(N).fill(false);
  if(data&&data.ui)Object.assign(ui,data.ui,{reader:null,modal:null});
  if(ui.tab==='build')ui.tab='library';
  if(!ui.drawers)ui.drawers=loadDrawers();
  const notes=[];
  if(state.migrated!=null){notes.push(`The map got bigger! Your reading progress and money are saved${state.migrated?`, and ${money(state.migrated)} was refunded for buildings on the old map`:''}.`);delete state.migrated}
  if(state.utilGrant){notes.push('New: buildings now need power and water. You received a $250 grant to build a Power Plant and Water Treatment plant on your roads.');delete state.utilGrant}
  if(notes.length){save();setTimeout(()=>say(notes.join(' '),'good'),0)}
  $('#overlay').value=ui.overlay||'';
  renderAll();resize();lastTick=performance.now();
  if(state.pending!=null&&state.history[state.pending])openReport(state.pending);
  else if(!state.seenIntro)openIntro();
}
window.claude?.hot?.snapshot?.(()=>({state,ui:{tab:ui.tab,tool:ui.tool,overlay:ui.overlay,drawers:ui.drawers,drafts:ui.drafts,choices:ui.choices}}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
})();
</script>
