                    "+Recess also teaches skills that are hard to learn from a textbook. When students make up rules for a game, take turns on the swings, or settle an argument about who was tagged, they are practicing teamwork, fairness, and problem solving.",
                    "Although some school boards believe cutting recess increases academic instruction time, evidence clearly shows that active breaks lead to higher test scores and better social behavior. Students who play outside come back to class ready to learn.",
                    "Some people worry that recess is unsafe because children might get hurt on the playground. However, adults can supervise recess, and schools can keep equipment in good repair. The benefits of play are far greater than the risk of a scraped knee.",
                    "+Students agree that recess matters. \"Recess is my favorite time because I get to play tag with my friends,\" said one fourth grader. Another student said that recess helps her calm down after a hard test.",
                    "+Some countries give students even more playtime. In Finland, many students get a 15-minute break after every 45 minutes of class, and Finnish students are known for doing very well in school.",
                    "Schools should protect recess instead of cutting it. Principals and school boards can make sure every student gets at least 30 minutes of outdoor play every day.",
                    "Recess is undeniably the best part of the school day. It keeps students healthy, happy, and ready to learn. Let's make sure every child has time to play."
                ] },
                { id: 'school-garden', genre: 'nonfiction', title: "Persuasive Article: Every School Needs a Garden", text: [
                    "Every school should have a garden. A school garden gives students a place to learn, grow healthy food, and enjoy the outdoors.",
                    "First, gardens help students learn science in a hands-on way. Instead of only reading about seeds and soil, students can plant seeds, measure how fast they grow, and watch insects pollinate flowers. Teachers report that students remember lessons better when they can touch and see what they are learning.",
                    "+Gardens can teach math, too. Students can measure garden beds, count seeds, and graph how many tomatoes each plant produces. Even writing improves when students keep garden journals.",
                    "Second, gardens encourage healthy eating. Studies show that children who grow vegetables are more likely to eat them. A carrot you pulled from the ground yourself simply tastes better than one from a bag.",
                    "+Some school gardens grow enough food to share. Students can bring vegetables home to their families or donate extra food to a local food pantry.",
                    "Some people argue that gardens cost too much money and take too much time. However, a garden can start small, with just a few raised beds. Many families, local stores, and community groups are happy to donate seeds, soil, and tools.",
                    "+Others worry that no one will care for the garden during the summer. But volunteers, families, and summer camps can take turns watering and weeding. In some towns, the whole community has helped.",
                    "Finally, gardens give students a peaceful place to relax. Spending time outdoors, surrounded by green plants, can help students feel calm and happy.",
                    "+One fourth grader said, \"The garden is my favorite place at school because I can see my sunflowers growing.\" Her classmate agreed and said that gardening helped him make new friends.",
                    "A school garden is the most wonderful gift a school can give its students. Principals, teachers, and families should work together to plant one at every school."
                ] },
                { id: 'library-card', genre: 'nonfiction', title: "Persuasive Article: Every Student Needs a Library Card", text: [
                    "Every student should have a public library card. A library card is free, and it opens the door to books, learning, and fun all year long.",
                    "First, a library card gives students access to thousands of books. Families do not have to spend money to find great stories. Students who read more often become stronger readers, and reading every day helps build vocabulary.",
                    "+Libraries are not just about books. Many libraries lend audiobooks, movies, and board games. Some even have 3D printers and robotics kits that kids can use for free.",
                    "Second, libraries keep students learning during the summer. Studies show that students who do not read over the summer can lose some of the reading skills they gained during the school year. Free summer reading programs help keep kids' minds active.",
                    "+Libraries also offer homework help, story times, and clubs. Librarians can help students find exactly the right book for a report or just for fun.",
                    "Some people say that students do not need library cards because they can read on tablets and phones. However, many families do not own enough devices for every child, and many libraries lend e-books for free with a library card.",
                    "+Others say the library is too far away. But many libraries have bookmobiles that visit neighborhoods, and some let families return books at drop boxes around town.",
                    "Finally, a library card teaches responsibility. Students learn to take care of borrowed books and return them on time.",
                    "+One fourth grader said, \"Getting my own library card made me feel grown up.\" Her brother said the summer reading prizes were the best part.",
                    "Getting a library card is the most important thing a student can do this year. Parents and teachers should help every child sign up today."
                ] },
            ],
            '4.RC.9': [
                { id: 'solar', genre: 'nonfiction', title: "Paired Passages on Solar Energy", text: [
                    "<strong>Text A: Clean Power from the Sun.</strong> Solar panels turn sunlight into electricity without burning fossil fuels. They produce clean energy and help keep our air clean.",
                    "+For many years, most electricity in the United States has come from power plants that burn coal, oil, or natural gas. When these fossil fuels burn, they release smoke and gases into the air. Some of these gases trap heat around Earth and add to climate change.",
                    "A solar panel is made of many small parts called solar cells. When sunlight hits a cell, it knocks tiny particles loose inside the material, and those moving particles create an electric current. The panel makes power silently, with no smoke and no moving parts.",
                    "+Unlike coal or oil, sunlight will not run out. The sun will keep shining for billions of years, so solar power is called a renewable resource. Using it means less digging and drilling for fuel.",
                    "Every home or school that switches to solar power helps reduce pollution. Cleaner air means healthier lungs for people and a healthier planet for plants and animals.",
                    "<strong>Text B: Solar Panels and Your Wallet.</strong> Installing solar panels can be expensive at first, but over time, homes save money on electricity bills because sunlight is completely free.",
                    "+A set of rooftop panels for one house can cost thousands of dollars. Families must pay for the panels, the wiring, and the workers who install them. For many families, that is a big decision.",
                    "Once the panels are working, they make electricity every sunny day. The family buys less electricity from the power company, so the monthly bill shrinks. In some months, the bill might be close to zero.",
                    "+Many families find that the savings add up. After several years, the money they saved on bills can equal the money they spent on the panels. After that, the savings are like extra money in their pocket.",
                    "Before buying panels, families should compare prices and think about how much sun their roof gets. A home with a sunny, south-facing roof will usually save the most money."
                ] },
                { id: 'dogs', genre: 'nonfiction', title: "Paired Passages: Dogs on the Job", text: [
                    "<strong>Text A: Service Dogs.</strong> Service dogs are specially trained to help people with disabilities live more independently. A service dog might guide a person who is blind across a busy street, pick up dropped objects, or alert a person who is deaf when the doorbell rings.",
                    "+Puppies in training first learn basic commands like sit, stay, and come. Later, they practice harder tasks, such as opening doors, carrying bags, and turning on light switches.",
                    "Training a service dog takes about two years. Service dogs must stay calm in crowded places like grocery stores, buses, and restaurants. They learn to ignore loud noises, other animals, and tasty food on the floor.",
                    "+When a service dog is wearing its working vest, it is on duty. People should never pet or distract a working dog without asking its owner first, because the dog needs to focus on its job.",
                    "For many owners, a service dog is more than a helper. It is a loyal partner and friend that is by their side every day.",
                    "<strong>Text B: Search and Rescue Dogs.</strong> Search and rescue dogs use their powerful noses to find people who are lost or trapped. A dog's sense of smell is many thousands of times stronger than a human's.",
                    "+These dogs search for hikers lost in forests, skiers buried by avalanches, and people trapped under buildings after earthquakes. Some can even find people underwater while riding in a boat.",
                    "Rescue dogs also train for about two years. They practice following a scent through woods, over rocks, and across rubble. When a dog finds a person, it barks to alert its handler.",
                    "+Rescue work is hard and sometimes dangerous. Handlers protect their dogs' paws with special boots and give them plenty of rest and water between searches.",
                    "Every year, search and rescue dogs help save many lives. To their handlers, they are both heroes and best friends."
                ] },
                { id: 'balloons', genre: 'nonfiction', title: "Paired Passages: Up, Up, and Away", text: [
                    "<strong>Text A: The First Hot Air Balloons.</strong> In 1783, two brothers in France named Joseph and Etienne Montgolfier built a giant balloon out of cloth and paper. They lit a fire beneath it, and the balloon rose into the sky.",
                    "+The brothers had noticed that smoke and hot air always rise. They wondered whether a large bag filled with hot air could rise too. After many small tests, they were ready to try a big one.",
                    "Hot air balloons rise because hot air is lighter than the cooler air around it. When the air inside the balloon is heated, the balloon floats upward. When the air cools, the balloon slowly comes back down.",
                    "+The first passengers in a hot air balloon were not people. In September 1783, a sheep, a duck, and a rooster rode in a basket below a balloon for about eight minutes and landed safely.",
                    "Two months later, the first people flew in a hot air balloon over the city of Paris. Today, people still ride hot air balloons for fun, drifting quietly over fields and rivers.",
                    "<strong>Text B: Weather Balloons.</strong> Twice a day, at hundreds of places around the world, weather scientists release large balloons into the sky. These balloons are filled with helium or hydrogen, gases that are lighter than air.",
                    "+A small box called a radiosonde hangs below each balloon. As the balloon rises, the box measures temperature, wind, and how much water is in the air, and it sends the information back to the ground by radio.",
                    "A weather balloon can rise about 20 miles into the sky, much higher than airplanes fly. As it climbs, the air around it gets thinner, so the balloon stretches bigger and bigger until it finally pops.",
                    "+After the balloon pops, a small parachute carries the box gently back to Earth. Some boxes are found by people who mail them back to the weather service.",
                    "Scientists use the information from weather balloons to predict storms, rain, and snow. Every time you check a weather forecast, a balloon may have helped make it."
                ] },
            ],
            '4.RC.11': [
                { id: 'word-power', genre: 'both', title: "Passage: Word Power in Action", text: [
                    "Language is full of interesting relationships. Some words sound alike, some are spelled alike, and some mean nearly the same thing. Learning how words are connected helps readers understand what they read and helps writers say exactly what they mean.",
                    "Words that sound the same can have entirely different meanings, like the bark of a dog versus the bark of a tree. Words that are spelled and pronounced the same but have different meanings are called homonyms, or multiple-meaning words. A bat can fly through the night sky, or it can hit a baseball.",
                    "+Homographs are words that are spelled the same but may be pronounced differently. When you wind a toy, you say it with a long i sound. When the wind blows, you say it with a short i sound. Readers must use the rest of the sentence to decide which word makes sense.",
                    "Homophones are words that sound the same but are spelled differently and have different meanings. Their, there, and they're are homophones that confuse many writers. So are to, too, and two, and ate and eight.",
                    "+A good way to remember homophones is to look for clues inside the word. \"Hear\" has the word \"ear\" inside it, and you hear with your ears. \"Here\" is spelled like \"there\" and \"where,\" and all three words tell about places.",
                    "Understanding synonyms and antonyms helps writers expand their vocabulary and express exact ideas clearly. Synonyms are words with similar meanings, such as big, large, and enormous. Antonyms are words with opposite meanings, such as hot and cold or early and late.",
                    "+Synonyms are not always exactly the same. \"Giggle,\" \"chuckle,\" and \"roar\" all describe laughing, but they paint very different pictures. A careful writer chooses the synonym that fits the feeling best.",
                    "+Antonyms can help readers figure out new words. In the sentence \"Unlike his timid brother, Marcus was bold and brave,\" the word \"unlike\" signals an opposite. If Marcus is bold, then \"timid\" must mean shy or easily frightened.",
                    "Context clues help readers choose the right meaning of a multiple-meaning word. In \"The pitcher threw a fast ball,\" a pitcher is a baseball player. In \"Please fill the pitcher with lemonade,\" a pitcher is a container for pouring.",
                    "The more you notice how words are related, the stronger your reading and writing will become. Next time you read, look for homophones, homographs, synonyms, and antonyms hiding in the sentences."
                ] },
                { id: 'mixed-message', genre: 'fiction', title: "Story: The Mixed-Up Message", text: [
                    "Theo wanted to surprise his friend Lena with a treasure hunt. He wrote her a note and slipped it into her backpack before the bus came.",
                    "The note said, \"Meat me at the bear tree at for o'clock. You will find a prize there. Don't be late!\"",
                    "+Theo was proud of his note. He even drew a little map with an X on it. But he had been in such a hurry that he never read it over.",
                    "When Lena read the note, she was confused. \"Meat?\" she said. \"Is this about lunch? And what is a bear tree? There are no bears in our neighborhood!\"",
                    "+Lena showed the note to her big sister, Mara, who laughed so hard that she snorted. \"I think Theo mixed up some homophones,\" Mara said. \"Those are words that sound the same but have different spellings and meanings.\"",

                    "+There was only one tree in the park with no leaves at all, a tall old oak that had been struck by lightning. Lena grabbed her coat and ran.",
                    "At four o'clock, Lena found Theo waiting under the bare oak tree. Next to him sat a small box wrapped in newspaper. Inside was a homemade friendship bracelet.",
                    "+\"Did my note make sense?\" Theo asked. Lena grinned and held up the paper. \"Sort of,\" she said. \"Next time, I'll bring a red pen.\"",

            '4.RC.12': [
                { id: 'word-building', genre: 'both', title: "Informational Text: Understanding Word Building", text: [
                    "Many English words originate from ancient Greek and Latin roots. A root is the main part of a word that carries its meaning. When you know a few common roots, you can often figure out words you have never seen before.",
                    "For example, the root \"bio\" means life, while \"geo\" means earth. Biology is the study of living things, and geology is the study of rocks and the earth. Both words end with \"logy,\" which means the study of something.",
                    "+The Greek root \"graph\" means to write or draw. An autograph is a person's own signature, a photograph is a picture made with light, and geography describes the earth and its places.",
                    "+The Latin root \"aud\" means to hear. An audience is a group of people who listen, something audible can be heard, and an auditorium is a large room where people gather to hear a performance.",
                    "Attaching prefixes like \"un-\" or suffixes like \"-able\" alters a word's core meaning, turning \"break\" into \"unbreakable.\" A prefix comes at the beginning of a word, and a suffix comes at the end.",
                    "Some of the most common prefixes are \"re-,\" which means again, \"pre-,\" which means before, and \"dis-,\" which means not or the opposite of. To reread a book is to read it again, to preheat an oven is to heat it before cooking, and to disagree is to not agree.",
                    "+Suffixes can change a word's meaning or its part of speech. Adding \"-ful\" means full of, so a joyful person is full of joy. Adding \"-less\" means without, so a fearless explorer is without fear. Adding \"-ness\" turns a describing word into a thing, as when \"kind\" becomes \"kindness.\"",
                    "+The Greek root \"tele\" means far. A telephone carries sound from far away, a telescope helps you see faraway objects, and television shows pictures sent from far away.",
                    "When you meet a long, unfamiliar word, try breaking it into parts. For \"unbelievable,\" cover the prefix and suffix to find the base word \"believe.\" Then add the meanings back: \"un-\" means not, and \"-able\" means able to be. Unbelievable means not able to be believed.",
                    "Learning roots and affixes is like collecting keys. Each new key unlocks dozens of words. The more keys you collect, the more doors you can open as a reader."
                ] },
                { id: 'word-lab', genre: 'fiction', title: "Story: The Word Lab", text: [
                    "Every Friday, Mr. Ortiz turned his classroom into the Word Lab. Students wore paper lab coats and safety goggles made from cardboard, and their job was to build new words.",
                    "\"Today's experiment uses prefixes,\" Mr. Ortiz announced. He held up a card that said <i>happy</i>. Then he put another card in front of it: <i>un-</i>. \"What happens when we mix them?\" \"Unhappy!\" the class shouted. \"It means not happy!\"",
                    "+Next, he tried <i>re-</i> with <i>read</i>, <i>pre-</i> with <i>heat</i>, and <i>dis-</i> with <i>agree</i>. Each time, the class called out the new word and its meaning. Priya kept a list in her lab notebook.",
                    "Then Mr. Ortiz moved on to suffixes. He placed <i>-ful</i> after <i>help</i> and <i>-less</i> after <i>fear</i>. \"Helpful means full of help,\" said Owen. \"And fearless means without fear,\" added Priya.",
                    "+Mr. Ortiz smiled. \"A suffix can change a word's meaning, and sometimes it changes how the word is used in a sentence.\" He showed how <i>kind</i> became <i>kindness</i>, a thing instead of a describing word.",
                    "For the final experiment, Mr. Ortiz brought out a jar labeled ROOTS. Inside were cards with Greek and Latin roots. Owen pulled out <i>tele</i>, which means far, and <i>scope</i>, which means to look at. \"Telescope!\" he said. \"A tool for looking at things far away.\"",
                    "+Priya pulled out <i>bio</i>, meaning life, and <i>logy</i>, meaning the study of. \"Biology is the study of living things,\" she said. The class cheered as if she had discovered a new planet.",
                    "Then came the challenge. Each team had to invent a brand-new word using real word parts and explain its meaning. Owen and Priya whispered, scribbled, and erased until they had it.",
                    "+Other teams invented words like <i>unbreakfastable</i>, which they said meant too sleepy to eat breakfast, and <i>telesnack</i>, a snack you eat while watching from far away. Everyone laughed.",
                    "Owen and Priya held up their card: <i>rehappyful</i>. \"It means full of happiness again,\" Priya explained. Mr. Ortiz laughed. \"Not a real word,\" he said, \"but you used every part correctly. That is real word building.\""
                ] },

                { id: 'natures-symphony', genre: 'fiction', title: "Story: Nature's Symphony", text: [
                    "The wind whispered secrets through the swaying pine branches. I lay in bed with the covers pulled up to my chin, listening as the evening turned into a stormy night.",
                    "Outside my bedroom window, rain tapped gently on the glass like a playful visitor. Tap, tap, tap. It seemed to be asking if I could come outside and play.",
                    "+At first, the storm was soft and polite. The clouds drifted across the sky like gray sheep wandering through a field, and the streetlight glowed like a lonely lighthouse at the end of the block.",
                    "My blanket was as warm as a sunbeam, wrapping me in comfort while the thunderstorm played its noisy midnight symphony outside. Thunder was the bass drum, booming so loudly it could have woken the whole world.",
                    "+The raindrops became the snare drums, rattling on the roof faster and faster. The gutters gurgled and sang along, and the old maple tree waved its arms like a conductor leading the orchestra.",
                    "Then the lightning flashed like a jagged silver sword across the dark night sky. For one bright second, my whole room lit up, and I could see every toy on my shelf. My cat, Pepper, was a furry statue at the foot of my bed.",
                    "+Pepper's ears twitched with every boom. She is the bravest cat in the universe during the day, chasing leaves and pouncing on shoelaces, but storms turn her into a nervous little ball of fur.",
                    "+I reached down and pulled her close. \"It's just the sky singing,\" I whispered. Her purr started up like a tiny motor, and the storm suddenly seemed a little less wild.",
                    "Slowly, the music outside began to fade. The thunder grumbled once more, like an old man complaining as he walked away. The rain softened to a whisper, and the wind hummed a quiet lullaby.",
                    "By morning, the storm had packed up its instruments and tiptoed away. Sunshine poured through my window like warm honey, and the whole world sparkled as if it had been scrubbed clean."
                ] },

                    "My stomach was full of butterflies as I lined up for the sack race. My best friend, Talia, gave me a thumbs-up. \"You've got this,\" she said. \"You're as quick as a rabbit.\"",

                    "I jumped back up and kept going. By the time I crossed the finish line, I was in last place, and my face was as red as a tomato.",
                    "+I flopped down on the grass, sure that Field Day was ruined. My legs were jelly, and my heart was a drum pounding in my ears.",

        // =====================================================================
        // App
        // =====================================================================
        const LEVEL_NAME = { basic: 'DOK 1', 'on-grade': 'DOK 2', advanced: 'DOK 3' };
        const DOK_KEY = { 1: 'basic', 2: 'on-grade', 3: 'advanced' };
        const levelsFor = id => dokFor(id).map(d => DOK_KEY[d]);   // the checked DOK levels as question levels
        const LEVEL_ORDER = { basic: 0, 'on-grade': 1, advanced: 2 };
        const CFA_MAX_STANDARDS = 2;

        const MODE_DEFAULTS = {
            cfa: {
                title: 'ELA Common Formative Assessment', sub: '',
                genre: 'auto', rigor: 'mix', newPage: false, score: false,
                sel: { '4.RC.1': { mc: 3, wr: 1 } },
                defaultCounts: { mc: 3, wr: 1 }
            },
            eou: {
                title: 'ELA End of Unit Assessment', sub: '',
                genre: 'auto', rigor: 'mix', newPage: true, score: true,
                sel: { '4.RC.1': { mc: 5, wr: 1 }, '4.RC.2': { mc: 5, wr: 1 }, '4.RC.3': { mc: 5, wr: 1 }, '4.RC.10': { mc: 5, wr: 1 } },

            },

                genre: 'auto', rigor: 'mix', newPage: true, score: false, days: '5', perDay: '4', written: false,

                defaultCounts: { mc: 2, wr: 0 }
            },
            lesson: {
                title: 'Lesson', sub: '', block: '120',
                genre: 'auto', rigor: 'mix', newPage: true, score: false,
                sel: { '4.RC.1': { mc: 6, wr: 1 } },
                defaultCounts: { mc: 6, wr: 1 }
            },
            exit: {
                title: 'Exit Ticket', sub: '',
                genre: 'auto', rigor: 'mix', newPage: false, score: false, copies: '2', passage: false,
                sel: { '4.RC.1': { mc: 2, wr: 1 } },
                defaultCounts: { mc: 2, wr: 1 }
            }
