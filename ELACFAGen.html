<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4th Grade ELA Assessment Builder</title>
<style>
    :root {
        --teal-900: #0d4448;
        --teal-700: #14676a;
        --teal-500: #1f8f8c;
        --teal-50:  #e9f4f3;
        --gold-500: #e2a52c;
        --gold-100: #fbf0d6;
        --ink:      #1d2a2c;
        --muted:    #5d6e70;
        --line:     #cbd9d8;
        --paper:    #ffffff;
        --desk:     #eef3f2;
        --warn:     #8a5a00;
        --ui: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        --read: Georgia, "Times New Roman", serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--desk); color: var(--ink); font-family: var(--ui); font-size: 15px; line-height: 1.45; }
    button, input, select { font: inherit; color: inherit; }
    :focus-visible { outline: 3px solid var(--gold-500); outline-offset: 2px; }

    /* ---------- Builder panel ---------- */
    #builder { max-width: 1080px; margin: 24px auto; background: var(--paper); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 0 var(--line), 0 8px 24px rgba(13, 68, 72, .08); }
    .band { background: var(--teal-900); color: #fff; display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 18px 24px; }
    .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
    .brand svg { width: 34px; height: 34px; flex: none; }
    .brand h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: .2px; }
    .brand small { display: block; font-size: 13px; font-weight: 400; color: #b9dcda; }
    .modes { display: inline-flex; background: rgba(255,255,255,.1); border-radius: 999px; padding: 4px; }
    .modes button { border: 0; background: transparent; color: #d7ecea; padding: 8px 18px; border-radius: 999px; cursor: pointer; font-weight: 600; }
    .modes button[aria-pressed="true"] { background: var(--gold-500); color: var(--teal-900); }

    .panel { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); }
    .col { padding: 20px 24px 24px; }
    .col + .col { border-left: 1px solid var(--line); background: #fbfdfd; }
    h2 { font-size: 16px; margin: 0 0 4px; color: var(--teal-900); }
    .hint { margin: 0 0 12px; color: var(--muted); font-size: 13px; }

    .std-list { border: 1px solid var(--line); border-radius: 10px; max-height: 460px; overflow-y: auto; }
    .std-head, .std-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) 74px 74px; gap: 8px; align-items: center; padding: 8px 12px; }
    .std-head { position: sticky; top: 0; background: var(--teal-50); font-size: 12px; font-weight: 600; color: var(--teal-700); z-index: 1; }
    .std-head span:nth-child(n+3) { text-align: center; }
    .std-row { border-top: 1px solid var(--line); }
    .std-row.on { background: var(--gold-100); }
    .std-row input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--teal-700); }
    .std-name { font-weight: 600; font-size: 14px; }
    .std-name b { color: var(--teal-700); }
    .std-desc { font-size: 12px; color: var(--muted); }
    .std-row input[type=number], .std-row select { width: 100%; padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; background: #fff; text-align: center; }
    .std-row:not(.on) input[type=number], .std-row:not(.on) select { opacity: .35; }
    .list-tools { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 13px; color: var(--muted); }
    .linkish { border: 0; background: none; color: var(--teal-700); text-decoration: underline; cursor: pointer; padding: 0; }

    .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
    .field label { font-size: 13px; font-weight: 600; color: var(--teal-900); }
    .field input[type=text], .field select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .field .hint { margin: 0; }
    .checks { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 16px; font-size: 14px; }
    .checks label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
    .checks input { width: 17px; height: 17px; margin-top: 2px; accent-color: var(--teal-700); }

    .actions { display: flex; flex-wrap: wrap; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--line); align-items: center; }
    .btn { border: 1px solid var(--teal-700); background: #fff; color: var(--teal-900); padding: 9px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn.primary { background: var(--teal-700); color: #fff; }
    .btn.primary:hover { background: var(--teal-900); }
    .btn.key[aria-pressed="true"] { background: var(--gold-500); border-color: var(--gold-500); color: var(--teal-900); }
    .version { display: flex; align-items: center; gap: 6px; margin-left: auto; font-size: 13px; color: var(--muted); }
    .version input { color: var(--ink); width: 78px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
    #notices { padding: 0 24px; }
    #notices:not(:empty) { padding: 12px 24px 16px; border-top: 1px solid var(--line); background: #fffaf0; }
    #notices p { margin: 4px 0; font-size: 13px; color: var(--warn); }

    @media (max-width: 820px) {
        .panel { grid-template-columns: 1fr; }
        .col + .col { border-left: 0; border-top: 1px solid var(--line); }
        .version { margin-left: 0; }
    }

    /* ---------- Printable test ---------- */
    #sheet { max-width: 8.5in; margin: 0 auto 48px; background: var(--paper); padding: .6in .65in; box-shadow: 0 8px 24px rgba(13, 68, 72, .08); color: #000; }
    .t-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; padding-bottom: 10px; border-bottom: 3px solid var(--teal-700); position: relative; }
    .t-head::after { content: ""; position: absolute; left: 0; bottom: -7px; width: 64px; height: 4px; background: var(--gold-500); }
    .t-title { font-size: 24px; font-weight: 800; margin: 0; line-height: 1.15; }
    .t-sub { font-size: 15px; margin: 2px 0 0; }
    .t-std { font-size: 12px; margin: 6px 0 0; color: #333; }
    .t-lines { flex: 0 0 2.6in; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
    .t-lines div { display: flex; gap: 6px; }
    .t-lines span.fill { flex: 1; border-bottom: 1px solid #000; }
    .t-meta { display: flex; justify-content: space-between; font-size: 11px; color: #555; margin: 12px 0 18px; }
    .t-badge { font-weight: 700; color: #000; background: var(--gold-100); border: 1px solid var(--gold-500); padding: 1px 8px; border-radius: 4px; }

    .section + .section { margin-top: 26px; }
    .sec-label { font-size: 12px; font-weight: 700; color: var(--teal-700); margin: 0 0 8px; }
    .passage { border: 1.5px solid #999; border-radius: 6px; padding: 14px 18px; margin-bottom: 18px; font-family: var(--read); font-size: 15px; line-height: 1.6; }
    .passage h3 { font-family: var(--ui); font-size: 16px; margin: 0 0 6px; }
    .passage p { margin: 0 0 8px; padding-left: 26px; position: relative; text-indent: 1.2em; break-inside: avoid; }
    .passage .pnum { position: absolute; left: 0; top: 2px; text-indent: 0; font-family: var(--ui); font-size: 11px; font-weight: 700; color: #555; }
    .passage h3 { break-after: avoid; }
    .passage p:last-child { margin-bottom: 0; }
    .q { display: grid; grid-template-columns: 28px 1fr; margin-bottom: 18px; break-inside: avoid; }
    .q-num { font-weight: 700; }
    .q-stem { font-weight: 600; margin-bottom: 8px; }
    .opts { display: grid; gap: 6px; }
    .opt { display: grid; grid-template-columns: 26px 1fr; align-items: start; }
    .bubble { width: 21px; height: 21px; border: 1.5px solid #555; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
    .opt.correct .bubble { background: #000; border-color: #000; color: #fff; }
    .opt.correct .opt-text { font-weight: 700; }
    .tag { display: inline-block; font-size: 11px; color: #444; border: 1px solid #aaa; border-radius: 3px; padding: 0 5px; margin-left: 6px; font-weight: 400; vertical-align: 1px; }
    .wr-head { font-size: 13px; font-weight: 700; margin: 6px 0 10px; padding-bottom: 3px; border-bottom: 1px solid #999; }
    .wlines { display: grid; gap: 22px; margin-top: 18px; }
    .wlines span { border-bottom: 1px solid #999; display: block; }
    .lookfor { margin-top: 8px; padding: 6px 10px; border-left: 4px solid var(--gold-500); background: var(--gold-100); font-size: 13px; }
    .newpage { break-before: page; }
    table.grid { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    table.grid th, table.grid td { border: 1px solid #888; padding: 5px 8px; text-align: left; }
    table.grid th { background: var(--teal-50); }
    .end-block { margin-top: 26px; break-inside: avoid; }
    .end-block h3 { font-size: 15px; margin: 0; }
    .empty { text-align: center; color: var(--muted); padding: 48px 0; }

    @media print {
        @page { size: letter portrait; margin: .45in; }
        body { background: #fff; }
        #builder { display: none !important; }
        #sheet { box-shadow: none; padding: 0; margin: 0; max-width: none; }
        * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
</style>
</head>
<body>

<div id="builder">
    <div class="band">
        <div class="brand">
            <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#14676a"/><path d="M20 5l3.6 10.2L34 16.4l-8.2 6.6L28.6 34 20 27.8 11.4 34l2.8-11L6 16.4l10.4-1.2z" fill="#e2a52c"/></svg>
            <div><h1>4th Grade ELA Assessment Builder</h1><small>4th grade reading standards, 4.RC.1 to 4.RC.13</small></div>
        </div>
        <div class="modes" role="group" aria-label="Assessment type">
            <button type="button" data-mode="cfa" aria-pressed="true">Quick CFA</button>
            <button type="button" data-mode="eou" aria-pressed="false">End of Unit</button>
        </div>
    </div>

    <div class="panel">
        <div class="col">
            <h2>Standards</h2>
            <p class="hint" id="std-hint"></p>
            <div class="std-list" id="std-list"></div>
            <div class="list-tools">
                <span id="totals"></span>
                <button type="button" class="linkish" id="clear-all">Clear all</button>
            </div>
        </div>
        <div class="col">
            <h2>Settings</h2>
            <p class="hint">Changes rebuild the same version. Use New version for different questions.</p>
            <div class="field">
                <label for="f-title">Title</label>
                <input type="text" id="f-title">
            </div>
            <div class="field">
                <label for="f-sub">Unit or subtitle (optional)</label>
                <input type="text" id="f-sub" placeholder="Example: Unit 3, Text Structure">
            </div>
            <div class="field">
                <label for="f-genre">Passage type</label>
                <select id="f-genre">
                    <option value="auto">Auto (whatever fits each standard)</option>
                    <option value="fiction">Fiction / literary</option>
                    <option value="nonfiction">Nonfiction / informational</option>
                </select>
            </div>
            <div class="field">
                <label for="f-rigor">Question level</label>
                <select id="f-rigor">
                    <option value="mix">Balanced mix, easiest first</option>
                    <option value="all">Any level, random</option>
                    <option value="basic">Level 1: Developing (recall)</option>
                    <option value="on-grade">Level 2: On grade (analysis)</option>
                    <option value="advanced">Level 3: Extension (high DOK)</option>
                </select>
            </div>
            <div class="checks">
                <label><input type="checkbox" id="f-newpage"> Start each standard on a new page</label>
                <label><input type="checkbox" id="f-score"> Add a score-by-standard table at the end</label>
            </div>
        </div>
    </div>

    <div class="actions">
        <button type="button" class="btn primary" id="btn-new">New version</button>
        <button type="button" class="btn key" id="btn-key" aria-pressed="false">Teacher key</button>
        <button type="button" class="btn" id="btn-print">Print</button>
        <div class="version">
            <label for="f-code">Version code</label>
            <input type="text" id="f-code" maxlength="6" spellcheck="false">
            <button type="button" class="btn" id="btn-load">Load</button>
        </div>
    </div>
    <div id="notices" aria-live="polite"></div>
</div>

<div id="sheet"></div>

<script>
const STANDARDS = [
            { id: '4.RC.1', label: '4.RC.1: Explicit Details & Inferences', desc: 'Refer to details and examples in a text when explaining what a text says explicitly and when drawing inferences.' },
            { id: '4.RC.2', label: '4.RC.2: Summarize & Theme in Fiction', desc: 'Paraphrase or summarize main events in a story/myth/legend; identify theme and provide evidence.' },
            { id: '4.RC.3', label: '4.RC.3: Character, Setting & Plot Impact', desc: 'Describe a character, setting, or event in a story or play using details and explain impact on plot.' },
            { id: '4.RC.4', label: '4.RC.4: Compare Point of View', desc: 'Compare and contrast the point of view from which different stories are narrated (1st vs 3rd person).' },
            { id: '4.RC.5', label: '4.RC.5: Main Idea & Summarize Nonfiction', desc: 'Determine the main idea of a text and explain how it is supported by key details; summarize.' },
            { id: '4.RC.6', label: '4.RC.6: Text Features', desc: 'Apply knowledge of text features to locate information and gain meaning (charts, tables, headings, fonts).' },
            { id: '4.RC.7', label: '4.RC.7: Text Structure', desc: 'Describe organizational structure (chronological, problem-solution, cause/effect, compare/contrast, etc.).' },
            { id: '4.RC.8', label: '4.RC.8: Fact/Opinion & Author Claims', desc: 'Distinguish between fact and opinion; explain how an author uses reasons/evidence to support a claim.' },
            { id: '4.RC.9', label: '4.RC.9: Integrating Information Across Texts', desc: 'Combine information from two texts on the same topic to demonstrate knowledge.' },
            { id: '4.RC.10', label: '4.RC.10: Context Clues for Word Meaning', desc: 'Apply context clues and text features to determine the meanings of unknown words.' },
            { id: '4.RC.11', label: '4.RC.11: Word Relationships & Multiple Meanings', desc: 'Identify relationships among words, including homographs, homonyms, synonyms, antonyms, multiple meanings.' },
            { id: '4.RC.12', label: '4.RC.12: Word Structure & Affixes/Roots', desc: 'Apply knowledge of prefixes, suffixes, Greek/Latin roots, and word patterns to determine meaning.' },
            { id: '4.RC.13', label: '4.RC.13: Figurative Language & Meaning', desc: 'Determine how words provide meaning in literature, including figurative language (similes, metaphors, hyperbole).' }
        ];

        // Passages. Paragraphs that start with "+" print only on End of Unit tests;
        // the rest make up the shorter CFA version.
        const PASSAGES = {
            '4.RC.1': {
                fiction: { title: "Story: The Midnight Rescue", text: [
                    "Maya peered out her bedroom window into the storm. Heavy rain pelted the glass, and the old oak tree in the front yard swayed wildly in the wind. Thunder rumbled so loudly that the picture frames on her dresser rattled.",
                    "+It was almost midnight, and everyone else in the house was asleep. Maya had tried to sleep too, but the storm kept her awake. She counted the seconds between each flash and each boom, the way her grandpa had taught her, to figure out how far away the lightning was.",
                    "Suddenly, a bright flash of lightning illuminated the lawn, and Maya gasped. A small puppy was shivering inside an overturned cardboard box near the sidewalk. Its ears were pressed flat against its head, and it whimpered each time the thunder boomed.",
                    "Maya grabbed her raincoat and flashlight from the closet without hesitation. Water was already rushing along the curb and creeping toward the box. She knew she had to act quickly before the rising rainwater flooded the box.",
                    "+She tiptoed down the stairs, careful to skip the squeaky third step. At the back door, she pulled on her rubber boots and zipped her raincoat all the way up to her chin. Then she took a deep breath and stepped out into the storm.",
                    "+The wind pushed against her like an invisible wall. Cold rain stung her cheeks, and the beam of her flashlight bounced across the wet grass. Maya kept her eyes on the cardboard box and walked as fast as she could without slipping.",
                    "When she reached the sidewalk, the puppy backed into the corner of the box. \"It's okay,\" Maya said softly, kneeling down. \"I won't hurt you.\" She held out her hand and waited. After a long moment, the puppy crept forward and licked her fingers.",
                    "+Maya tucked the puppy inside her raincoat, where it was warm and dry. She could feel its tiny heart beating fast against her. As she turned toward the house, she noticed that water had already filled the spot where the box had been sitting.",
                    "Back inside, Maya wrapped the puppy in a fluffy towel and rubbed its fur until it stopped shaking. The noise woke her mom, who came into the kitchen rubbing her eyes. When she saw the soggy puppy curled up on Maya's lap, her sleepy frown turned into a smile.",
                    "+\"Where did this little one come from?\" Mom asked. Maya explained everything, from the flash of lightning to the overflowing curb. Mom shook her head and said, \"Next time, wake me up first. But I'm proud of you for helping.\"",
                    "+The next morning, the storm had passed, and the sky was a clear, bright blue. Maya and her mom made posters with a photo of the puppy and hung them around the neighborhood. By lunchtime, a man named Mr. Alvarez called to say the puppy belonged to his family.",
                    "The puppy's owner came to pick him up the next day. The puppy wagged his whole body and jumped into his owner's arms. \"Biscuit must have slipped out of the fence when the gate blew open,\" the man said. \"Thank you for keeping him safe.\" Maya smiled as she waved goodbye, already missing her soggy midnight friend."
                ] },
                nonfiction: { title: "Informational Text: Deep Sea Explorers", text: [
                    "Deep on the ocean floor, sunlight cannot penetrate the pitch-black water. Below about 3,000 feet, the ocean is completely dark, freezing cold, and under enormous pressure. Oceanographers use specialized submarines called submersibles to explore these extreme depth environments.",
                    "+A submersible is small, usually carrying only one to three people. Its walls are made of thick metal that can withstand pressure hundreds of times stronger than the air pressure we feel on land. Bright lights on the outside let scientists see the dark water around them.",
                    "+One of the most famous submersibles is named Alvin. Alvin first dove in 1964 and has made thousands of trips to the deep sea since then. It has robotic arms that can scoop up rocks, collect water, and gently grab animals for scientists to study.",
                    "In 1977, researchers discovered hydrothermal vents spewing superheated water full of minerals. Surprising scientists everywhere, whole ecosystems of tube worms and blind white crabs were thriving in total darkness without sunlight energy.",
                    "+The vents were found near the Galapagos Islands, along a crack in the ocean floor where two pieces of Earth's crust slowly pull apart. Seawater seeps down into the crack, gets heated by hot rock below, and then shoots back up. Some vent water is hotter than 600 degrees Fahrenheit, but the crushing pressure keeps it from boiling.",
                    "Life near the vents works differently from life almost anywhere else on Earth. Instead of using sunlight, tiny bacteria use the chemicals in the vent water to make food. This process is called chemosynthesis. Larger animals then eat the bacteria or live alongside them.",
                    "+Giant tube worms are some of the strangest vent creatures. They can grow taller than a grown-up person, and they have no mouth and no stomach. Instead, bacteria living inside their bodies make food for them. The worms have bright red plumes that take in chemicals from the water.",
                    "Blind white crabs scurry across the rocks near the vents. Because there is no light, they have no need for bright colors or sharp eyesight. Scientists have also found pale shrimp, snails, and fish living in these communities.",
                    "Exploring the deep sea is difficult and expensive, so scientists have seen only a tiny part of it. Most of the deep ocean floor has never been seen by human eyes. Every dive gives researchers a chance to discover something new.",
                    "+Today, scientists also use robots called ROVs, which stands for remotely operated vehicles. An ROV is connected to a ship by a long cable, and a pilot on the ship steers it with a joystick. ROVs can stay underwater for many hours without putting anyone in danger.",
                    "+The discoveries at hydrothermal vents changed how scientists think about life. If living things can survive in dark, scalding, chemical-filled water on Earth, some scientists wonder whether life might exist in similar places on other worlds, such as the icy moons of Jupiter and Saturn.",
                    "The deep ocean is still one of the least explored places on our planet. With every new dive, oceanographers uncover more secrets hidden in the darkness. Who knows what amazing creatures are still waiting to be found?"
                ] },
            },
            '4.RC.2': {
                fiction: { title: "Story: The Great Oak Tree", text: [
                    "Leo loved playing near the old oak tree at the edge of the schoolyard. Its thick branches stretched over the grass like a giant umbrella, and its trunk was so wide that three students holding hands could barely reach around it.",
                    "+Every recess, Leo and his friends met under the oak. They traded cards in its shade, played tag around its roots, and collected acorns in the fall. Some of the oldest teachers said the tree had been standing there long before the school was built.",
                    "One night in April, a heavy thunderstorm swept through town. The next morning, Leo saw several broken branches lying across the playground. At an assembly that afternoon, the principal announced that the tree might need to be removed for safety reasons.",
                    "+Leo could hardly eat his lunch that day. He kept staring out the cafeteria window at the wounded oak. \"There has to be something we can do,\" he whispered to his best friend, Priya. Priya nodded, but she didn't know what that something could be.",
                    "Leo refused to give up on the oak. That evening, he asked his mom how grown-ups solve problems like this. She explained that a tree expert called an arborist can sometimes trim damaged branches so that a tree is safe again. Leo had an idea.",
                    "The next day, Leo organized a group of classmates to write letters explaining how much the tree meant to the school. Some students wrote about reading in its shade. Others drew pictures of the tree in every season. In all, they delivered forty-two letters to the principal's office.",
                    "+The principal read every letter. She told the students that she loved the tree too, but trimming it would cost money that the school did not have. Leo's heart sank, but only for a moment. \"Then we'll raise the money ourselves,\" he said.",
                    "The class decided to raise money to hire an arborist to trim the damaged branches safely. They held a bake sale, washed cars in the school parking lot, and set up a lemonade stand at the spring soccer games.",
                    "+Raising money was hard work. On the first day of the bake sale, it rained, and they sold only six cookies. Some students wanted to quit, but Leo reminded them of all the afternoons they had spent under the oak. Little by little, the jar filled with coins and dollar bills.",
                    "+After four weeks, the students counted their money. They had enough! The principal called an arborist named Mr. Hayes, who climbed high into the tree with ropes and a saw. He carefully cut away the broken limbs and checked the trunk for damage.",
                    "After weeks of hard work, the tree was saved. The arborist said the oak was healthy and strong once the broken limbs were removed. The principal changed her plan and announced that the tree would stay. The whole school cheered, and Leo grinned so wide that his cheeks hurt.",
                    "That summer, a new plaque appeared at the base of the oak. It read, \"Saved by the students of Room 14.\" Leo learned that even a young person can make a big difference when they stand up for what they care about."
                ] },
            },
            '4.RC.3': {
                fiction: { title: "Story: The Mystery of Whispering Woods", text: [
                    "Clara and Ethan followed the narrow trail into Whispering Woods as dusk began to fall. They had promised Grandma they would be back from the creek before dark, but they had stayed too long skipping stones.",
                    "+The woods had earned their name. Even on calm days, the tall pines seemed to murmur and sigh above the trail. Kids at school liked to tell stories about the woods, and not all of the stories were friendly.",
                    "Now the sun was slipping behind the hills. Shadows stretched like long fingers across the pine needles, and the air grew cool and damp. Somewhere far away, a dog barked once and then went silent.",
                    "+Ethan walked so close behind his sister that he kept stepping on her heels. \"Do you remember which way the big rock is?\" he asked. Clara pointed ahead with the walking stick she had found by the creek. \"Just past the bend,\" she said, sounding more confident than she felt.",
                    "Suddenly, a strange clicking noise echoed from inside a hollow cedar tree. Click. Click-click. Ethan froze in fear. His heart pounded so hard he was sure Clara could hear it.",
                    "+\"What is that?\" Ethan whispered. He thought about the stories from school. Maybe it was a raccoon with sharp teeth, or something much worse. He wanted to run, but his legs felt as heavy as bricks.",
                    "Clara was nervous too, but she noticed that the sound was small and steady, not like a large animal. She stepped forward bravely. \"Whatever it is, it's probably more scared of us than we are of it,\" she said.",
                    "+Clara crept toward the hollow cedar. The opening in the trunk was dark, about the size of a basketball. The clicking stopped, and the woods went completely silent. Ethan held his breath.",

            '4.RC.5': {
                nonfiction: { title: "Informational Text: Monarch Butterfly Migration", text: [
                    "Every autumn, millions of monarch butterflies embark on an extraordinary journey across North America. Traveling over 2,000 miles, these delicate insects fly south from Canada and the United States all the way to the warm forests of central Mexico.",
                    "Because most monarchs live only a few weeks, it takes about four generations of butterflies to complete the annual round-trip cycle. Scientists track their flight paths using lightweight tags placed on their wings to better understand how habitat loss impacts their survival.",
                    "+Monarchs are easy to recognize. Their wings are bright orange with black veins and white spots along the edges. This bold coloring is a warning to birds. Monarchs taste bitter and can make predators sick because of what they eat as caterpillars.",
                    "Monarch caterpillars eat only one kind of plant: milkweed. Milkweed grows in fields and along roadsides, and female monarchs lay their eggs only on its leaves. Without milkweed, monarchs cannot survive.",
                    "+The butterflies that make the long flight south are special. Unlike their parents and grandparents, this generation can live for about eight months. They spend the winter clustered together on fir trees high in the mountains of Mexico, where the cool air helps them rest and save energy.",
                    "+The clusters can be enormous. Thousands of monarchs may cling to a single branch, so many that the branch bends under their weight. From far away, the trees look like they are covered in orange leaves.",
                    "In spring, the monarchs fly north and lay eggs along the way. Their children continue the trip, and then their grandchildren. By the time monarchs return to Canada, it is the great-grandchildren of the butterflies that left the year before.",
                    "+Scientists still are not sure exactly how monarchs find their way to the same mountain forests every year, even though no single butterfly has ever made the trip before. Many researchers believe monarchs use the position of the sun as a compass.",
                    "Today, monarch populations face serious challenges. Farms, roads, and new buildings have replaced many fields where milkweed once grew. In Mexico, some of the forests where monarchs spend the winter have been cut down.",
                    "+Weather also affects monarchs. Long droughts can dry up milkweed and flowers, and sudden winter storms in the mountains can freeze butterflies that are clustered on the trees.",
                    "+The wing tags help scientists learn which routes the butterflies follow and where they stop to rest. When someone finds a tagged monarch, they can report its tag number online. Each report helps researchers build a map of the migration.",

            '4.RC.6': {

                    "Maps contain several key features that help travelers locate destinations. Learning to read these features is like learning a new language. Once you know them, a map can tell you where you are, where you are going, and what you will see along the way.",
                    "The compass rose shows cardinal directions (North, South, East, West). It is usually drawn in a corner of the map. Many compass roses also show in-between directions, such as northeast and southwest.",
                    "The map key explains symbols. A key is sometimes called a legend. A tiny tent might stand for a campground, a blue line might be a river, and a star often marks a capital city.",
                    "+A scale bar tells you how distance on the map compares to distance in real life. For example, one inch on a map might equal ten miles. By measuring with a ruler, you can figure out how far apart two places really are.",

                    "Elevation charts use shaded colors to represent land height above sea level. Low land near the ocean might be dark green, while tall mountains might be brown or white. These colors help hikers see where the land rises steeply.",

                    "+A tornado begins when warm, moist air near the ground meets cooler, drier air above it. The winds blow at different speeds and in different directions, which can make the air start to spin. If a strong updraft tips the spinning air upward, a funnel cloud can form and reach down toward the ground.",

                    "Language is full of interesting relationships. Some words sound alike, some are spelled alike, and some mean nearly the same thing. Learning how words are connected helps readers understand what they read and helps writers say exactly what they mean.",
                    "Words that sound the same can have entirely different meanings, like the bark of a dog versus the bark of a tree. Words that are spelled and pronounced the same but have different meanings are called homonyms, or multiple-meaning words. A bat can fly through the night sky, or it can hit a baseball.",
                    "+Homographs are words that are spelled the same but may be pronounced differently. When you wind a toy, you say it with a long i sound. When the wind blows, you say it with a short i sound. Readers must use the rest of the sentence to decide which word makes sense.",
                    "Homophones are words that sound the same but are spelled differently and have different meanings. Their, there, and they're are homophones that confuse many writers. So are to, too, and two, and ate and eight.",
                    "+A good way to remember homophones is to look for clues inside the word. \"Hear\" has the word \"ear\" inside it, and you hear with your ears. \"Here\" is spelled like \"there\" and \"where,\" and all three words tell about places.",
                    "Understanding synonyms and antonyms helps writers expand their vocabulary and express exact ideas clearly. Synonyms are words with similar meanings, such as big, large, and enormous. Antonyms are words with opposite meanings, such as hot and cold or early and late.",

            '4.RC.12': {

                    "Many English words originate from ancient Greek and Latin roots. A root is the main part of a word that carries its meaning. When you know a few common roots, you can often figure out words you have never seen before.",

                    "+The Latin root \"aud\" means to hear. An audience is a group of people who listen, something audible can be heard, and an auditorium is a large room where people gather to hear a performance.",
                    "Attaching prefixes like \"un-\" or suffixes like \"-able\" alters a word's core meaning, turning \"break\" into \"unbreakable.\" A prefix comes at the beginning of a word, and a suffix comes at the end.",
                    "Some of the most common prefixes are \"re-,\" which means again, \"pre-,\" which means before, and \"dis-,\" which means not or the opposite of. To reread a book is to read it again, to preheat an oven is to heat it before cooking, and to disagree is to not agree.",
                    "+Suffixes can change a word's meaning or its part of speech. Adding \"-ful\" means full of, so a joyful person is full of joy. Adding \"-less\" means without, so a fearless explorer is without fear. Adding \"-ness\" turns a describing word into a thing, as when \"kind\" becomes \"kindness.\"",
                    "+The Latin root \"port\" means to carry. A portable speaker can be carried from place to place, to transport something is to carry it across a distance, and a porter is a person who carries luggage.",
                    "+The Greek root \"tele\" means far. A telephone carries sound from far away, a telescope helps you see faraway objects, and television shows pictures sent from far away.",
                    "When you meet a long, unfamiliar word, try breaking it into parts. For \"unbelievable,\" cover the prefix and suffix to find the base word \"believe.\" Then add the meanings back: \"un-\" means not, and \"-able\" means able to be. Unbelievable means not able to be believed.",

                { genre: 'both', rigor: 'on-grade', q: "The prefix 'pre-' means 'before'. What does 'preheat' mean?", c: "To heat before using", d: ["To cool down completely", "To heat twice", "To heat slowly"] },
                { genre: 'both', rigor: 'advanced', q: "The root 'geo' means 'earth' and 'graphy' means 'writing/mapping'. What is 'geography'?", c: "The study and mapping of Earth's surface features.", d: ["Writing stories about space.", "The study of ancient sea animals.", "A machine that measures earthquakes."] },
                { genre: 'both', rigor: 'advanced', q: "The prefix 'sub-' means 'under' and 'marine' relates to 'sea'. What is a 'submarine'?", c: "A vessel operating underwater in the sea", d: ["A bird flying high over water", "A boat that stays on top of waves", "A bridge built over a river"] },
                { genre: 'both', rigor: 'advanced', q: "The suffix '-ful' means 'full of'. What does 'thoughtful' mean?", c: "Full of care and consideration for others", d: ["Without any thoughts", "Thinking too quickly", "Unable to think clearly"] },
                { genre: 'both', rigor: 'advanced', q: "The root 'aud' means 'hear'. Which word refers to a group of people gathered to hear a performance?", c: "Audience", d: ["Auditorium", "Audiobook", "Audition"] }
            ],
            '4.RC.13': [
                { genre: 'fiction', rigor: 'basic', q: "Which sentence contains a SIMILE?", c: "His hands were as cold as ice after playing in the snow.", d: ["The wind whispered gently through the trees.", "My backpack weighs a million pounds today.", "Time is a thief that slips away."] },
                { genre: 'fiction', rigor: 'basic', q: "Read sentence: 'My backpack weighs a million pounds today!' What type of figurative language is used?", c: "Hyperbole (exaggeration)", d: ["Simile", "Personification", "Metaphor"] },
                { genre: 'fiction', rigor: 'basic', q: "Which choice is an example of PERSONIFICATION?", c: "The wind whispered secrets through the branches.", d: ["He ran like a lightning bolt.", "She is a shining star.", "I've told you a hundred times."] },
                { genre: 'fiction', rigor: 'on-grade', q: "What does the metaphor 'The classroom was a zoo' suggest?", c: "The classroom was chaotic and noisy.", d: ["The classroom was full of wild animals in cages.", "The students were visiting a park.", "The teacher was taking attendance."] },
                { genre: 'fiction', rigor: 'on-grade', q: "Read: 'My blanket was as warm as a sunbeam.' What two things are being compared?", c: "A blanket and a sunbeam", d: ["A sunbeam and a window", "Rain and glass", "A thunderstorm and a blanket"] },
                { genre: 'fiction', rigor: 'on-grade', q: "What does the hyperbole 'I\'m so hungry I could eat a horse' mean?", c: "The speaker is extremely hungry.", d: ["The speaker wants to visit a farm.", "The speaker prefers eating meat.", "The speaker is ready for lunch tomorrow."] },
                { genre: 'fiction', rigor: 'advanced', q: "In 'Nature\'s Symphony', the rain tapped on the glass 'like a playful visitor.' What feeling does this simile create?", c: "It makes the storm seem friendly and harmless.", d: ["It warns the reader of a dangerous hurricane.", "It proves the window is broken.", "It explains how much rain fell that night."] },
                { genre: 'fiction', rigor: 'advanced', q: "What does the metaphor 'Time is a thief' imply about time?", c: "Time seems to pass quickly and quietly without us noticing.", d: ["Time steals physical objects from houses.", "Clocks are dangerous devices.", "Time moves slowly when you are bored."] },
                { genre: 'fiction', rigor: 'advanced', q: "Which sentence contains both a SIMILE and vivid sensory imagery?", c: "The lightning flashed like a jagged silver sword across the dark night sky.", d: ["Thunder is loud.", "The storm ended at 3 AM.", "It rained heavily all night long."] },
                { genre: 'fiction', rigor: 'advanced', q: "Why do poets and storytellers use figurative language instead of literal language?", c: "To paint vivid mental pictures and evoke emotion in the reader.", d: ["To make stories easier to translate into other languages.", "To state facts clearly for textbooks.", "To keep sentences as short as possible."] }
            ]
        };

        // Written (constructed response) bank.
        // genre tells which passage a prompt needs: 'fiction' / 'nonfiction' / 'both' match a passage
        // for that standard; 'any' means the prompt stands on its own.
        const WRITTEN_QUESTION_POOLS = {
            '4.RC.1': [
                { genre: 'fiction', q: "Explain what Maya did when she saw the puppy in the storm. Use at least TWO details from the text to support your answer.", key: "Look for: she grabbed her raincoat and flashlight without hesitation; she went to help before rainwater flooded the box." },
                { genre: 'fiction', q: "What can you infer about how Maya feels about animals? Explain using evidence from the text.", key: "Inference: she cares about animals and is brave. Evidence: she went out into a storm right away to help a shivering puppy." },
                { genre: 'nonfiction', q: "In 'Deep Sea Explorers', how are living things able to survive near hydrothermal vents? Use details from the text.", key: "Look for: vents spew superheated water full of minerals; tube worms and blind white crabs thrive in total darkness without sunlight energy." },
                { genre: 'nonfiction', q: "Why do oceanographers need submersibles to explore the deep ocean? Use a detail from the text to explain.", key: "Sunlight cannot reach the pitch-black water at extreme depths, so explorers need specialized submarines to get there." }
            ],
            '4.RC.2': [
                { genre: 'fiction', q: "What is the theme of 'The Great Oak Tree'? Explain how Leo's actions throughout the story help develop this theme.", key: "Theme: persistence / young people can make a difference. Evidence: organized classmates, wrote letters, raised money, tree was saved." },
                { genre: 'fiction', q: "Summarize the plot of 'The Great Oak Tree' in 3 to 4 sentences. Include the beginning, middle, and end.", key: "Storm breaks branches; principal says the tree may be removed; Leo organizes letters and fundraising; an arborist trims the tree and it is saved." },
                { genre: 'fiction', q: "Which detail from 'The Great Oak Tree' best shows the theme of the story? Explain why you chose it.", key: "Strong choices: Leo organized classmates to write letters, or they raised money for an arborist. Explanation should connect the detail to the theme." }
            ],
            '4.RC.3': [
                { genre: 'fiction', q: "Describe the setting at the start of 'The Mystery of Whispering Woods.' How does the setting make the clicking noise seem scary?", key: "Dusk is falling and shadows stretch like long fingers. The growing darkness makes an unknown sound feel spooky and builds suspense." },
                { genre: 'fiction', q: "Contrast Clara's and Ethan's reactions to the noise. How do their character traits affect the way the story ends?", key: "Ethan freezes in fear while Clara bravely investigates, which reveals the owl and resolves the mystery." },
                { genre: 'fiction', q: "How does Ethan change from the beginning to the end of the story? What event causes the change?", key: "He goes from frozen with fear to relieved and laughing at himself after the barn owl swoops out of the tree." }
            ],
            '4.RC.4': [

                { genre: 'fiction', q: "Why is it helpful to read both Julian's and Maya's points of view? Use text evidence.", key: "Reading both gives a fuller, fairer picture of how the accident happened (the bump vs. the cord she tripped on)." },
                { genre: 'fiction', q: "Julian's account is told in first person. Rewrite his first sentence in third person. Then explain what changed.", key: "Example: 'Julian spent three weeks perfecting his volcanic eruption model.' Pronouns change from I/my to he/his; the narrator is now outside the story." }
            ],
            '4.RC.5': [
                { genre: 'nonfiction', q: "State the main idea of 'Monarch Butterfly Migration' and give TWO key details from the article that support it.", key: "Main idea: monarchs make a long migration of over 2,000 miles. Details: fly from Canada and the U.S. to Mexico; takes four generations." },
                { genre: 'nonfiction', q: "Summarize how scientists track monarch butterflies and explain why this research matters.", key: "Scientists place lightweight tags on wings to track flight paths and learn how habitat loss affects monarchs." }
            ],
            '4.RC.6': [
                { genre: 'any', q: "Why do nonfiction authors use text features like subheadings, bold words, and diagrams? Explain how these features help a reader.", key: "Subheadings organize topics; bold words highlight key vocabulary; diagrams show information visually." },
                { genre: 'any', q: "Explain how a map key and a compass rose work together to help someone read a map.", key: "The compass rose shows direction (N, S, E, W); the map key explains what the symbols mean." }
            ],
            '4.RC.7': [
                { genre: 'any', q: "Compare cause and effect structure with problem and solution structure. How can a reader tell the difference using signal words?", key: "Cause/effect explains why something happened (because, as a result, consequently); problem/solution presents a challenge and a fix (to solve this, one answer is)." },
                { genre: 'nonfiction', q: "Explain how the author organizes 'Tornadoes and Hurricanes' to compare the two storm types. Use signal words from the text.", key: "Compares a shared feature (rotating winds), then contrasts formation, size, and duration ('In contrast'); uses 'Consequently' to explain warning times." }
            ],
            '4.RC.8': [
                { genre: 'nonfiction', q: "Explain the difference between a fact and an opinion. Then find one fact and one opinion in 'Why Recess Matters.'", key: "A fact can be proven; an opinion is a belief or feeling. Fact: research shows 30 minutes of outdoor play improves focus. Opinion: recess is undeniably the best part of the school day." },
                { genre: 'nonfiction', q: "What claim does the author make in 'Why Recess Matters'? Identify two pieces of evidence used to support this claim.", key: "Claim: recess is essential. Evidence: improves focus, reduces stress, leads to higher test scores and better behavior." }
            ],
            '4.RC.9': [
                { genre: 'nonfiction', q: "Use information from BOTH Text A and Text B to explain one advantage and one drawback of solar panels.", key: "Advantage: clean energy (A) or saves money over time (B). Drawback: expensive to install at first (B)." },
                { genre: 'nonfiction', q: "What overall conclusion can you draw by combining Text A and Text B? Explain in your own words.", key: "Solar power is clean and saves money over time, even though it costs a lot at first." }
            ],
            '4.RC.10': [
                { genre: 'any', q: "Read: 'The hiker found the trail treacherous, with steep cliffs on one side and loose, slippery gravel on the other.' What does 'treacherous' mean? Which context clues helped you?", key: "Dangerous. Clues: 'steep cliffs' and 'loose, slippery gravel'." },
                { genre: 'any', q: "Read: 'The old, dilapidated barn looked like it would collapse in the next windstorm.' What does 'dilapidated' mean? Explain which context clues helped you.", key: "Falling apart / in disrepair. Clues: 'old' and 'looked like it would collapse'." },
                { genre: 'fiction', q: "In 'The Lost Compass', Liam is in a 'perilous situation.' What does 'perilous' mean? Which words in the story help you figure it out?", key: "Dangerous. Clues: fog growing dense, paths becoming treacherous, searched frantically." }
            ],
            '4.RC.11': [
                { genre: 'any', q: "Explain two different meanings for the homograph 'bark'. Write a complete sentence for each meaning.", key: "Meaning 1: the sound a dog makes. Meaning 2: the outer covering of a tree." },
                { genre: 'any', q: "Define synonyms and antonyms. Give one pair of synonyms and one pair of antonyms.", key: "Synonyms have similar meanings (huge/enormous). Antonyms have opposite meanings (hot/cold)." }
            ],
            '4.RC.12': [
                { genre: 'any', q: "Break the word 'unbreakable' into its prefix, base word, and suffix. Explain how each part adds to the word's meaning.", key: "un- (not) + break + -able (able to be) = not able to be broken." },
                { genre: 'any', q: "How does adding the prefix 'pre-' change the meaning of the word 'heat'? Explain using an example.", key: "Pre- means before, so preheat means to heat something before using it (preheat the oven)." }
            ],
            '4.RC.13': [
                { genre: 'any', q: "Identify the figurative language in 'My backpack weighs a million pounds today!' Explain what the speaker actually means.", key: "Hyperbole (exaggeration). The backpack feels very heavy." },
                { genre: 'any', q: "Explain the difference between a simile and a metaphor. Write one original example of each.", key: "A simile compares using 'like' or 'as'; a metaphor compares directly without them." },
                { genre: 'fiction', q: "Find one example of personification in 'Nature's Symphony.' Explain what is given a human quality and what the author wants you to picture.", key: "The wind whispered secrets (wind cannot whisper) or the thunderstorm played its noisy symphony (storms cannot play music)." }
            ]
        };

        // =====================================================================
        // App
        // =====================================================================
        const LEVEL_NAME = { basic: 'Level 1', 'on-grade': 'Level 2', advanced: 'Level 3' };
        const LEVEL_ORDER = { basic: 0, 'on-grade': 1, advanced: 2 };
        const CFA_MAX_STANDARDS = 2;

        const MODE_DEFAULTS = {
            cfa: {
                title: 'ELA Common Formative Assessment', sub: '',
                genre: 'auto', rigor: 'on-grade', newPage: false, score: false,
                sel: { '4.RC.1': { mc: 3, wr: 1 } },
                defaultCounts: { mc: 3, wr: 1 }
            },
            eou: {
                title: 'ELA End of Unit Assessment', sub: '',
                genre: 'auto', rigor: 'mix', newPage: true, score: true,
                sel: { '4.RC.1': { mc: 5, wr: 1 }, '4.RC.2': { mc: 5, wr: 1 }, '4.RC.3': { mc: 5, wr: 1 }, '4.RC.10': { mc: 5, wr: 1 } },
                defaultCounts: { mc: 5, wr: 1 }
            }
        };

        const state = {
            mode: 'cfa',
            settings: JSON.parse(JSON.stringify(MODE_DEFAULTS)),
            showKey: false,
            code: newCode(),
            built: null
        };
        const S = () => state.settings[state.mode];
        const $ = id => document.getElementById(id);

        // ---------- Seeded randomness (same code + same settings = same test) ----------
        function newCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let c = '';
            for (let i = 0; i < 4; i++) c += chars[Math.floor(Math.random() * chars.length)];
            return c;
        }
        function makeRng(seedText) {
            let h = 1779033703 ^ seedText.length;
            for (let i = 0; i < seedText.length; i++) {
                h = Math.imul(h ^ seedText.charCodeAt(i), 3432918353);
                h = (h << 13) | (h >>> 19);
            }
            let a = h >>> 0;
            return function () {
                a = (a + 0x6D2B79F5) | 0;
                let t = Math.imul(a ^ (a >>> 15), 1 | a);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }
        function shuffle(arr, rng) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(rng() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // ---------- Question selection ----------
        // A question "needs" a passage when the standard has a passage of the question's genre.
        function passageNeeded(stdId, genre) {
            const group = PASSAGES[stdId] || {};
            return group[genre] ? genre : null;
        }

        function orderForLevel(pool, rigor, genrePref, rng) {
            const prefer = q => (genrePref !== 'auto' && q.genre === genrePref) ? 0 : 1;
            const byGenre = list => shuffle(list, rng).sort((a, b) => prefer(a) - prefer(b));
            if (rigor === 'all') return byGenre(pool);
            if (rigor === 'mix') {
                const tiers = ['basic', 'on-grade', 'advanced'].map(l => byGenre(pool.filter(q => q.rigor === l)));
                const out = [];
                while (tiers.some(t => t.length)) tiers.forEach(t => { if (t.length) out.push(t.shift()); });
                return out;
            }
            const tierOrder = { basic: ['basic', 'on-grade', 'advanced'], 'on-grade': ['on-grade', 'advanced', 'basic'], advanced: ['advanced', 'on-grade', 'basic'] }[rigor];
            return tierOrder.flatMap(l => byGenre(pool.filter(q => q.rigor === l)));
        }

        function shuffleOptions(correct, distractors, rng) {
            const unique = Array.from(new Set(distractors.map(String))).filter(d => d !== String(correct)).slice(0, 3);
            const all = shuffle([String(correct), ...unique], rng);
            const letters = ['A', 'B', 'C', 'D'];
            return {
                options: all.map((text, i) => ({ label: letters[i], text })),
                correctLetter: letters[all.indexOf(String(correct))]
            };
        }

        function buildSection(stdId, mcWanted, wrWanted, genre, rigor, rng, notices) {
            const group = PASSAGES[stdId] || {};
            const available = Object.keys(group);
            // Which passages may be used, in the order they should be tried
            let allowed;
            if (genre !== 'auto' && group[genre]) allowed = [genre];
            else if (genre !== 'auto' && available.length && !group[genre] && !group.both) {
                allowed = available;
                notices.swap.push(stdId);
            } else allowed = shuffle(available, rng);

            const bank = (QUESTION_POOLS[stdId] || []).map(q => ({ ...q, need: passageNeeded(stdId, q.genre) }));

            // Multiple choice: start with the first passage, open the next one only if the bank runs short
            const chosen = [];
            const opened = [];
            const take = () => {
                const pool = bank.filter(q => !chosen.includes(q) && (q.need === null || opened.includes(q.need)));
                chosen.push(...orderForLevel(pool, rigor, genre, rng).slice(0, mcWanted - chosen.length));
            };
            if (!allowed.length) take();
            for (const g of allowed) {
                if (chosen.length >= mcWanted) break;
                opened.push(g);
                take();
            }
            if (chosen.length < mcWanted) {
                notices.short.push(`${stdId}: ${chosen.length} of ${mcWanted} multiple-choice questions added. The bank has no more that fit${genre !== 'auto' ? ' this passage type' : ''}.`);
            }
            if (rigor !== 'all' && rigor !== 'mix') {
                const off = chosen.filter(q => q.rigor !== rigor).length;
                if (off) notices.level.push(`${stdId} (${off})`);
            }

            // Written: prefer prompts tied to passages already on the page, then standalone ones
            const used = new Set(chosen.map(q => q.need).filter(Boolean));
            const wBank = (WRITTEN_QUESTION_POOLS[stdId] || []).map(w => ({ ...w, need: w.genre === 'any' ? null : passageNeeded(stdId, w.genre) }));
            const wFits = w => w.need === null || used.has(w.need) || (used.size === 0 && allowed.includes(w.need));
            const linked = shuffle(wBank.filter(w => wFits(w) && w.need), rng);
            const loose = shuffle(wBank.filter(w => wFits(w) && !w.need), rng);
            const written = [...linked, ...loose].slice(0, wrWanted);
            written.forEach(w => { if (w.need) used.add(w.need); });
            if (written.length < wrWanted) {
                notices.short.push(`${stdId}: ${written.length} of ${wrWanted} written prompts added. The bank has no more that fit.`);
            }

            // Group into passage blocks, easiest questions first inside each block
            const byLevel = (a, b) => LEVEL_ORDER[a.rigor] - LEVEL_ORDER[b.rigor];
            const blocks = allowed.filter(g => used.has(g)).map(g => ({
                passage: group[g],
                questions: chosen.filter(q => q.need === g).sort(byLevel)
            }));
            const loneQs = chosen.filter(q => q.need === null).sort(byLevel);
            if (loneQs.length) blocks.push({ passage: null, questions: loneQs });

            blocks.forEach(b => {
                b.questions = b.questions.map(q => ({ ...q, ...shuffleOptions(q.c, q.d, rng) }));
            });
            return { stdId, blocks, written };
        }

        function build() {
            const s = S();
            const notices = { swap: [], level: [], short: [] };
            const rng = makeRng(state.code + '|' + state.mode);
            const ids = STANDARDS.map(x => x.id).filter(id => s.sel[id]);
            const sections = ids.map(id => buildSection(id, s.sel[id].mc, s.sel[id].wr, s.genre, s.rigor, rng, notices));
            const msgs = [...notices.short];
            const other = s.genre === 'fiction' ? 'nonfiction' : 'fiction';
            if (notices.swap.length) msgs.push(`No ${s.genre} passage exists for ${notices.swap.join(', ')}, so ${notices.swap.length > 1 ? 'those use their' : 'it uses its'} ${other} passage.`);
            if (notices.level.length) msgs.push(`The ${LEVEL_NAME[s.rigor]} bank ran short, so some questions came from a neighboring level: ${notices.level.join(', ')}. The teacher key tags each question's level.`);
            state.built = { sections, notices: msgs };
            renderNotices();
            renderSheet();
        }

        // ---------- Builder panel ----------
        function renderControls() {
            const s = S();
            document.querySelectorAll('.modes button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode)));
            $('std-hint').textContent = state.mode === 'cfa'
                ? `Pick up to ${CFA_MAX_STANDARDS} standards: one main target and an optional second. Set how many of each question type.`
                : 'Pick every standard the unit covered. Each one gets its own passage and section.';
            $('f-title').value = s.title;
            $('f-sub').value = s.sub;
            $('f-genre').value = s.genre;
            $('f-rigor').value = s.rigor;
            $('f-newpage').checked = s.newPage;
            $('f-score').checked = s.score;
            $('f-code').value = state.code;
            $('btn-key').setAttribute('aria-pressed', String(state.showKey));

            const list = $('std-list');
            list.innerHTML = '<div class="std-head"><span></span><span>Standard</span><span>Multiple choice</span><span>Written</span></div>';
            STANDARDS.forEach(std => {
                const pick = s.sel[std.id];
                const row = document.createElement('div');
                row.className = 'std-row' + (pick ? ' on' : '');
                const name = std.label.replace(std.id + ': ', '');
                const mcMax = (QUESTION_POOLS[std.id] || []).length;
                const wrMax = (WRITTEN_QUESTION_POOLS[std.id] || []).length;
                row.innerHTML = `
                    <input type="checkbox" aria-label="Include ${std.id}" ${pick ? 'checked' : ''}>
                    <div><div class="std-name"><b>${std.id}</b> ${name}</div><div class="std-desc">${std.desc}</div></div>
                    <input type="number" min="1" max="${mcMax}" aria-label="${std.id} multiple-choice count" value="${pick ? pick.mc : s.defaultCounts.mc}" ${pick ? '' : 'disabled'}>
                    <select aria-label="${std.id} written count" ${pick ? '' : 'disabled'}>
                        ${Array.from({ length: wrMax + 1 }, (_, n) => `<option value="${n}" ${(pick ? pick.wr : s.defaultCounts.wr) === n ? 'selected' : ''}>${n}</option>`).join('')}
                    </select>`;
                const [box, num, sel] = [row.querySelector('input[type=checkbox]'), row.querySelector('input[type=number]'), row.querySelector('select')];
                box.addEventListener('change', () => {
                    if (box.checked) {
                        if (state.mode === 'cfa' && Object.keys(s.sel).length >= CFA_MAX_STANDARDS) {
                            box.checked = false;
                            flash(`A Quick CFA covers up to ${CFA_MAX_STANDARDS} standards. Switch to End of Unit to include more.`);
                            return;
                        }
                        s.sel[std.id] = { mc: clampInt(num.value, 1, mcMax, s.defaultCounts.mc), wr: parseInt(sel.value, 10) };
                    } else {
                        delete s.sel[std.id];
                    }
                    renderControls(); build();
                });
                num.addEventListener('change', () => {
                    num.value = clampInt(num.value, 1, mcMax, s.defaultCounts.mc);
                    if (s.sel[std.id]) { s.sel[std.id].mc = parseInt(num.value, 10); updateTotals(); build(); }
                });
                sel.addEventListener('change', () => {
                    if (s.sel[std.id]) { s.sel[std.id].wr = parseInt(sel.value, 10); updateTotals(); build(); }
                });
                list.appendChild(row);
            });
            updateTotals();
        }

        function updateTotals() {
            const s = S();
            const picks = Object.values(s.sel);
            const mc = picks.reduce((n, p) => n + p.mc, 0);
            const wr = picks.reduce((n, p) => n + p.wr, 0);
            $('totals').textContent = picks.length
                ? `${picks.length} standard${picks.length > 1 ? 's' : ''}, ${mc} multiple choice, ${wr} written`
                : 'No standards picked yet';
        }

        function clampInt(v, lo, hi, fallback) {
            const n = parseInt(v, 10);
            if (isNaN(n)) return fallback;
            return Math.min(hi, Math.max(lo, n));
        }

        let flashMsg = '';
        function flash(msg) { flashMsg = msg; renderNotices(); }
        function renderNotices() {
            const box = $('notices');
            const msgs = [...(flashMsg ? [flashMsg] : []), ...((state.built && state.built.notices) || [])];
            flashMsg = '';
            box.innerHTML = msgs.map(m => `<p>${m}</p>`).join('');
        }

        // CFA uses the core paragraphs; End of Unit adds the paragraphs marked with "+"
        function passageParagraphs(passage) {
            return passage.text
                .filter(t => state.mode === 'eou' || !t.startsWith('+'))
                .map(t => t.replace(/^\+/, ''));
        }

        // ---------- Printable sheet ----------
        function el(tag, cls, text) {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text !== undefined) e.textContent = text;
            return e;
        }

        function renderSheet() {
            const s = S();
            const sheet = $('sheet');
            sheet.innerHTML = '';
            const { sections } = state.built;

            // Header
            const head = el('div', 't-head');
            const left = el('div');
            left.appendChild(el('h1', 't-title', s.title || 'ELA Assessment'));
            if (s.sub) left.appendChild(el('p', 't-sub', s.sub));
            left.appendChild(el('p', 't-std', 'Standards: ' + (sections.map(x => x.stdId).join(', ') || 'none picked')));
            const right = el('div', 't-lines');
            right.innerHTML = '<div>Name:<span class="fill"></span></div><div>Date:<span class="fill"></span></div>';
            head.append(left, right);
            sheet.appendChild(head);

            const meta = el('div', 't-meta');
            const v = el('span', '', 'Version ' + state.code);
            meta.appendChild(v);
            if (state.showKey) meta.appendChild(el('span', 't-badge', 'TEACHER KEY'));
            sheet.appendChild(meta);

            if (!sections.length) {
                sheet.appendChild(el('p', 'empty', 'Pick at least one standard to build an assessment.'));
                return;
            }

            let n = 1;
            const keyRows = [];
            const perStd = [];

            sections.forEach((sec, i) => {
                const std = STANDARDS.find(x => x.id === sec.stdId);
                const wrap = el('div', 'section' + (s.newPage && i > 0 ? ' newpage' : ''));
                wrap.appendChild(el('p', 'sec-label', std.label));
                const first = n;
                let mcCount = 0;

                sec.blocks.forEach(block => {
                    if (block.passage) {
                        const p = el('div', 'passage');
                        p.appendChild(el('h3', '', block.passage.title));
                        passageParagraphs(block.passage).forEach((t, k) => {
                            const para = el('p');
                            para.appendChild(el('span', 'pnum', String(k + 1)));
                            const body = el('span'); body.innerHTML = t; para.appendChild(body);
                            p.appendChild(para);
                        });
                        wrap.appendChild(p);
                    }
                    block.questions.forEach(q => {
                        const qd = el('div', 'q');
                        qd.appendChild(el('div', 'q-num', n + '.'));
                        const body = el('div');
                        const stem = el('div', 'q-stem', q.q);
                        if (state.showKey) stem.appendChild(el('span', 'tag', LEVEL_NAME[q.rigor]));
                        body.appendChild(stem);
                        const opts = el('div', 'opts');
                        q.options.forEach(o => {
                            const row = el('div', 'opt' + (state.showKey && o.label === q.correctLetter ? ' correct' : ''));
                            row.appendChild(el('span', 'bubble', o.label));
                            row.appendChild(el('span', 'opt-text', o.text));
                            opts.appendChild(row);
                        });
                        body.appendChild(opts);
                        qd.appendChild(body);
                        wrap.appendChild(qd);
                        keyRows.push([n, q.correctLetter, sec.stdId, LEVEL_NAME[q.rigor]]);
                        n++; mcCount++;
                    });
                });

                if (sec.written.length) {
                    wrap.appendChild(el('div', 'wr-head', 'Written response'));
                    sec.written.forEach(w => {
                        const qd = el('div', 'q');
                        qd.appendChild(el('div', 'q-num', n + '.'));
                        const body = el('div');
                        body.appendChild(el('div', 'q-stem', w.q));
                        if (state.showKey) {
                            const lf = el('div', 'lookfor');
                            lf.innerHTML = '<b>Look for:</b> ';
                            lf.appendChild(document.createTextNode(w.key.replace(/^Look for:\s*/i, '')));
                            body.appendChild(lf);
                        } else {
                            const lines = el('div', 'wlines');
                            for (let k = 0; k < 5; k++) lines.appendChild(el('span'));
                            body.appendChild(lines);
                        }
                        qd.appendChild(body);
                        wrap.appendChild(qd);
                        keyRows.push([n, 'Written', sec.stdId, '']);
                        n++;
                    });
                }
                perStd.push({ id: sec.stdId, from: first, to: n - 1, mc: mcCount, wr: sec.written.length });
                sheet.appendChild(wrap);
            });

            // Score-by-standard table (student copy and key)
            if (s.score) {
                const blockEl = el('div', 'end-block');
                blockEl.appendChild(el('h3', '', 'Score by standard (teacher use)'));
                const t = el('table', 'grid');
                t.innerHTML = '<tr><th>Standard</th><th>Questions</th><th>Multiple choice</th><th>Written</th></tr>' +
                    perStd.map(r => `<tr><td>${r.id}</td><td>${r.from === r.to ? r.from : r.from + ' to ' + r.to}</td><td>_____ / ${r.mc}</td><td>${r.wr ? '_____' : ''}</td></tr>`).join('');
                blockEl.appendChild(t);
                sheet.appendChild(blockEl);
            }

            // Answer key page (key only)
            if (state.showKey) {
                const page = el('div', 'end-block newpage');
                page.appendChild(el('h3', '', `Answer key, version ${state.code}`));
                const t = el('table', 'grid');
                t.innerHTML = '<tr><th>#</th><th>Answer</th><th>Standard</th><th>Level</th></tr>' +
                    keyRows.map(r => `<tr><td>${r[0]}</td><td><b>${r[1]}</b></td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('');
                page.appendChild(t);
                sheet.appendChild(page);
            }
        }

        // ---------- Wiring ----------
        function bindField(id, key, evt = 'input') {
            $(id).addEventListener(evt, e => {
                S()[key] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
                key === 'title' || key === 'sub' ? renderSheet() : build();
            });
        }

        function init() {
            document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => {
                state.mode = b.dataset.mode;
                renderControls(); build();
            }));
            bindField('f-title', 'title');
            bindField('f-sub', 'sub');
            bindField('f-genre', 'genre', 'change');
            bindField('f-rigor', 'rigor', 'change');
            bindField('f-newpage', 'newPage', 'change');
            bindField('f-score', 'score', 'change');
            $('clear-all').addEventListener('click', () => { S().sel = {}; renderControls(); build(); });
            $('btn-new').addEventListener('click', () => { state.code = newCode(); $('f-code').value = state.code; build(); });
            $('btn-key').addEventListener('click', () => {
                state.showKey = !state.showKey;
                $('btn-key').setAttribute('aria-pressed', String(state.showKey));
                renderSheet();
            });
            $('btn-print').addEventListener('click', () => window.print());
            const loadCode = () => {
                const c = $('f-code').value.trim().toUpperCase();
                if (!c) return;
                state.code = c; $('f-code').value = c; build();
            };
            $('btn-load').addEventListener('click', loadCode);
            $('f-code').addEventListener('keydown', e => { if (e.key === 'Enter') loadCode(); });

            renderControls();
            build();
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();
    </script>
</body>
</html>
