        const state = {
            mode: 'cfa',
            settings: JSON.parse(JSON.stringify(MODE_DEFAULTS)),
            showKey: false,
            code: newCode(),
            built: null
        };
        const S = () => state.settings[state.mode];
        const $ = id => document.getElementById(id);

        // ---------- Seeded randomness (same code + same settings = same test) ----------
        function newCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let c = '';
            for (let i = 0; i < 4; i++) c += chars[Math.floor(Math.random() * chars.length)];
            return c;
        }
        function makeRng(seedText) {
            let h = 1779033703 ^ seedText.length;
            for (let i = 0; i < seedText.length; i++) {
                h = Math.imul(h ^ seedText.charCodeAt(i), 3432918353);
                h = (h << 13) | (h >>> 19);
            }
            let a = h >>> 0;
            return function () {
                a = (a + 0x6D2B79F5) | 0;
                let t = Math.imul(a ^ (a >>> 15), 1 | a);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }
        function shuffle(arr, rng) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(rng() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // ---------- Question selection ----------
        // A question "needs" a passage when the standard has a passage of the question's genre.
        // Merge the questions for the added passages into the banks, tagged with the passage they need
        Object.entries(NEW_QUESTIONS).forEach(([pid, { std, items }]) => {
            const genre = PASSAGES[std].find(p => p.id === pid).genre;
            items.forEach(q => QUESTION_POOLS[std].push({ ...q, genre, p: pid }));
        });
        Object.entries(NEW_WRITTEN).forEach(([pid, { std, items }]) => {
            const genre = PASSAGES[std].find(p => p.id === pid).genre;
            items.forEach(w => WRITTEN_QUESTION_POOLS[std].push({ ...w, genre, p: pid }));
        });

        // Which passage (by id) a question needs, or null if it stands on its own.
        // Older questions have no p, so they belong to the standard's first passage of their genre.
        function passageNeeded(stdId, item) {
            if (item.p) return item.p;
            if (item.genre === 'any') return null;
            const match = (PASSAGES[stdId] || []).find(p => p.genre === item.genre);
            return match ? match.id : null;
        }

        function orderForLevel(pool, rigor, genrePref, rng) {
            const prefer = q => (genrePref !== 'auto' && q.genre === genrePref) ? 0 : 1;
            const byGenre = list => shuffle(list, rng).sort((a, b) => prefer(a) - prefer(b));
            if (rigor === 'all') return byGenre(pool);
            if (rigor === 'mix') rigor = ['basic', 'on-grade', 'advanced'];
            if (Array.isArray(rigor)) {
                // Take turns across the checked levels; other levels are only a backup at the end
                const tiers = rigor.map(l => byGenre(pool.filter(q => q.rigor === l)));
                const out = [];
                while (tiers.some(t => t.length)) tiers.forEach(t => { if (t.length) out.push(t.shift()); });
                const rest = ['basic', 'on-grade', 'advanced'].filter(l => !rigor.includes(l));
                return out.concat(rest.flatMap(l => byGenre(pool.filter(q => q.rigor === l))));
            }
            const tierOrder = { basic: ['basic', 'on-grade', 'advanced'], 'on-grade': ['on-grade', 'advanced', 'basic'], advanced: ['advanced', 'on-grade', 'basic'] }[rigor];
            return tierOrder.flatMap(l => byGenre(pool.filter(q => q.rigor === l)));
        }

        function shuffleOptions(correct, distractors, rng) {
            const unique = Array.from(new Set(distractors.map(String))).filter(d => d !== String(correct)).slice(0, 3);
            const all = shuffle([String(correct), ...unique], rng);
            const letters = ['A', 'B', 'C', 'D'];
            return {
                options: all.map((text, i) => ({ label: letters[i], text })),
                correctLetter: letters[all.indexOf(String(correct))]
            };
        }

        function buildSection(stdId, mcWanted, wrWanted, genre, rigor, rng, notices, seenQ = new Set()) {
            const list = PASSAGES[stdId] || [];
            const group = Object.fromEntries(list.map(p => [p.id, p]));
            // Which passages may be used (by id), in the order they should be tried
            const fits = list.filter(p => p.genre === genre || p.genre === 'both');
            let allowed;
            // Passages with the most questions at the checked DOK levels go first
            const atLevel = pid => (QUESTION_POOLS[stdId] || []).filter(q => passageNeeded(stdId, q) === pid && (!Array.isArray(rigor) || rigor.includes(q.rigor))).length;
            const byFit = ids => shuffle(ids, rng).sort((x, y) => atLevel(y) - atLevel(x));
            if (genre === 'auto' || !list.length) allowed = byFit(list.map(p => p.id));
            else if (fits.length) allowed = byFit(fits.map(p => p.id));
            else {
                allowed = shuffle(list.map(p => p.id), rng);
                notices.swap.push(stdId);
            }

            const bank = (QUESTION_POOLS[stdId] || []).filter(q => !seenQ.has(q.q)).map(q => ({ ...q, need: passageNeeded(stdId, q) }));

            // Multiple choice: start with the first passage, open the next one only if the bank runs short
            const chosen = [];
            const opened = [];
            const take = () => {
                const pool = bank.filter(q => !chosen.includes(q) && (q.need === null || opened.includes(q.need)));
                chosen.push(...orderForLevel(pool, rigor, genre, rng).slice(0, mcWanted - chosen.length));
            };
            if (!allowed.length) take();
            for (const g of allowed) {
                if (chosen.length >= mcWanted) break;
                opened.push(g);
                take();
            }
            if (chosen.length < mcWanted) {
                notices.short.push(`${stdId}: ${chosen.length} of ${mcWanted} multiple-choice questions added. The bank has no more that fit${genre !== 'auto' ? ' this passage type' : ''}.`);
            }
            if (Array.isArray(rigor) && rigor.length < 3) {
                const off = chosen.filter(q => !rigor.includes(q.rigor)).length;
                if (off) notices.level.push(`${stdId} (${off})`);
            }

            // Written: prefer prompts tied to passages already on the page, then standalone ones
            const used = new Set(chosen.map(q => q.need).filter(Boolean));
            const wBank = (WRITTEN_QUESTION_POOLS[stdId] || []).filter(w => !seenQ.has(w.q)).map(w => ({ ...w, need: passageNeeded(stdId, w) }));
            const wFits = w => w.need === null || used.has(w.need) || (used.size === 0 && allowed.includes(w.need));
            const linked = shuffle(wBank.filter(w => wFits(w) && w.need), rng);
            const loose = shuffle(wBank.filter(w => wFits(w) && !w.need), rng);
            const written = [...linked, ...loose].slice(0, wrWanted);
            chosen.forEach(q => seenQ.add(q.q)); written.forEach(w => seenQ.add(w.q));
            written.forEach(w => { if (w.need) used.add(w.need); });
            if (written.length < wrWanted) {
                notices.short.push(`${stdId}: ${written.length} of ${wrWanted} written prompts added. The bank has no more that fit.`);
            }

            // Group into passage blocks, easiest questions first inside each block
            const byLevel = (a, b) => LEVEL_ORDER[a.rigor] - LEVEL_ORDER[b.rigor];
            const blocks = allowed.filter(g => used.has(g)).map(g => ({
                passage: group[g],
                questions: chosen.filter(q => q.need === g).sort(byLevel)
            }));
            const loneQs = chosen.filter(q => q.need === null).sort(byLevel);
            if (loneQs.length) blocks.push({ passage: null, questions: loneQs });

            blocks.forEach(b => {
                b.questions = b.questions.map(q => ({ ...q, ...shuffleOptions(q.c, q.d, rng) }));
            });
            return { stdId, blocks, written };
        }

        // ---------- 4.RC.10 Context clues ----------
        // No passage of its own: its questions use words from the passages already on the test
        // and are placed right after each host passage's questions.
        const CONTEXT_STD = '4.RC.10';
        const shortTitle = t => t.replace(/^(Story|Informational Text|Persuasive Article|Passage):\s*/, '');

        function addContextClues(sections, mcWanted, wrWanted, genre, rigor, rng, notices, seenQ = new Set()) {
            let hosts = [];
            sections.forEach(sec => sec.blocks.forEach(block => {
                if (block.passage && CONTEXT_CLUES[block.passage.title]) hosts.push({ sec, block });
            }));
            if (!hosts.length) {
                // Nothing to borrow from, so give 4.RC.10 one passage from another standard
                const all = [];
                Object.values(PASSAGES).forEach(list => list.forEach(p => {
                    if (CONTEXT_CLUES[p.title]) all.push({ g: p.genre, p });
                }));
                const fits = all.filter(x => genre === 'auto' || x.g === genre || x.g === 'both');
                const choice = shuffle(fits.length ? fits : all, rng)[0];
                const sec = { stdId: CONTEXT_STD, blocks: [{ passage: choice.p, questions: [] }], written: [] };
                const order = STANDARDS.map(x => x.id);
                const at = sections.findIndex(x => order.indexOf(x.stdId) > order.indexOf(CONTEXT_STD));
                sections.splice(at < 0 ? sections.length : at, 0, sec);
                hosts = [{ sec, block: sec.blocks[0] }];
            }

            // Multiple choice: take turns across the host passages
            const queues = hosts.map(h => orderForLevel(CONTEXT_CLUES[h.block.passage.title].filter(v => !seenQ.has(v.sentence + v.word)).map(v => ({ ...v, host: h })), rigor, 'auto', rng));
            const picked = [];
            for (let round = 0; picked.length < mcWanted && queues.some(q => q.length); round++) {
                queues.forEach(q => { if (picked.length < mcWanted && q.length) picked.push(q.shift()); });
            }
            picked.forEach(v => {
                seenQ.add(v.sentence + v.word);
                const title = shortTitle(v.host.block.passage.title);
                const q = { std: CONTEXT_STD, rigor: v.rigor, c: v.c, d: v.d,
                    q: `Read this sentence from "${title}": "${v.sentence}" What does "${v.word}" mean in this sentence?` };
                v.host.block.questions.push({ ...q, ...shuffleOptions(q.c, q.d, rng) });
            });
            // Fill any shortfall with stand-alone sentences
            if (picked.length < mcWanted) {
                const extra = orderForLevel(QUESTION_POOLS[CONTEXT_STD] || [], rigor, 'auto', rng).slice(0, mcWanted - picked.length);
                const last = hosts[hosts.length - 1].block;
                extra.forEach(x => last.questions.push({ ...x, std: CONTEXT_STD, ...shuffleOptions(x.c, x.d, rng) }));
                if (picked.length + extra.length < mcWanted) notices.short.push(`${CONTEXT_STD}: ${picked.length + extra.length} of ${mcWanted} multiple-choice questions added. The bank has no more that fit.`);
            }

            // Written: use passage words not already asked about, then stand-alone prompts
            const leftovers = shuffle(queues.flat(), rng).slice(0, wrWanted);
            leftovers.forEach(v => {
                const title = shortTitle(v.host.block.passage.title);
                v.host.sec.written.push({ std: CONTEXT_STD,
                    q: `Reread this sentence from "${title}": "${v.sentence}" What does "${v.word}" mean? Explain which words or details from the passage helped you figure it out.`,
                    key: `Meaning: ${v.c}. Clues: ${v.clue}.` });
            });
            if (leftovers.length < wrWanted) {
                const more = shuffle(WRITTEN_QUESTION_POOLS[CONTEXT_STD] || [], rng).slice(0, wrWanted - leftovers.length);
                more.forEach(w => hosts[hosts.length - 1].sec.written.push({ ...w, std: CONTEXT_STD }));
                if (leftovers.length + more.length < wrWanted) notices.short.push(`${CONTEXT_STD}: ${leftovers.length + more.length} of ${wrWanted} written prompts added. The bank has no more that fit.`);
            }
            hosts.forEach(h => { h.sec.hasContext = true; });
        }

        // ---------- Morning work (spiral review) ----------
        // Each day: one passage from the next reading standard in the rotation, its questions,
        // plus a context-clue item on that passage (if 4.RC.10 is picked) and one word-work item
        // from 4.RC.11, 4.RC.12, or 4.RC.13 (these stand on their own, without a passage).
        const WORD_STDS = ['4.RC.11', '4.RC.12', '4.RC.13'];
        function buildMorning(s, rng, notices) {
            const ids = STANDARDS.map(x => x.id).filter(id => s.sel[id]);
            const P = shuffle(ids.filter(id => !WORD_STDS.includes(id) && id !== CONTEXT_STD), rng);
            const W = shuffle(ids.filter(id => WORD_STDS.includes(id)), rng);
            const ctx = ids.includes(CONTEXT_STD);
            const seenQ = new Set();
            const out = [];
            const perDay = Number(s.perDay) || 4;
            for (let d = 0; d < Number(s.days); d++) {
                const daySecs = [];
                const extras = (ctx ? 1 : 0) + (W.length ? 1 : 0);
                if (P.length) daySecs.push(buildSection(P[d % P.length], Math.max(1, perDay - extras), s.written ? 1 : 0, s.genre, levelsFor(P[d % P.length]), rng, notices, seenQ));
                if (ctx) addContextClues(daySecs, 1, 0, s.genre, levelsFor(CONTEXT_STD), rng, notices, seenQ);
                if (W.length) {
                    const w = W[d % W.length];
                    const pool = (QUESTION_POOLS[w] || []).filter(q => !q.p && !seenQ.has(q.q));   // skip questions tied to a specific passage
                    const need = P.length || ctx ? 1 : perDay;
                    const items = orderForLevel(pool, levelsFor(w), 'auto', rng).slice(0, need).map(q => ({ ...q, std: w, ...shuffleOptions(q.c, q.d, rng) }));
                    items.forEach(q => seenQ.add(q.q));
                    if (!daySecs.length) daySecs.push({ stdId: w, blocks: [], written: [] });
                    daySecs[daySecs.length - 1].blocks.push({ passage: null, questions: items, word: true });
                }
                daySecs.forEach((sec, j) => { sec.day = d; sec.firstOfDay = j === 0; });
                out.push(...daySecs);
            }
            return out;
        }


        const VERSION_FLAGS = [
            ['genre', { auto: 'A', fiction: 'F', nonfiction: 'N' }, 'auto'],
            ['rigor', { mix: 'M', all: 'X', basic: '1', 'on-grade': '2', advanced: '3' }, 'mix'],
            ['newPage', null, false], ['score', null, false], ['copies', null, '2'], ['passage', null, false],
            ['days', null, '5'], ['perDay', null, '4'], ['written', null, false],
            ['block', Object.fromEntries(Array.from({ length: 30 }, (_, i) => [String((i + 6) * 5), ((i + 6)).toString(36).toUpperCase()])), '120']
        ];
        const SEL_SIZE = 2;   // multiple-choice count (base 36) + written count
        const SEL_CODE = v => b36(v.mc) + String(v.wr);
        const SEL_READ = t => { const mc = parseInt(t[0], 36), wr = parseInt(t[1], 10); return isNaN(mc) || isNaN(wr) ? null : { mc, wr }; };


        // ---------- Per-standard DOK checkboxes ----------
        function dokFor(id) {
            const d = S().dok && S().dok[id];
            return d && d.length ? d.slice().sort() : [1, 2, 3];
        }
        function addDokBoxes(row, std, on) {
            const wrap = el('div', 'dokbox');
            [1, 2, 3].forEach(d => {
                const lab = el('label'), cb = el('input');
                cb.type = 'checkbox'; cb.dataset.d = d; cb.checked = dokFor(std.id).includes(d); cb.disabled = !on;
                cb.setAttribute('aria-label', `${std.id} DOK ${d}`);
                cb.addEventListener('change', () => {
                    const s = S(), set = new Set(dokFor(std.id));
                    if (cb.checked) set.add(d); else set.delete(d);
                    if (!set.size) { cb.checked = true; flash('Keep at least one DOK level checked for each standard.'); return; }
                    s.dok = s.dok || {};
                    if (set.size === 3) delete s.dok[std.id]; else s.dok[std.id] = [...set].sort();
                    build();
                });
                lab.append(cb, document.createTextNode(String(d)));
                wrap.appendChild(lab);
            });
            row.appendChild(wrap);
        }
        // Version code piece for DOK choices: ".<standard index><mask>" for any standard not using all three
        function dokCode() {
            const s = S();
            return STANDARDS.map((x, i) => {
                const d = s.dok && s.dok[x.id];
                if (!d || d.length === 3 || s.sel[x.id] === undefined) return '';
                return b36(i) + b36(d.reduce((m, k) => m | (1 << (k - 1)), 0));
            }).join('');
        }
        function readDokCode(part) {
            const dok = {};
            if (!part) return dok;
            if (part.length % 2) return null;
            for (let i = 0; i < part.length; i += 2) {
                const std = STANDARDS[parseInt(part[i], 36)], mask = parseInt(part[i + 1], 36);
                if (!std || isNaN(mask) || mask < 1 || mask > 7) return null;
                dok[std.id] = [1, 2, 3].filter(k => mask & (1 << (k - 1)));
            }
            return dok;
        }

        // ---------- Version codes ----------
        // A version code holds the random seed AND the settings, so typing it back in (even on another
        // computer, or after closing the page) rebuilds the exact same test:  SEED-MODE+SETTINGS-STANDARDS
        const MODE_CHARS = { cfa: 'C', eou: 'E', exit: 'X', morning: 'W', lesson: 'L' };
        const b36 = n => Number(n).toString(36).toUpperCase();
        function versionCode() {
            const s = S();
            const flags = VERSION_FLAGS.map(([key, map, dflt]) => {
                const v = s[key] === undefined ? dflt : s[key];
                return map ? (map[v] || '?') : (typeof v === 'boolean' ? (v ? '1' : '0') : String(v));
            }).join('');
            const sel = STANDARDS.map((x, i) => s.sel[x.id] === undefined ? '' : b36(i) + SEL_CODE(s.sel[x.id])).join('');
            const dk = dokCode();
            return `${state.code}-${MODE_CHARS[state.mode]}${flags}-${sel}` + (dk ? '.' + dk : '');
        }
        function applyVersion(raw) {
            const [text, dokPart] = raw.toUpperCase().replace(/VERSION/g, '').replace(/\s+/g, '').split('.');
            const dokRead = readDokCode(dokPart);
            if (dokRead === null) return false;
            if (/^[A-Z0-9]{4}$/.test(text)) { state.code = text; return true; }      // old four-letter codes: seed only
            const parts = text.split('-');
            if (parts.length !== 3 || !/^[A-Z0-9]{4}$/.test(parts[0])) return false;
            const mode = Object.keys(MODE_CHARS).find(m => MODE_CHARS[m] === parts[1][0]);
            const flags = parts[1].slice(1);
            if (!mode) return false;
            let flags2 = flags;
            if (flags2.length === VERSION_FLAGS.length - 1) flags2 += VERSION_FLAGS[VERSION_FLAGS.length - 1][1][VERSION_FLAGS[VERSION_FLAGS.length - 1][2]];   // codes made before the block setting
            if (flags2.length !== VERSION_FLAGS.length) return false;
            const s = state.settings[mode];
            const next = {};
            for (let i = 0; i < VERSION_FLAGS.length; i++) {
                const [key, map, dflt] = VERSION_FLAGS[i], ch = flags2[i];
                if (map) {
                    const v = Object.keys(map).find(k => map[k] === ch);
                    if (v === undefined) return false;
                    next[key] = v;
                } else next[key] = typeof dflt === 'boolean' ? ch === '1' : ch;
            }
            const sel = {}, size = SEL_SIZE + 1;
            if (parts[2].length % size) return false;
            for (let i = 0; i < parts[2].length; i += size) {
                const std = STANDARDS[parseInt(parts[2][i], 36)];
                const val = SEL_READ(parts[2].slice(i + 1, i + size));
                if (!std || val === null) return false;
                sel[std.id] = val;
            }
            // Older codes had one level for the whole test; turn it into per-standard DOK choices
            const oldLevel = { basic: [1], 'on-grade': [2], advanced: [3], '1': [1], '2': [2], '3': [3] }[next.rigor];
            const dok = Object.keys(dokRead).length ? dokRead : (oldLevel ? Object.fromEntries(Object.keys(sel).map(id => [id, oldLevel])) : {});
            next.rigor = 'mix';
            Object.assign(s, next, { sel , dok });
            state.mode = mode;
            state.code = parts[0];
            return true;
        }

        function build() {
            $('f-code').value = versionCode();
            const s = S();
            const notices = { swap: [], level: [], short: [] };
            const rng = makeRng(state.code + '|' + state.mode);
            if (state.mode === 'lesson') {
                state.built = { sections: [], lesson: buildLesson(s, rng, notices), notices: [...new Set(notices.short)] };
                renderNotices(); renderSheet();
                return;
            }
            if (state.mode === 'morning') {
                state.built = { sections: buildMorning(s, rng, notices), notices: [...new Set(notices.short)] };
                renderNotices(); renderSheet();
                return;
            }
            const ids = STANDARDS.map(x => x.id).filter(id => s.sel[id] && id !== CONTEXT_STD);
            const sections = ids.map(id => buildSection(id, s.sel[id].mc, s.sel[id].wr, s.genre, levelsFor(id), rng, notices));
            if (s.sel[CONTEXT_STD]) addContextClues(sections, s.sel[CONTEXT_STD].mc, s.sel[CONTEXT_STD].wr, s.genre, levelsFor(CONTEXT_STD), rng, notices);
            const msgs = [...notices.short];
            const other = s.genre === 'fiction' ? 'nonfiction' : 'fiction';
            if (notices.swap.length) msgs.push(`No ${s.genre} passage exists for ${notices.swap.join(', ')}, so ${notices.swap.length > 1 ? 'those use their' : 'it uses its'} ${other} passage.`);
            if (notices.level.length) msgs.push(`Some checked DOK levels ran short, so a few questions came from another level: ${notices.level.join(', ')}. The teacher key tags each question's DOK.`);
            state.built = { sections, notices: msgs };
            renderNotices();
            renderSheet();
        }

        // ---------- Builder panel ----------
        function renderControls() {
            const s = S();
            document.querySelectorAll('.modes button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode)));
            document.body.dataset.mode = state.mode;
            $('btn-print').textContent = state.mode === 'lesson' ? 'Print lesson and worksheet' : 'Print';
            $('f-copies').value = s.copies || '2';
            $('f-block').value = s.block || '120';
            $('f-days').value = s.days || '5';
            $('f-perday').value = s.perDay || '4';
            $('f-written').checked = !!s.written;
            $('f-passage').checked = !!s.passage;
            $('std-hint').textContent = state.mode === 'lesson'
                ? 'Pick one standard. You get a full timed lesson for the reading block (teacher guide), a lesson practice page, and a small group practice page with a second text. New version pulls fresh texts and questions. The lesson builds its own DOK 1 to 3 progression, so the DOK boxes are hidden here.'
                : state.mode === 'morning'
                ? 'Pick the standards to spiral. Each day uses the next reading passage in the rotation, plus a context-clue question (4.RC.10) and a word-work question (4.RC.11 to 4.RC.13) if those are picked.'
                : state.mode === 'exit'
                ? 'Pick one standard (4.RC.10 can be added to it). Two or three questions is plenty for an exit ticket.'
                : state.mode === 'cfa'
                ? `Pick up to ${CFA_MAX_STANDARDS} standards: one main target and an optional second. Set how many of each question type.`
                : 'Pick every standard the unit covered. Each one gets its own passage and section, except 4.RC.10, which uses words from the other passages.';
            $('f-title').value = s.title;
            $('f-sub').value = s.sub;
            $('f-genre').value = s.genre;
            $('f-newpage').checked = s.newPage;
            $('f-score').checked = s.score;
            $('f-code').value = versionCode();
            $('btn-key').setAttribute('aria-pressed', String(state.showKey));

            const list = $('std-list');
            list.innerHTML = '<div class="std-head"><span></span><span>Standard</span><span class="cnt">Multiple choice</span><span class="cnt">Written</span><span class="dokh">DOK</span></div>';
            STANDARDS.forEach(std => {
                const pick = s.sel[std.id];
                const row = document.createElement('div');
                row.className = 'std-row' + (pick ? ' on' : '');
                const name = std.label.replace(std.id + ': ', '');
                const mcMax = std.id === CONTEXT_STD ? 10 : (QUESTION_POOLS[std.id] || []).length;
                const wrMax = std.id === CONTEXT_STD ? 3 : (WRITTEN_QUESTION_POOLS[std.id] || []).length;
                row.innerHTML = `
                    <input type="checkbox" aria-label="Include ${std.id}" ${pick ? 'checked' : ''}>
                    <div><div class="std-name"><b>${std.id}</b> ${name}</div><div class="std-desc">${std.desc}</div></div>
                    <input type="number" min="1" max="${mcMax}" aria-label="${std.id} multiple-choice count" value="${pick ? pick.mc : s.defaultCounts.mc}" ${pick ? '' : 'disabled'}>
                    <select aria-label="${std.id} written count" ${pick ? '' : 'disabled'}>
                        ${Array.from({ length: wrMax + 1 }, (_, n) => `<option value="${n}" ${(pick ? pick.wr : s.defaultCounts.wr) === n ? 'selected' : ''}>${n}</option>`).join('')}
                    </select>`;
                addDokBoxes(row, std, !!pick);
                const [box, num, sel] = [row.querySelector('input[type=checkbox]'), row.querySelector('input[type=number]'), row.querySelector('select')];
                box.addEventListener('change', () => {
                    if (box.checked) {
                        if (state.mode === 'lesson') {
                            s.sel = {};
                        } else if (state.mode === 'exit') {
                            // One standard at a time: picking a new one replaces the old one (4.RC.10 can ride along)
                            if (std.id !== CONTEXT_STD) Object.keys(s.sel).forEach(id => { if (id !== CONTEXT_STD) delete s.sel[id]; });
                        } else if (state.mode === 'cfa' && Object.keys(s.sel).length >= CFA_MAX_STANDARDS) {
                            box.checked = false;
                            flash(`A Quick CFA covers up to ${CFA_MAX_STANDARDS} standards. Switch to End of Unit to include more.`);
                            return;
                        }
                        s.sel[std.id] = { mc: clampInt(num.value, 1, mcMax, s.defaultCounts.mc), wr: parseInt(sel.value, 10) };
                    } else {
                        delete s.sel[std.id];
                    }
                    renderControls(); build();
                });
                num.addEventListener('change', () => {
                    num.value = clampInt(num.value, 1, mcMax, s.defaultCounts.mc);
                    if (s.sel[std.id]) { s.sel[std.id].mc = parseInt(num.value, 10); updateTotals(); build(); }
                });
                sel.addEventListener('change', () => {
                    if (s.sel[std.id]) { s.sel[std.id].wr = parseInt(sel.value, 10); updateTotals(); build(); }
                });
                list.appendChild(row);
            });
            updateTotals();
        }

        function updateTotals() {
            const s = S();
            const picks = Object.values(s.sel);
            const mc = picks.reduce((n, p) => n + p.mc, 0);
            const wr = picks.reduce((n, p) => n + p.wr, 0);
            $('totals').textContent = picks.length
                ? `${picks.length} standard${picks.length > 1 ? 's' : ''}, ${mc} multiple choice, ${wr} written`
                : 'No standards picked yet';
        }

        function clampInt(v, lo, hi, fallback) {
            const n = parseInt(v, 10);
            if (isNaN(n)) return fallback;
            return Math.min(hi, Math.max(lo, n));
        }

        let flashMsg = '';
        function flash(msg) { flashMsg = msg; renderNotices(); }
        function renderNotices() {
            const box = $('notices');
            const msgs = [...(flashMsg ? [flashMsg] : []), ...((state.built && state.built.notices) || [])];
            flashMsg = '';
            box.innerHTML = msgs.map(m => `<p>${m}</p>`).join('');
        }

        // CFA uses the core paragraphs; End of Unit adds the paragraphs marked with "+"
        function passageParagraphs(passage) {
            return passage.text
                .filter(t => state.mode === 'eou' || !t.startsWith('+'))
                .map(t => t.replace(/^\+/, ''));
        }

        // 1, 2, 3, 4, 7, 9 -> "1 to 4, 7, 9"
        function listNums(nums) {
            const out = [];
            for (let i = 0; i < nums.length; i++) {
                let j = i;
                while (j + 1 < nums.length && nums[j + 1] === nums[j] + 1) j++;
                out.push(j - i >= 2 ? `${nums[i]} to ${nums[j]}` : nums.slice(i, j + 1).join(', '));
                i = j;
            }
            return out.join(', ');
        }

        // ---------- Printable sheet ----------
        function el(tag, cls, text) {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text !== undefined) e.textContent = text;
            return e;
        }

        // ---------- Full lesson (Lesson tab) ----------
        // Timed for the whole block. Base minutes are for a 120-minute reading block and scale to other lengths.
        const LESSON_SEGMENTS = [
            ['warm', 'Warm-up: word work', 10, 'Students answer the questions on the Word Work page.'],
            ['teach', 'Mini-lesson (I do)', 15, 'Teach the target and model the strategy aloud.'],
            ['shared', 'Shared reading (We do)', 20, 'Read the main text together and answer the practice-together questions.'],
            ['indep', 'Independent practice (You do)', 25, 'Students answer the on-your-own questions and fill in the organizer.'],
            ['tier2', 'Tier 2 small groups', 30, 'Meet with each group using the small group practice page.'],
            ['write', 'Writing about reading', 15, 'Students answer the written response.'],
            ['close', 'Closing and exit check', 5, 'Students answer the exit check; sort them to plan tomorrow\'s groups.']
        ];
        function scaleSegments(total) {
            const base = LESSON_SEGMENTS.reduce((n, x) => n + x[2], 0);
            const mins = LESSON_SEGMENTS.map(x => Math.max(5, Math.round(x[2] * total / base / 5) * 5));
            mins[4] += total - mins.reduce((a, b) => a + b, 0);       // small groups absorb the rounding
            if (mins[4] < 5) mins[4] = 5;
            return mins;
        }

        // Questions and written prompts that go with one passage of a standard
        function vocabToMC(v, p) {
            return { std: CONTEXT_STD, rigor: v.rigor, c: v.c, d: v.d,
                q: `Read this sentence from "${shortTitle(p.title)}": "${v.sentence}" What does "${v.word}" mean in this sentence?` };
        }
        function lessonItems(id, p, rng) {
            if (id === CONTEXT_STD) return {
                mc: shuffle((CONTEXT_CLUES[p.title] || []).map(v => vocabToMC(v, p)), rng),
                wr: shuffle(WRITTEN_QUESTION_POOLS[id] || [], rng)
            };
            return {
                mc: shuffle((QUESTION_POOLS[id] || []).filter(q => passageNeeded(id, q) === p.id), rng),
                wr: shuffle((WRITTEN_QUESTION_POOLS[id] || []).filter(w => { const n = passageNeeded(id, w); return n === p.id || n === null; }), rng)
            };
        }

        function buildLesson(s, rng, notices) {
            const id = Object.keys(s.sel)[0];
            if (!id) return null;
            const cands = id === CONTEXT_STD ? Object.values(PASSAGES).flat().filter(p => CONTEXT_CLUES[p.title]) : (PASSAGES[id] || []);
            const fit = cands.filter(p => s.genre === 'auto' || p.genre === s.genre || p.genre === 'both');
            const order = shuffle(fit.length ? fit : cands, rng);
            const main = order[0], alt = order[1] || order[0];
            const A = lessonItems(id, main, rng), B = alt === main ? A : lessonItems(id, alt, rng);
            // Stand-alone questions (no passage needed) are a shared backup for both texts
            const extra = shuffle((QUESTION_POOLS[id] || []).filter(q => passageNeeded(id, q) === null), rng);
            const grab = (arr, lvl) => { const i = lvl ? arr.findIndex(q => q.rigor === lvl) : (arr.length ? 0 : -1); return i < 0 ? null : arr.splice(i, 1)[0]; };
            const take = (P, lvl) => grab(P.mc, lvl) || grab(extra, lvl) || grab(P.mc) || grab(extra);
            const prep = q => q ? { ...q, ...shuffleOptions(q.c, q.d, rng) } : null;
            const model = prep(take(A, 'basic'));
            const weDo = [take(A, 'basic'), take(A, 'on-grade')].map(prep).filter(Boolean);
            const youDo = [take(A, 'on-grade'), take(A, 'advanced'), take(A, 'advanced')].map(prep).filter(Boolean);
            const writing = A.wr.shift() || null;
            const exit = A.wr.shift() || (B !== A && B.wr.shift()) || null;
            // Small groups: two at each level when the text has them, then share out whatever is left
            const levels = ['basic', 'on-grade', 'advanced'], groups = [[], [], []];
            for (let r = 0; r < 2; r++) levels.forEach((l, i) => { const q = grab(B.mc, l) || grab(extra, l); if (q) groups[i].push(q); });
            for (let i = 0; i < 3; i++) while (groups[i].length < 2) { const q = take(B); if (!q) break; groups[i].push(q); }
            groups.forEach((g, i) => { groups[i] = g.map(prep); });
            // Warm-up word work: a context clue from today's text plus word relationships and word parts
            const warm = [];
            if (id !== CONTEXT_STD && (CONTEXT_CLUES[main.title] || []).length) warm.push(prep(vocabToMC(shuffle(CONTEXT_CLUES[main.title], rng)[0], main)));
            const used = new Set([model, ...weDo, ...youDo, ...groups.flat()].filter(Boolean).map(q => q.q));
            const wordStds = ['4.RC.11', '4.RC.12'].filter(w => w !== id);
            for (let k = 0; warm.length < 3 && k < 6; k++) {
                const w = wordStds[k % wordStds.length];
                const q = shuffle((QUESTION_POOLS[w] || []).filter(x => !x.p && !used.has(x.q) && !warm.some(y => y.q === x.q)), rng)[0];
                if (q) warm.push(prep({ ...q, std: w }));
            }
            if (groups.flat().length < 6) notices.short.push(`${id}: the small group text ran out of questions, so some groups have fewer than two.`);
            return { id, main, alt: alt === main ? null : alt, model, weDo, youDo, writing, exit, groups, warm };
        }

        function renderLesson() {
            const s = S(), sheet = $('sheet');
            const D = state.built.lesson;
            const L = D && LESSONS[D.id], std = D && STANDARDS.find(x => x.id === D.id);
            if (!D || !L) { sheet.appendChild(el('p', 'empty', 'Pick a standard to build a lesson.')); return; }
            const block = Number(s.block || 120), mins = scaleSegments(block);
            const seg = Object.fromEntries(LESSON_SEGMENTS.map((x, i) => [x[0], { name: x[1], min: mins[i] }]));
            const title = p => p.title.replace(/^[^:]*:\s*/, '');
            const box = (cls, h) => { const b = el('div', 'lbox ' + cls); b.appendChild(el('h2', '', h)); return b; };
            const list = (items, ordered, plain) => { const l = el(ordered ? 'ol' : 'ul', plain ? 'plain' : ''); items.forEach(t => l.appendChild(el('li', '', t))); return l; };
            const keyList = (qs, start) => list(qs.map((q, i) => `${start + i}. ${q.correctLetter}: ${q.c}`), false, true);
            const segBox = k => box('', `${seg[k].name} (${seg[k].min} min)`);
            const guide = el('div', 'teacher-part');

            const head = el('div', 'l-head');
            head.appendChild(el('h1', '', `${s.title || 'Lesson'}: ${std.label}`));
            head.appendChild(el('p', '', `Full lesson, ${block} minutes  |  Main text: ${title(D.main)}  |  Small group text: ${title(D.alt || D.main)}  |  Version ${versionCode()}`));
            guide.appendChild(head);
            const t = box('target', 'Learning target'); t.appendChild(el('div', '', L.target)); guide.appendChild(t);

            const ag = box('', 'Lesson at a glance');
            const at = el('table', 'grid');
            let clockMin = 0;
            at.innerHTML = '<tr><th>Part</th><th>Minutes</th><th>What happens</th></tr>' + LESSON_SEGMENTS.map((x, i) => {
                const row = `<tr><td><b>${x[1]}</b></td><td>${clockMin} to ${clockMin + mins[i]}</td><td>${x[3]}</td></tr>`;
                clockMin += mins[i]; return row;
            }).join('');
            ag.appendChild(at); guide.appendChild(ag);

            const v = box('', 'Key vocabulary');
            const vt = el('table', 'grid'); vt.innerHTML = L.vocab.map(([w, d]) => `<tr><td style="width:30%"><b>${w}</b></td><td>${d}</td></tr>`).join('');
            v.appendChild(vt); guide.appendChild(v);

            const w1 = segBox('warm');
            w1.appendChild(el('div', '', 'Students work quietly on the Word Work page, then share answers and the clues they used. (Print it separately with "Print word work only.")'));
            w1.appendChild(keyList(D.warm, 1)); guide.appendChild(w1);

            const m = segBox('teach');
            m.appendChild(list(L.teach));
            m.appendChild(el('div', 'mini-q', 'Model the strategy aloud:'));
            m.appendChild(list(L.steps, true));
            if (D.model) {
                const mq = el('div', 'mini-q'); mq.innerHTML = '<b>Example question to model:</b> '; mq.appendChild(document.createTextNode(D.model.q)); m.appendChild(mq);
                m.appendChild(el('div', '', D.model.options.map(o => `${o.label}. ${o.text}`).join('   ')));
                m.appendChild(el('div', 'say', `Answer: ${D.model.correctLetter}. ${D.model.c}  Say: "I can prove this with the words in the text, and I can cross out the other choices because the text does not support them."`));
            }
            guide.appendChild(m);

            const sr = segBox('shared');
            sr.appendChild(el('div', '', `Read "${title(D.main)}" aloud while students follow along. Stop after each paragraph or two to ask what they noticed.`));
            if (D.writing) sr.appendChild(el('div', 'say', `Turn and talk: ${D.writing.q}`));
            sr.appendChild(el('div', 'mini-q', 'Practice together answers (first two questions after the passage):'));
            sr.appendChild(keyList(D.weDo, 1));
            guide.appendChild(sr);

            const ind = segBox('indep');
            ind.appendChild(el('div', '', `Students answer on their own, then complete the ${L.organizer.title} organizer. Circulate and note who needs the reteach group.`));
            ind.appendChild(keyList(D.youDo, D.weDo.length + 1));
            guide.appendChild(ind);

            const t2 = segBox('tier2');
            const each = Math.max(5, Math.round(seg.tier2.min / 3 / 5) * 5);
            t2.appendChild(el('div', '', `Pull three groups for about ${each} minutes each, using the Small Group Practice page${D.alt ? ` with "${title(D.alt)}"` : ''}. Students not with you reread, finish the organizer, or read independently.`));
            const gNames = ['Group 1: Reteach (students who missed the practice questions)', 'Group 2: On level (students who are close)', 'Group 3: Enrich (students who are ready for more)'];
            const gNotes = [`Reteach with support: ${L.support} Reread the text with them and work each question together, naming the strategy step you are using.`,
                'Partners answer the questions, then explain their evidence to you before checking.',
                `Students answer the questions on their own, then do the challenge: ${L.extend}`];
            let gn = 1;
            D.groups.forEach((g, i) => {
                t2.appendChild(el('div', 'mini-q', gNames[i]));
                t2.appendChild(el('div', '', gNotes[i]));
                if (g.length) t2.appendChild(keyList(g, gn));
                gn += g.length;
            });
            t2.appendChild(el('div', 'mini-q', 'Watch for:'));
            t2.appendChild(list(L.watch));
            guide.appendChild(t2);

            const wr = segBox('write');
            if (D.writing) {
                wr.appendChild(el('div', '', `Prompt: ${D.writing.q}`));
                wr.appendChild(el('div', 'say', `Look for: ${D.writing.key.replace(/^Look for:\s*/i, '')}`));
            }
            wr.appendChild(el('div', '', 'Model the first sentence: restate the question, then add evidence ("In the text, it says...").'));
            guide.appendChild(wr);

            const cl = segBox('close');
            if (D.exit) {
                cl.appendChild(el('div', '', `Exit check: ${D.exit.q}`));
                cl.appendChild(el('div', 'say', `Look for: ${D.exit.key.replace(/^Look for:\s*/i, '')}`));
            }
            cl.appendChild(el('div', '', 'Sort the exit checks into three piles (got it, almost, not yet) to set tomorrow\'s small groups.'));
            guide.appendChild(cl);
            sheet.appendChild(guide);

            // ---- Student pages ----
            const mcEl = (q, n) => {
                const qd = el('div', 'q'); qd.appendChild(el('div', 'q-num', n + '.'));
                const body = el('div'); body.appendChild(el('div', 'q-stem', q.q));
                const opts = el('div', 'opts');
                q.options.forEach(o => {
                    const row = el('div', 'opt' + (state.showKey && o.label === q.correctLetter ? ' correct' : ''));
                    row.appendChild(el('span', 'bubble', o.label)); row.appendChild(el('span', 'opt-text', o.text)); opts.appendChild(row);
                });
                body.appendChild(opts); qd.appendChild(body); return qd;
            };
            const wrEl = (w, n, lines) => {
                const qd = el('div', 'q'); qd.appendChild(el('div', 'q-num', n + '.'));
                const body = el('div'); body.appendChild(el('div', 'q-stem', w.q));
                if (state.showKey) body.appendChild(el('div', 'lookfor', 'Look for: ' + w.key.replace(/^Look for:\s*/i, '')));
                else { const l = el('div', 'wlines'); for (let k = 0; k < lines; k++) l.appendChild(el('span')); body.appendChild(l); }
                qd.appendChild(body); return qd;
            };
            const pageHead = (h) => {
                const sh = el('div', 'x-head'), left = el('div');
                left.appendChild(el('h1', 'x-title', h + (state.showKey ? ' (Teacher Key)' : '')));
                left.appendChild(el('p', 'x-std', `${D.id}  |  ${L.target}`));
                const nm = el('div', 'x-name'); nm.append('Name:', el('span'));
                sh.append(left, nm); return sh;
            };
            const passageEl = pg => {
                const p = el('div', 'passage');
                p.appendChild(el('h3', '', pg.title));
                passageParagraphs(pg).forEach((tx, k) => {
                    const para = el('p'); para.appendChild(el('span', 'pnum', String(k + 1)));
                    const body = el('span'); body.innerHTML = tx; para.appendChild(body); p.appendChild(para);
                });
                return p;
            };

            // Word work gets its own page so it can be printed separately
            const ww = el('div', 'newpage student-part word-work-part');
            ww.appendChild(pageHead('Word Work'));
            let wn = 1;
            D.warm.forEach(q => ww.appendChild(mcEl(q, wn++)));
            sheet.appendChild(ww);

            const stu = el('div', 'newpage student-part practice-part');
            stu.appendChild(pageHead(`Lesson Practice: ${std.label.replace(/^[^:]*:\s*/, '')}`));
            let n = 1;
            stu.appendChild(passageEl(D.main));
            stu.appendChild(el('div', 'stu-h', 'Practice together'));
            D.weDo.forEach(q => stu.appendChild(mcEl(q, n++)));
            stu.appendChild(el('div', 'stu-h', 'On your own'));
            D.youDo.forEach(q => stu.appendChild(mcEl(q, n++)));
            const org = el('div', 'end-block');
            org.appendChild(el('div', 'stu-h', L.organizer.title));
            const ot = el('table', 'org');
            ot.innerHTML = '<tr>' + L.organizer.cols.map(c => `<th>${c}</th>`).join('') + '</tr>' + Array.from({ length: L.organizer.rows }, () => '<tr>' + L.organizer.cols.map(() => '<td></td>').join('') + '</tr>').join('');
            org.appendChild(ot); stu.appendChild(org);
            if (D.writing) { stu.appendChild(el('div', 'stu-h', 'Writing about reading')); stu.appendChild(wrEl(D.writing, n++, 7)); }
            if (D.exit) { stu.appendChild(el('div', 'stu-h', 'Exit check')); stu.appendChild(wrEl(D.exit, n++, 3)); }
            sheet.appendChild(stu);

            const sg = el('div', 'newpage student-part group-part');
            sg.appendChild(pageHead('Small Group Practice'));
            if (D.alt) sg.appendChild(passageEl(D.alt));
            else sg.appendChild(el('p', 'x-note', `Use "${title(D.main)}" from your lesson practice page.`));
            let g = 1;
            ['Group 1', 'Group 2', 'Group 3'].forEach((name, i) => {
                if (!D.groups[i].length && i < 2) return;
                const sec = el('div', 'end-block');
                sec.appendChild(el('div', 'stu-h', name));
                if (i === 0) {
                    const rem = el('div', 'lbox');
                    rem.appendChild(el('h2', '', 'Remember the steps'));
                    rem.appendChild(list(L.steps, true));
                    sec.appendChild(rem);
                }
                D.groups[i].forEach(q => sec.appendChild(mcEl(q, g++)));
                if (i === 2) {
                    sec.appendChild(el('div', 'q-stem', `Challenge: ${L.extend}`));
                    const l = el('div', 'wlines'); for (let k = 0; k < 4; k++) l.appendChild(el('span')); sec.appendChild(l);
                }
                sg.appendChild(sec);
            });
            sheet.appendChild(sg);
        }

        function renderSheet() {
            $('f-code').value = versionCode();   // settings that only re-render (copies, title) still update the code
            const s = S();
            const sheet = $('sheet');
            sheet.innerHTML = '';
            const { sections } = state.built;
            if (state.mode === 'lesson') { renderLesson(); return; }

            const exit = state.mode === 'exit';
            const out = exit ? el('div', 'ticket') : sheet;   // an exit ticket is built once, then copied
            const stdIds = STANDARDS.map(x => x.id).filter(id => sections.some(x => x.stdId === id || (id === CONTEXT_STD && x.hasContext)));

            const morning = state.mode === 'morning';
            if (morning) {
                // each day gets its own header below
            } else if (exit) {
                const head = el('div', 'x-head');
                const left = el('div');
                left.appendChild(el('h1', 'x-title', (s.title || 'Exit Ticket') + (state.showKey ? ' (Teacher Key)' : '')));
                left.appendChild(el('p', 'x-std', (stdIds.map(id => STANDARDS.find(x => x.id === id).label).join('; ') || 'No standard picked') + (s.sub ? '  |  ' + s.sub : '') + '  |  Version ' + versionCode()));
                const nm = el('div', 'x-name'); nm.append('Name:', el('span'));
                head.append(left, nm);
                out.appendChild(head);
            } else {
                const head = el('div', 't-head');
                const left = el('div');
                left.appendChild(el('h1', 't-title', s.title || 'ELA Assessment'));
                if (s.sub) left.appendChild(el('p', 't-sub', s.sub));
                left.appendChild(el('p', 't-std', 'Standards: ' + (stdIds.join(', ') || 'none picked')));
                const right = el('div', 't-lines');
                right.innerHTML = '<div>Name:<span class="fill"></span></div><div>Date:<span class="fill"></span></div>';
                head.append(left, right);
                sheet.appendChild(head);
                const meta = el('div', 't-meta');
                meta.appendChild(el('span', '', 'Version ' + versionCode()));
                if (state.showKey) meta.appendChild(el('span', 't-badge', 'TEACHER KEY'));
                sheet.appendChild(meta);
            }

            if (!sections.length) {
                sheet.appendChild(el('p', 'empty', 'Pick at least one standard to build an assessment.'));
                return;
            }

            let n = 1;
            const keyRows = [];
            const perStd = [];

            sections.forEach((sec, i) => {
                const std = STANDARDS.find(x => x.id === sec.stdId);
                const wrap = el('div', 'section' + (morning ? (sec.firstOfDay && i > 0 ? ' newpage' : '') : (!exit && s.newPage && i > 0 ? ' newpage' : '')));
                if (morning && sec.firstOfDay) {
                    n = 1;
                    const dayIds = new Set();
                    sections.filter(x => x.day === sec.day).forEach(x => x.blocks.forEach(b => b.questions.forEach(q => dayIds.add(q.std || x.stdId))));
                    sections.filter(x => x.day === sec.day).forEach(x => x.written.forEach(w => dayIds.add(w.std || x.stdId)));
                    const head = el('div', 'x-head');
                    const left = el('div');
                    left.appendChild(el('h1', 'x-title', `${s.title || 'Morning Work'}: Day ${sec.day + 1}` + (state.showKey ? ' (Teacher Key)' : '')));
                    left.appendChild(el('p', 'x-std', 'Review: ' + STANDARDS.map(x => x.id).filter(id => dayIds.has(id)).join(', ') + (s.sub ? '  |  ' + s.sub : '') + '  |  Version ' + versionCode()));
                    const nm = el('div', 'x-name'); nm.append('Name:', el('span'));
                    head.append(left, nm);
                    wrap.appendChild(head);
                }
                if (!exit && !morning) wrap.appendChild(el('p', 'sec-label', std.label + (sec.hasContext && sec.stdId !== CONTEXT_STD ? ', with 4.RC.10: Context Clues' : '')));
                const tally = (id, kind) => {
                    let r = perStd.find(x => x.id === id);
                    if (!r) { r = { id, nums: [], mc: 0, wr: 0 }; perStd.push(r); }
                    r.nums.push(n); r[kind]++;
                };

                sec.blocks.forEach(block => {
                    if (block.passage && exit && !s.passage) {
                        const k = block.questions.length;
                        wrap.appendChild(el('p', 'x-note', `Use "${block.passage.title.replace(/^[^:]*:\s*/, '')}" to answer ${k > 1 ? `questions ${n} to ${n + k - 1}` : `question ${n}`}${sec.written.length ? ' and the written response' : ''}.`));
                    } else if (block.word) {
                        if (block.questions.length) wrap.appendChild(el('div', 'wr-head', 'Word work'));
                    } else if (block.passage) {
                        const p = el('div', 'passage');
                        p.appendChild(el('h3', '', block.passage.title));
                        passageParagraphs(block.passage).forEach((t, k) => {
                            const para = el('p');
                            para.appendChild(el('span', 'pnum', String(k + 1)));
                            const body = el('span'); body.innerHTML = t; para.appendChild(body);
                            p.appendChild(para);
                        });
                        wrap.appendChild(p);
                    }
                    block.questions.forEach(q => {
                        const qd = el('div', 'q');
                        qd.appendChild(el('div', 'q-num', n + '.'));
                        const body = el('div');
                        const stem = el('div', 'q-stem', q.q);
                        if (state.showKey) stem.appendChild(el('span', 'tag', (q.std ? q.std + ', ' : '') + LEVEL_NAME[q.rigor]));
                        body.appendChild(stem);
                        const opts = el('div', 'opts');
                        q.options.forEach(o => {
                            const row = el('div', 'opt' + (state.showKey && o.label === q.correctLetter ? ' correct' : ''));
                            row.appendChild(el('span', 'bubble', o.label));
                            row.appendChild(el('span', 'opt-text', o.text));
                            opts.appendChild(row);
                        });
                        body.appendChild(opts);
                        qd.appendChild(body);
                        wrap.appendChild(qd);
                        keyRows.push([n, q.correctLetter, q.std || sec.stdId, LEVEL_NAME[q.rigor], sec.day]);
                        tally(q.std || sec.stdId, 'mc');
                        n++;
                    });
                });

                if (sec.written.length) {
                    wrap.appendChild(el('div', 'wr-head', 'Written response'));
                    sec.written.forEach(w => {
                        const qd = el('div', 'q');
                        qd.appendChild(el('div', 'q-num', n + '.'));
                        const body = el('div');
                        const wstem = el('div', 'q-stem', w.q);
                        if (state.showKey && w.std) wstem.appendChild(el('span', 'tag', w.std));
                        body.appendChild(wstem);
                        if (state.showKey) {
                            const lf = el('div', 'lookfor');
                            lf.innerHTML = '<b>Look for:</b> ';
                            lf.appendChild(document.createTextNode(w.key.replace(/^Look for:\s*/i, '')));
                            body.appendChild(lf);
                        } else {
                            const lines = el('div', 'wlines');
                            for (let k = 0; k < (exit ? 3 : 5); k++) lines.appendChild(el('span'));
                            body.appendChild(lines);
                        }
                        qd.appendChild(body);
                        wrap.appendChild(qd);
                        keyRows.push([n, 'Written', w.std || sec.stdId, '', sec.day]);
                        tally(w.std || sec.stdId, 'wr');
                        n++;
                    });
                }
                out.appendChild(wrap);
            });

            if (exit) {
                // Student copies repeat the same ticket; the key prints one copy with answers marked
                const copies = state.showKey ? 1 : Number(s.copies || 2);
                sheet.appendChild(out);
                const tooTall = copies > 1 && out.getBoundingClientRect().height / 96 > 4.8;
                for (let c = 1; c < copies; c++) {
                    const copy = out.cloneNode(true);
                    if (tooTall) copy.classList.add('alone');
                    sheet.appendChild(copy);
                }
                if (tooTall) flash('This ticket is too long for two per page, so each copy prints on its own page. Use fewer questions or leave the passage off to fit two.');
                return;
            }

            if (morning) {
                if (state.showKey) {
                    const page = el('div', 'end-block newpage');
                    page.appendChild(el('h3', '', `Morning work answers, version ${versionCode()}`));
                    const t = el('table', 'grid');
                    const days = [...new Set(keyRows.map(r => r[4]))];
                    t.innerHTML = '<tr><th>Day</th><th>Answers</th></tr>' + days.map(d => `<tr><td>Day ${d + 1}</td><td>${keyRows.filter(r => r[4] === d).map(r => `${r[0]}. <b>${r[1] === 'Written' ? 'written' : r[1]}</b> <span style="color:#666">(${r[2]})</span>`).join('&nbsp;&nbsp; ')}</td></tr>`).join('');
                    page.appendChild(t);
                    sheet.appendChild(page);
                }
                return;
            }

            // Score-by-standard table (student copy and key)
            if (s.score) {
                const blockEl = el('div', 'end-block');
                blockEl.appendChild(el('h3', '', 'Score by standard (teacher use)'));
                const t = el('table', 'grid');
                t.innerHTML = '<tr><th>Standard</th><th>Questions</th><th>Multiple choice</th><th>Written</th></tr>' +
                    STANDARDS.map(x => perStd.find(r => r.id === x.id)).filter(Boolean).map(r => `<tr><td>${r.id}</td><td>${listNums(r.nums)}</td><td>_____ / ${r.mc}</td><td>${r.wr ? '_____' : ''}</td></tr>`).join('');
                blockEl.appendChild(t);
                sheet.appendChild(blockEl);
            }

            // Answer key page (key only)
            if (state.showKey) {
                const page = el('div', 'end-block newpage');
                page.appendChild(el('h3', '', `Answer key, version ${versionCode()}`));
                const t = el('table', 'grid');
                t.innerHTML = '<tr><th>#</th><th>Answer</th><th>Standard</th><th>Level</th></tr>' +
                    keyRows.map(r => `<tr><td>${r[0]}</td><td><b>${r[1]}</b></td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('');
                page.appendChild(t);
                sheet.appendChild(page);
            }
        }

        // ---------- Wiring ----------
        function bindField(id, key, evt = 'input') {
            $(id).addEventListener(evt, e => {
                S()[key] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
                key === 'title' || key === 'sub' ? renderSheet() : build();
            });
        }

        function init() {
            document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => {
                state.mode = b.dataset.mode;
                renderControls(); build();
            }));
            bindField('f-title', 'title');
            bindField('f-sub', 'sub');
            bindField('f-genre', 'genre', 'change');
            bindField('f-newpage', 'newPage', 'change');
            bindField('f-score', 'score', 'change');
            bindField('f-copies', 'copies', 'change');
            bindField('f-block', 'block', 'change');
            bindField('f-days', 'days', 'change');
            bindField('f-perday', 'perDay', 'change');
            bindField('f-written', 'written', 'change');
            bindField('f-passage', 'passage', 'change');
            $('clear-all').addEventListener('click', () => { S().sel = {}; renderControls(); build(); });
            $('btn-new').addEventListener('click', () => { state.code = newCode(); build(); });
            $('btn-key').addEventListener('click', () => {
                state.showKey = !state.showKey;
                $('btn-key').setAttribute('aria-pressed', String(state.showKey));
                renderSheet();
            });
            $('btn-print').addEventListener('click', () => window.print());
            $('btn-print-ws').addEventListener('click', () => {
                document.body.classList.add('print-worksheet');
                window.print();
                document.body.classList.remove('print-worksheet');
            });
            $('btn-print-ww').addEventListener('click', () => {
                document.body.classList.add('print-wordwork');
                window.print();
                document.body.classList.remove('print-wordwork');
            });
            window.addEventListener('afterprint', () => document.body.classList.remove('print-worksheet', 'print-wordwork'));
            const loadCode = () => {
                if (!$('f-code').value.trim()) return;
                if (!applyVersion($('f-code').value)) { flash('That version code was not recognized. Check it against the code printed on the test.'); return; }
                renderControls(); build();
            };
            $('btn-load').addEventListener('click', loadCode);
            $('f-code').addEventListener('keydown', e => { if (e.key === 'Enter') loadCode(); });

            renderControls();
            build();
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();
    </script>
</body>
</html>
