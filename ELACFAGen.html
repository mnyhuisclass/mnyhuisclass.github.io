<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4th Grade ELA Assessment Builder</title>
<style>
    :root {
        --teal-900: #0d4448;
        --teal-700: #14676a;
        --teal-500: #1f8f8c;
        --teal-50:  #e9f4f3;
        --gold-500: #e2a52c;
        --gold-100: #fbf0d6;
        --ink:      #1d2a2c;
        --muted:    #5d6e70;
        --line:     #cbd9d8;
        --paper:    #ffffff;
        --desk:     #eef3f2;
        --warn:     #8a5a00;
        --ui: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        --read: Georgia, "Times New Roman", serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--desk); color: var(--ink); font-family: var(--ui); font-size: 15px; line-height: 1.45; }
    button, input, select { font: inherit; color: inherit; }
    :focus-visible { outline: 3px solid var(--gold-500); outline-offset: 2px; }

    /* ---------- Builder panel ---------- */
    #builder { max-width: 1080px; margin: 24px auto; background: var(--paper); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 0 var(--line), 0 8px 24px rgba(13, 68, 72, .08); }
    .band { background: var(--teal-900); color: #fff; display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 18px 24px; }
    .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
    .brand svg { width: 34px; height: 34px; flex: none; }
    .brand h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: .2px; }
    .brand small { display: block; font-size: 13px; font-weight: 400; color: #b9dcda; }
    .modes { display: inline-flex; background: rgba(255,255,255,.1); border-radius: 999px; padding: 4px; }
    .modes button { border: 0; background: transparent; color: #d7ecea; padding: 8px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; }
    .modes button[aria-pressed="true"] { background: var(--gold-500); color: var(--teal-900); }

    .panel { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); }
    .col { padding: 20px 24px 24px; }
    .col + .col { border-left: 1px solid var(--line); background: #fbfdfd; }
    h2 { font-size: 16px; margin: 0 0 4px; color: var(--teal-900); }
    .hint { margin: 0 0 12px; color: var(--muted); font-size: 13px; }

    .std-list { border: 1px solid var(--line); border-radius: 10px; max-height: 460px; overflow-y: auto; }
    .std-head, .std-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) 74px 66px 84px; gap: 8px; align-items: center; padding: 8px 12px; }
    .std-head { position: sticky; top: 0; background: var(--teal-50); font-size: 12px; font-weight: 600; color: var(--teal-700); z-index: 1; }
    .std-head span:nth-child(n+3) { text-align: center; }
    .std-row { border-top: 1px solid var(--line); }
    .std-row.on { background: var(--gold-100); }
    .std-row input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--teal-700); }
    .std-name { font-weight: 600; font-size: 14px; }
    .std-name b { color: var(--teal-700); }
    .std-desc { font-size: 12px; color: var(--muted); }
    .std-row input[type=number], .std-row select { width: 100%; padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; background: #fff; text-align: center; }
    .std-row:not(.on) input[type=number], .std-row:not(.on) select { opacity: .35; }
    .list-tools { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 13px; color: var(--muted); }
    .linkish { border: 0; background: none; color: var(--teal-700); text-decoration: underline; cursor: pointer; padding: 0; }

    .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
    .field label { font-size: 13px; font-weight: 600; color: var(--teal-900); }
    .field input[type=text], .field select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .field .hint { margin: 0; }
    .checks { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 16px; font-size: 14px; }
    .checks label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
    .checks input { width: 17px; height: 17px; margin-top: 2px; accent-color: var(--teal-700); }

    .actions { display: flex; flex-wrap: wrap; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--line); align-items: center; }
    .btn { border: 1px solid var(--teal-700); background: #fff; color: var(--teal-900); padding: 9px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn.primary { background: var(--teal-700); color: #fff; }
    .btn.primary:hover { background: var(--teal-900); }
    .btn.key[aria-pressed="true"] { background: var(--gold-500); border-color: var(--gold-500); color: var(--teal-900); }
    .version { display: flex; align-items: center; gap: 6px; margin-left: auto; font-size: 13px; color: var(--muted); }
    .version input { color: var(--ink); width: 260px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
    #notices { padding: 0 24px; }
    #notices:not(:empty) { padding: 12px 24px 16px; border-top: 1px solid var(--line); background: #fffaf0; }
    #notices p { margin: 4px 0; font-size: 13px; color: var(--warn); }

    @media (max-width: 820px) {
        .panel { grid-template-columns: 1fr; }
        .col + .col { border-left: 0; border-top: 1px solid var(--line); }
        .version { margin-left: 0; }
    }

    /* ---------- Printable test ---------- */
    #sheet { max-width: 8.5in; margin: 0 auto 48px; background: var(--paper); padding: .6in .65in; box-shadow: 0 8px 24px rgba(13, 68, 72, .08); color: #000; }
    .t-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; padding-bottom: 10px; border-bottom: 3px solid var(--teal-700); position: relative; }
    .t-head::after { content: ""; position: absolute; left: 0; bottom: -7px; width: 64px; height: 4px; background: var(--gold-500); }
    .t-title { font-size: 24px; font-weight: 800; margin: 0; line-height: 1.15; }
    .t-sub { font-size: 15px; margin: 2px 0 0; }
    .t-std { font-size: 12px; margin: 6px 0 0; color: #333; }
    .t-lines { flex: 0 0 2.6in; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
    .t-lines div { display: flex; gap: 6px; }
    .t-lines span.fill { flex: 1; border-bottom: 1px solid #000; }
    .t-meta { display: flex; justify-content: space-between; font-size: 11px; color: #555; margin: 12px 0 18px; }
    .t-badge { font-weight: 700; color: #000; background: var(--gold-100); border: 1px solid var(--gold-500); padding: 1px 8px; border-radius: 4px; }

    .section + .section { margin-top: 26px; }
    .sec-label { font-size: 12px; font-weight: 700; color: var(--teal-700); margin: 0 0 8px; }
    .passage { border: 1.5px solid #999; border-radius: 6px; padding: 14px 18px; margin-bottom: 18px; font-family: var(--read); font-size: 15px; line-height: 1.6; }
    .passage h3 { font-family: var(--ui); font-size: 16px; margin: 0 0 6px; }
    .passage p { margin: 0 0 8px; padding-left: 26px; position: relative; text-indent: 1.2em; break-inside: avoid; }
    .passage .pnum { position: absolute; left: 0; top: 2px; text-indent: 0; font-family: var(--ui); font-size: 11px; font-weight: 700; color: #555; }
    .passage h3 { break-after: avoid; }
    .passage p:has(.poem) { text-indent: 0; }
    .passage p strong { display: block; font-family: var(--ui); font-size: 14px; margin: 4px 0 2px; }
    .passage p:last-child { margin-bottom: 0; }
    .q { display: grid; grid-template-columns: 28px 1fr; margin-bottom: 18px; break-inside: avoid; }
    .q-num { font-weight: 700; }
    .q-stem { font-weight: 600; margin-bottom: 8px; }
    .opts { display: grid; gap: 6px; }
    .opt { display: grid; grid-template-columns: 26px 1fr; align-items: start; }
    .bubble { width: 21px; height: 21px; border: 1.5px solid #555; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
    .opt.correct .bubble { background: #000; border-color: #000; color: #fff; }
    .opt.correct .opt-text { font-weight: 700; }
    .tag { display: inline-block; font-size: 11px; color: #444; border: 1px solid #aaa; border-radius: 3px; padding: 0 5px; margin-left: 6px; font-weight: 400; vertical-align: 1px; }
    .wr-head { font-size: 13px; font-weight: 700; margin: 6px 0 10px; padding-bottom: 3px; border-bottom: 1px solid #999; }
    .wlines { display: grid; gap: 22px; margin-top: 18px; }
    .wlines span { border-bottom: 1px solid #999; display: block; }
    .lookfor { margin-top: 8px; padding: 6px 10px; border-left: 4px solid var(--gold-500); background: var(--gold-100); font-size: 13px; }
    .newpage { break-before: page; }
    body:not([data-mode="exit"]) .exit-only, body:not([data-mode="morning"]) .morning-only { display: none; }
    body[data-mode="exit"] .test-only, body[data-mode="morning"] .test-only, body[data-mode="lesson"] .test-only, body[data-mode="lesson"] .no-lesson { display: none; }
    body[data-mode="morning"] .std-row input[type=number], body[data-mode="morning"] .std-row select,
    body[data-mode="lesson"] .std-row input[type=number], body[data-mode="lesson"] .std-row select { visibility: hidden; }
    .dokbox { display: flex; justify-content: center; gap: 6px; font-size: 12px; color: var(--teal-900); }
    .dokbox label { display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: pointer; }
    .dokbox input { width: 16px; height: 16px; accent-color: var(--teal-700); margin: 0; }
    .std-row:not(.on) .dokbox { opacity: .35; }
    body[data-mode="lesson"] .dokbox, body[data-mode="lesson"] .std-head .dokh { visibility: hidden; }
    body[data-mode="morning"] .std-head .cnt, body[data-mode="lesson"] .std-head .cnt { visibility: hidden; }

    .modes { flex-wrap: wrap; }
    body:not([data-mode="lesson"]) .lesson-only { display: none; }
    @media print {
        body.print-worksheet .teacher-part, body.print-worksheet .word-work-part { display: none; }
        body.print-worksheet .practice-part { break-before: auto; }
        body.print-wordwork .teacher-part, body.print-wordwork .practice-part, body.print-wordwork .group-part { display: none; }
        body.print-wordwork .word-work-part { break-before: auto; }
    }
    .l-head { border-bottom: 3px solid var(--teal-700); padding-bottom: 6px; margin-bottom: 14px; }
    .l-head h1 { font-size: 22px; margin: 0; }
    .l-head p { margin: 2px 0 0; font-size: 12px; color: #444; }
    .lbox { border: 1.5px solid #9bb; border-radius: 8px; padding: 8px 14px 10px; margin-bottom: 12px; break-inside: avoid; font-size: 14px; }
    .lbox h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--teal-700); margin: 0 0 6px; }
    .lbox ul, .lbox ol { margin: 0; padding-left: 20px; }
    .lbox li { margin-bottom: 3px; }
    .lbox.target { background: var(--gold-100); border-color: var(--gold-500); font-size: 16px; font-weight: 600; }
    .lbox .mini-q { margin: 6px 0; }
    .lbox .say { font-style: italic; margin-top: 6px; }
    table.org { width: 100%; border-collapse: collapse; margin-top: 6px; table-layout: fixed; }
    .lbox ul.plain { list-style: none; padding-left: 4px; }
    table.org th, table.org td { border: 1.5px solid #555; padding: 6px; vertical-align: top; font-size: 13px; }
    table.org th { background: #eef5f4; }
    table.org td { height: 0.75in; }
    .stu-h { break-after: avoid;  font-size: 14px; font-weight: 800; margin: 14px 0 8px; padding-bottom: 3px; border-bottom: 1.5px solid #888; }
    .ticket { border: 2px solid #333; border-radius: 10px; padding: 10px 16px 4px; break-inside: avoid; }
    .ticket + .ticket { margin-top: 0.4in; position: relative; }
    .ticket + .ticket::before { content: "\2702  cut here"; position: absolute; left: 0; right: 0; top: -0.25in; border-top: 1.5px dashed #888; font-size: 10px; color: #666; padding-top: 2px; text-align: center; }
    .ticket.alone { break-before: page; margin-top: 0; }
    .ticket.alone::before { display: none; }
    .x-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; border-bottom: 3px solid var(--teal-700); padding-bottom: 6px; margin-bottom: 10px; }
    .x-title { font-size: 18px; font-weight: 800; margin: 0; }
    .x-std { font-size: 11px; color: #333; margin: 2px 0 0; }
    .x-name { flex: 0 0 2.4in; display: flex; gap: 6px; font-size: 14px; }
    .x-name span { flex: 1; border-bottom: 1px solid #000; }
    .x-note { font-size: 13px; font-style: italic; margin: 0 0 10px; }
    .ticket { font-size: 13.5px; line-height: 1.35; }
    .ticket .q { margin-bottom: 10px; }
    .ticket .q-stem { margin-bottom: 4px; }
    .ticket .opts { gap: 2px; }
    .ticket .bubble { width: 18px; height: 18px; font-size: 10px; }
    .ticket .wr-head { margin: 2px 0 6px; }
    .ticket .wlines { gap: 18px; margin-top: 10px; }
    .ticket .lookfor { margin-top: 4px; }
    table.grid { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    table.grid th, table.grid td { border: 1px solid #888; padding: 5px 8px; text-align: left; }
    table.grid th { background: var(--teal-50); }
    .end-block { margin-top: 26px; break-inside: avoid; }
    .end-block h3 { font-size: 15px; margin: 0; }
    .empty { text-align: center; color: var(--muted); padding: 48px 0; }

    @media print {
        @page { size: letter portrait; margin: .45in; }
        body { background: #fff; }
        #builder { display: none !important; }
        #sheet { box-shadow: none; padding: 0; margin: 0; max-width: none; }
        * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
</style>
</head>
<body>

<div id="builder">
    <div class="band">
        <div class="brand">
            <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#14676a"/><path d="M20 5l3.6 10.2L34 16.4l-8.2 6.6L28.6 34 20 27.8 11.4 34l2.8-11L6 16.4l10.4-1.2z" fill="#e2a52c"/></svg>
            <div><h1>4th Grade ELA Assessment Builder</h1><small>4th grade reading standards, 4.RC.1 to 4.RC.13</small></div>
        </div>
        <div class="modes" role="group" aria-label="Assessment type">
            <button type="button" data-mode="cfa" aria-pressed="true">Quick CFA</button>
            <button type="button" data-mode="eou" aria-pressed="false">End of Unit</button>
            <button type="button" data-mode="exit" aria-pressed="false">Exit Ticket</button>
            <button type="button" data-mode="morning" aria-pressed="false">Morning Work</button>
            <button type="button" data-mode="lesson" aria-pressed="false">Lesson</button>
        </div>
    </div>

    <div class="panel">
        <div class="col">
            <h2>Standards</h2>
            <p class="hint" id="std-hint"></p>
            <div class="std-list" id="std-list"></div>
            <div class="list-tools">
                <span id="totals"></span>
                <button type="button" class="linkish" id="clear-all">Clear all</button>
            </div>
        </div>
        <div class="col">
            <h2>Settings</h2>
            <p class="hint">Changes rebuild the same version. Use New version for different questions.</p>
            <div class="field">
                <label for="f-title">Title</label>
                <input type="text" id="f-title">
            </div>
            <div class="field">
                <label for="f-sub">Unit or subtitle (optional)</label>
                <input type="text" id="f-sub" placeholder="Example: Unit 3, Text Structure">
            </div>
            <div class="field">
                <label for="f-genre">Passage type</label>
                <select id="f-genre">
                    <option value="auto">Auto (whatever fits each standard)</option>
                    <option value="fiction">Fiction / literary</option>
                    <option value="nonfiction">Nonfiction / informational</option>
                </select>
            </div>
            <div class="field morning-only">
                <label for="f-days">Days</label>
                <select id="f-days">
                    <option value="1">1 day</option><option value="2">2 days</option><option value="3">3 days</option><option value="4">4 days</option><option value="5">5 days (a week)</option>
                </select>
            </div>
            <div class="field morning-only">
                <label for="f-perday">Questions per day</label>
                <select id="f-perday">
                    <option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option>
                </select>
            </div>
            <div class="checks morning-only">
                <label><input type="checkbox" id="f-written"> Add one short written response each day</label>
            </div>
            <div class="field lesson-only">
                <label for="f-block">Reading block length</label>
                <select id="f-block">
                    <option value="60">60 minutes</option><option value="75">75 minutes</option><option value="90">90 minutes</option><option value="100">100 minutes</option>
                    <option value="105">105 minutes</option><option value="110">110 minutes</option><option value="120">120 minutes</option><option value="135">135 minutes</option><option value="150">150 minutes</option>
                </select>
                <p class="hint">Times for each part scale to the block. Tier 2 small groups are about a quarter of the block.</p>
            </div>
            <div class="field exit-only">
                <label for="f-copies">Copies per page</label>
                <select id="f-copies">
                    <option value="1">1 (full page)</option>
                    <option value="2">2 (half sheets to cut apart)</option>
                </select>
            </div>
            <div class="checks exit-only">
                <label><input type="checkbox" id="f-passage"> Print the passage on the ticket (leave off if students already have it from the lesson)</label>
            </div>
            <div class="checks test-only">
                <label><input type="checkbox" id="f-newpage"> Start each standard on a new page</label>
                <label><input type="checkbox" id="f-score"> Add a score-by-standard table at the end</label>
            </div>
        </div>
    </div>

    <div class="actions">
        <button type="button" class="btn primary" id="btn-new">New version</button>
        <button type="button" class="btn key" id="btn-key" aria-pressed="false">Teacher key</button>
        <button type="button" class="btn" id="btn-print">Print</button>
        <button type="button" class="btn lesson-only" id="btn-print-ws">Print worksheet only</button>
        <button type="button" class="btn lesson-only" id="btn-print-ww">Print word work only</button>
        <div class="version">
            <label for="f-code">Version code</label>
            <input type="text" id="f-code" maxlength="60" spellcheck="false" aria-label="Version code">
            <button type="button" class="btn" id="btn-load">Load</button>
        </div>
    </div>
    <div id="notices" aria-live="polite"></div>
</div>

<div id="sheet"></div>

<script>
const STANDARDS = [
            { id: '4.RC.1', label: '4.RC.1: Explicit Details & Inferences', desc: 'Refer to details and examples in a text when explaining what a text says explicitly and when drawing inferences.' },
            { id: '4.RC.2', label: '4.RC.2: Summarize & Theme in Fiction', desc: 'Paraphrase or summarize main events in a story/myth/legend; identify theme and provide evidence.' },
            { id: '4.RC.3', label: '4.RC.3: Character, Setting & Plot Impact', desc: 'Describe a character, setting, or event in a story or play using details and explain impact on plot.' },
            { id: '4.RC.4', label: '4.RC.4: Compare Point of View', desc: 'Compare and contrast the point of view from which different stories are narrated (1st vs 3rd person).' },
            { id: '4.RC.5', label: '4.RC.5: Main Idea & Summarize Nonfiction', desc: 'Determine the main idea of a text and explain how it is supported by key details; summarize.' },
            { id: '4.RC.6', label: '4.RC.6: Text Features', desc: 'Apply knowledge of text features to locate information and gain meaning (charts, tables, headings, fonts).' },
            { id: '4.RC.7', label: '4.RC.7: Text Structure', desc: 'Describe organizational structure (chronological, problem-solution, cause/effect, compare/contrast, etc.).' },
            { id: '4.RC.8', label: '4.RC.8: Fact/Opinion & Author Claims', desc: 'Distinguish between fact and opinion; explain how an author uses reasons/evidence to support a claim.' },
            { id: '4.RC.9', label: '4.RC.9: Integrating Information Across Texts', desc: 'Combine information from two texts on the same topic to demonstrate knowledge.' },
            { id: '4.RC.10', label: '4.RC.10: Context Clues for Word Meaning', desc: 'Apply context clues to determine the meanings of unknown words. No passage of its own: uses words from the other passages on the test.' },
            { id: '4.RC.11', label: '4.RC.11: Word Relationships & Multiple Meanings', desc: 'Identify relationships among words, including homographs, homonyms, synonyms, antonyms, multiple meanings.' },
            { id: '4.RC.12', label: '4.RC.12: Word Structure & Affixes/Roots', desc: 'Apply knowledge of prefixes, suffixes, Greek/Latin roots, and word patterns to determine meaning.' },
            { id: '4.RC.13', label: '4.RC.13: Figurative Language & Meaning', desc: 'Determine how words provide meaning in literature, including figurative language (similes, metaphors, hyperbole).' }
        ];

        // Passages. Each standard has a list of passages; paragraphs that start with "+" print only on
        // End of Unit tests, and the rest make up the shorter CFA version.
        const PASSAGES = {
            '4.RC.1': [
                { id: 'midnight-rescue', genre: 'fiction', title: "Story: The Midnight Rescue", text: [
                    "Maya peered out her bedroom window into the storm. Heavy rain pelted the glass, and the old oak tree in the front yard swayed wildly in the wind. Thunder rumbled so loudly that the picture frames on her dresser rattled.",
                    "Suddenly, a bright flash of lightning illuminated the lawn, and Maya gasped. A small puppy was shivering inside an overturned cardboard box near the sidewalk. Its ears were pressed flat against its head, and it whimpered each time the thunder boomed.",
                    "Maya grabbed her raincoat and flashlight from the closet without hesitation. Water was already rushing along the curb and creeping toward the box. She knew she had to act quickly before the rising rainwater flooded the box.",
                    "+She tiptoed down the stairs, careful to skip the squeaky third step. At the back door, she pulled on her rubber boots and zipped her raincoat all the way up to her chin. Then she took a deep breath and stepped out into the storm.",
                    "When she reached the sidewalk, the puppy backed into the corner of the box. \"It's okay,\" Maya said softly, kneeling down. \"I won't hurt you.\" She held out her hand and waited. After a long moment, the puppy crept forward and licked her fingers.",
                    "+Maya tucked the puppy inside her raincoat, where it was warm and dry. She could feel its tiny heart beating fast against her. As she turned toward the house, she noticed that water had already filled the spot where the box had been sitting.",
                    "Back inside, Maya wrapped the puppy in a fluffy towel and rubbed its fur until it stopped shaking. The noise woke her mom, who came into the kitchen rubbing her eyes. When she saw the soggy puppy curled up on Maya's lap, her sleepy frown turned into a smile.",
                    "+\"Where did this little one come from?\" Mom asked. Maya explained everything, from the flash of lightning to the overflowing curb. Mom shook her head and said, \"Next time, wake me up first. But I'm proud of you for helping.\"",
                    "+The next morning, the storm had passed, and the sky was a clear, bright blue. Maya and her mom made posters with a photo of the puppy and hung them around the neighborhood. By lunchtime, a man named Mr. Alvarez called to say the puppy belonged to his family.",
                    "The puppy's owner came to pick him up the next day. The puppy wagged his whole body and jumped into his owner's arms. \"Biscuit must have slipped out of the fence when the gate blew open,\" the man said. \"Thank you for keeping him safe.\" Maya smiled as she waved goodbye, already missing her soggy midnight friend."
                ] },
                { id: 'deep-sea', genre: 'nonfiction', title: "Informational Text: Deep Sea Explorers", text: [
                    "Deep on the ocean floor, sunlight cannot penetrate the pitch-black water. Below about 3,000 feet, the ocean is completely dark, freezing cold, and under enormous pressure. Oceanographers use specialized submarines called submersibles to explore these extreme depth environments.",
                    "+A submersible is small, usually carrying only one to three people. Its walls are made of thick metal that can withstand pressure hundreds of times stronger than the air pressure we feel on land. Bright lights on the outside let scientists see the dark water around them.",
                    "In 1977, researchers discovered hydrothermal vents spewing superheated water full of minerals. Surprising scientists everywhere, whole ecosystems of tube worms and blind white crabs were thriving in total darkness without sunlight energy.",
                    "+The vents were found near the Galapagos Islands, along a crack in the ocean floor where two pieces of Earth's crust slowly pull apart. Seawater seeps down into the crack, gets heated by hot rock below, and then shoots back up. Some vent water is hotter than 600 degrees Fahrenheit, but the crushing pressure keeps it from boiling.",
                    "Life near the vents works differently from life almost anywhere else on Earth. Instead of using sunlight, tiny bacteria use the chemicals in the vent water to make food. This process is called chemosynthesis. Larger animals then eat the bacteria or live alongside them.",
                    "+Giant tube worms are some of the strangest vent creatures. They can grow taller than a grown-up person, and they have no mouth and no stomach. Instead, bacteria living inside their bodies make food for them. The worms have bright red plumes that take in chemicals from the water.",
                    "Blind white crabs scurry across the rocks near the vents. Because there is no light, they have no need for bright colors or sharp eyesight. Scientists have also found pale shrimp, snails, and fish living in these communities.",
                    "Exploring the deep sea is difficult and expensive, so scientists have seen only a tiny part of it. Most of the deep ocean floor has never been seen by human eyes. Every dive gives researchers a chance to discover something new.",
                    "+The discoveries at hydrothermal vents changed how scientists think about life. If living things can survive in dark, scalding, chemical-filled water on Earth, some scientists wonder whether life might exist in similar places on other worlds, such as the icy moons of Jupiter and Saturn.",
                    "The deep ocean is still one of the least explored places on our planet. With every new dive, oceanographers uncover more secrets hidden in the darkness. Who knows what amazing creatures are still waiting to be found?"
                ] },
                { id: 'garden-mystery', genre: 'fiction', title: "Story: The Garden Mystery", text: [
                    "Every summer, Sofia stayed with her grandpa, who grew the biggest vegetable garden on Maple Street. This year, he had promised her the very first carrot of the season.",
                    "One morning, Sofia ran outside to check on the carrots and stopped short. Three carrot tops lay wilted on the dirt, and the orange roots beneath them had been nibbled down to stubs. Small, round droppings dotted the path between the rows.",
                    "+Grandpa scratched his chin when he saw the damage. \"Could be the neighbor's dog,\" he said. \"Or maybe a raccoon.\" Sofia was not so sure. Raccoons, she knew, usually knocked over trash cans and left big messes behind.",
                    "Sofia decided to investigate like a real detective. She found a shallow hole dug under the wooden fence, just wide enough for a small animal to squeeze through. Near the hole, tiny tufts of soft brown fur were caught on a splinter.",
                    "+That afternoon, she borrowed Grandpa's old trail camera, the one he used to photograph deer in the woods. She strapped it to a post facing the carrot rows and pressed the button until the little red light blinked on.",
                    "The next morning, Sofia and Grandpa looked at the camera's pictures together. In the gray light of dawn, a mother rabbit and three fluffy babies hopped through the hole and nibbled happily on the carrot tops. Grandpa laughed. \"Well, detective, you solved the case.\"",
                    "+Sofia felt proud, but she also felt worried. \"We can't let them eat everything,\" she said. \"But I don't want to hurt them either.\" Grandpa nodded slowly. He had been gardening for forty years, and he had an idea.",
                    "Together, they filled the hole with rocks and stretched wire mesh along the bottom of the fence. Then Grandpa handed Sofia a packet of lettuce seeds. \"Let's plant a row on the other side of the fence,\" he said. \"Everybody deserves a snack.\"",
                    "+Sofia raked the soil, pressed the seeds into neat lines, and watered them every evening. In two weeks, tiny green leaves poked up through the dirt. One morning, she spotted the rabbit family munching on the new row, right where they belonged.",
                    "At the end of the summer, Grandpa pulled up the first big carrot and handed it to Sofia. It was crunchy and sweet. \"The best carrots in town,\" Grandpa said, \"thanks to the best detective in town.\""
                ] },
                { id: 'coffin-house', genre: 'nonfiction', title: "Informational Text: A Safe House in Indiana", text: [
                    "Before the Civil War, millions of African Americans were enslaved in the southern United States. Some escaped and traveled north toward freedom. Along the way, they were helped by a secret network of people and hiding places called the Underground Railroad.",
                    "+The Underground Railroad was not a real railroad, and it was not underground. People used railroad words as a code. Guides were called conductors, hiding places were called stations, and the people escaping were sometimes called passengers.",
                    "One of the busiest stations was in Newport, Indiana, a small town that is now called Fountain City. There, a Quaker couple named Levi and Catharine Coffin opened their home to freedom seekers. Quakers believed that slavery was wrong.",
                    "+The Coffins' brick house was built in 1839. From the outside, it looked like an ordinary home. Inside, a small door in an upstairs bedroom led to a narrow space where people could hide. A bed could be pushed in front of the door to keep it secret.",
                    "Helping freedom seekers was against the law, and the Coffins could have been fined or jailed. Still, they never turned anyone away. Catharine cooked meals, sewed clothes, and cared for people who were sick or tired.",
                    "+Freedom seekers often arrived late at night, after walking for hours through woods and fields. The Coffins kept a team of horses and a wagon ready so they could carry people to the next station.",
                    "Over about twenty years, the Coffins helped more than one thousand people on their journey to freedom. Many of them continued north to Canada, where slavery was against the law.",
                    "+Levi Coffin was sometimes called the \"President of the Underground Railroad.\" He later moved to Cincinnati, Ohio, where he kept helping freedom seekers and ran a store that sold goods made without enslaved labor.",
                    "Today, the Levi and Catharine Coffin House is a museum. Visitors can climb the stairs and see the hidden space where people once waited, hoping to stay safe for one more night.",
                    "The story of the Coffin House shows that ordinary people can make brave choices. By opening their door, Levi and Catharine Coffin helped change many lives."
                ] },
            ],
            '4.RC.2': [
                { id: 'great-oak', genre: 'fiction', title: "Story: The Great Oak Tree", text: [
                    "Leo loved playing near the old oak tree at the edge of the schoolyard. Its thick branches stretched over the grass like a giant umbrella, and its trunk was so wide that three students holding hands could barely reach around it.",
                    "+Every recess, Leo and his friends met under the oak. They traded cards in its shade, played tag around its roots, and collected acorns in the fall. Some of the oldest teachers said the tree had been standing there long before the school was built.",
                    "One night in April, a heavy thunderstorm swept through town. The next morning, Leo saw several broken branches lying across the playground. At an assembly that afternoon, the principal announced that the tree might need to be removed for safety reasons.",
                    "Leo refused to give up on the oak. That evening, he asked his mom how grown-ups solve problems like this. She explained that a tree expert called an arborist can sometimes trim damaged branches so that a tree is safe again. Leo had an idea.",
                    "The next day, Leo organized a group of classmates to write letters explaining how much the tree meant to the school. Some students wrote about reading in its shade. Others drew pictures of the tree in every season. In all, they delivered forty-two letters to the principal's office.",
                    "+The principal read every letter. She told the students that she loved the tree too, but trimming it would cost money that the school did not have. Leo's heart sank, but only for a moment. \"Then we'll raise the money ourselves,\" he said.",
                    "The class decided to raise money to hire an arborist to trim the damaged branches safely. They held a bake sale, washed cars in the school parking lot, and set up a lemonade stand at the spring soccer games.",
                    "+Raising money was hard work. On the first day of the bake sale, it rained, and they sold only six cookies. Some students wanted to quit, but Leo reminded them of all the afternoons they had spent under the oak. Little by little, the jar filled with coins and dollar bills.",
                    "After weeks of hard work, the tree was saved. The arborist said the oak was healthy and strong once the broken limbs were removed. The principal changed her plan and announced that the tree would stay. The whole school cheered, and Leo grinned so wide that his cheeks hurt.",
                    "That summer, a new plaque appeared at the base of the oak. It read, \"Saved by the students of Room 14.\" Leo learned that even a young person can make a big difference when they stand up for what they care about."
                ] },
                { id: 'squirrel', genre: 'fiction', title: "Fable: The Squirrel Who Kept Everything", text: [
                    "Long ago, in a forest of tall oaks, there lived a squirrel named Pip. Pip was the fastest acorn gatherer in the whole forest, and he was very proud of it.",
                    "Every autumn, Pip raced from tree to tree, stuffing his cheeks until they bulged. By the first frost, his hollow log was packed with more acorns than he could eat in two winters.",
                    "+The other animals worked hard too, but an early frost had ruined many of the acorns that year. The chipmunks gathered only half of what they needed, and old Mrs. Rabbit could not find enough clover before the snow began.",
                    "One cold morning, the chipmunks knocked on Pip's log. \"Could you spare a few acorns?\" they asked. \"Our pantry is nearly empty.\" Pip folded his arms. \"I worked hard for these,\" he said. \"Go gather your own.\" And he shut the door.",
                    "+That night, Pip counted his acorns twice by the light of the moon. He felt rich, but he also felt a strange, heavy feeling in his chest. He told himself it was only because he had eaten too much dinner.",
                    "A week later, a terrible ice storm swept through the forest. Branches cracked and crashed to the ground. One huge limb smashed through the top of Pip's hollow log and scattered his acorns into a frozen creek. In a single night, everything was gone.",
                    "+Pip searched the snowy ground for hours, but the acorns had disappeared under the ice. His paws were numb, and his stomach growled. He sat on a stump and wondered what he would do.",
                    "Shivering and hungry, Pip knocked on the chipmunks' door. He expected them to say, \"Go gather your own.\" Instead, the chipmunks pulled him inside, wrapped him in a leaf blanket, and shared what little food they had.",
                    "+All winter, the animals took turns sharing. Mrs. Rabbit brought dried clover, the chipmunks offered seeds, and Pip helped by cracking nuts with his strong teeth. Somehow, there was enough for everyone.",
                    "When autumn came again, Pip gathered acorns as fast as ever. But this time, he filled a second log near the creek and hung a sign above the door. It read, \"Take what you need.\" From that year on, no one in the forest ever went hungry."
                ] },
                { id: 'firefly', genre: 'fiction', title: "Legend: How the Firefly Got Its Light", text: [
                    "Long ago, when the world was new, the nights were so dark that the animals could not see their own paws. The Moon had not yet learned to shine brightly, and the stars were hidden behind thick clouds.",
                    "+In that darkness lived a tiny brown beetle named Flicker. Flicker was so small and plain that the other animals barely noticed her. The owls called her \"Speck,\" and the frogs said she was only good for a snack.",
                    "One night, a young rabbit wandered away from home and became lost in the black forest. His mother called and called, but the darkness swallowed her voice. The bigger animals said, \"It is too dark to search. We will look in the morning.\"",
                    "Flicker could not bear to think of the little rabbit alone and afraid. \"I am small,\" she said, \"but I can still try.\" She flew from tree to tree, calling out, \"Little rabbit, where are you?\"",
                    "+All night she searched. She bumped into branches and tumbled into spiderwebs. Her wings ached, but every time she wanted to rest, she thought of the rabbit's mother crying by the den.",
                    "At last, deep in a tangle of thorns, Flicker heard a tiny sniffle. She found the rabbit shivering and stayed beside him, humming softly so he would not feel alone, until the first gray light of morning appeared.",
                    "+When the sun rose, the animals came running. The rabbit's mother wrapped her son in her paws and wept with joy. \"Who found you?\" she asked. The rabbit pointed to the tiny beetle resting on a leaf.",
                    "The Moon, peeking through a gap in the clouds, had watched everything. \"You are small,\" the Moon told Flicker, \"but your heart is the brightest in the forest. From now on, everyone will see it.\" A soft golden glow began to shine from Flicker's body.",
                    "+That night, Flicker flew over the meadow, and her light danced like a tiny lantern. The owls stopped calling her \"Speck,\" and the frogs no longer laughed. Even the rabbit's mother thanked her every evening.",
                    "And that is why, on warm summer nights, fireflies still glow in the dark. They remind us that even the smallest creature can light the way for others."
                ] },
            ],
            '4.RC.3': [
                { id: 'whispering-woods', genre: 'fiction', title: "Story: The Mystery of Whispering Woods", text: [
                    "Clara and Ethan followed the narrow trail into Whispering Woods as dusk began to fall. They had promised Grandma they would be back from the creek before dark, but they had stayed too long skipping stones.",
                    "+The woods had earned their name. Even on calm days, the tall pines seemed to murmur and sigh above the trail. Kids at school liked to tell stories about the woods, and not all of the stories were friendly.",
                    "Now the sun was slipping behind the hills. Shadows stretched like long fingers across the pine needles, and the air grew cool and damp. Somewhere far away, a dog barked once and then went silent.",
                    "+Ethan walked so close behind his sister that he kept stepping on her heels. \"Do you remember which way the big rock is?\" he asked. Clara pointed ahead with the walking stick she had found by the creek. \"Just past the bend,\" she said, sounding more confident than she felt.",
                    "Suddenly, a strange clicking noise echoed from inside a hollow cedar tree. Click. Click-click. Ethan froze in fear. His heart pounded so hard he was sure Clara could hear it.",
                    "Clara was nervous too, but she noticed that the sound was small and steady, not like a large animal. She stepped forward bravely. \"Whatever it is, it's probably more scared of us than we are of it,\" she said.",
                    "+Clara crept toward the hollow cedar. The opening in the trunk was dark, about the size of a basketball. The clicking stopped, and the woods went completely silent. Ethan held his breath.",
                    "Using her walking stick, Clara gently tapped the trunk. Out swooped a small barn owl, blinking in the twilight. Its pale, heart-shaped face glowed like a tiny moon as it flapped to a nearby branch.",
                    "Ethan released a deep breath and laughed at his mistake. \"I was scared of a bird,\" he said, shaking his head. Clara laughed too. \"A very grumpy bird,\" she said.",
                    "+The two of them hurried down the trail and spotted the big rock just past the bend. By the time they reached Grandma's porch, the first stars were coming out. Ethan couldn't wait to tell everyone at school that the scariest thing in Whispering Woods was an owl."
                ] },
                { id: 'lighthouse', genre: 'fiction', title: "Story: Light in the Storm", text: [
                    "Nora had been on Gull Island for only two days when the storm arrived. Her grandmother lived in the old lighthouse at the edge of the rocky cliffs, and Nora was spending spring break with her.",
                    "+The island was small, with one dirt road, a handful of cottages, and more seagulls than people. Nora liked exploring the tide pools, but she did not like the lighthouse stairs. There were one hundred and twelve of them, twisting up and up into the dark.",
                    "By evening, the wind howled around the tower, and waves crashed against the rocks below, sending spray as high as the windows. Then, with a loud pop, every light went out. Even the great lamp at the top of the lighthouse went dark.",
                    "Grandma grabbed a flashlight and looked out to sea. Far away, a tiny light bobbed up and down on the black water. \"That's the Martin family's fishing boat,\" she said. \"Without the lighthouse, they could crash into the rocks.\"",
                    "+Grandma explained that the lighthouse had an old backup lantern at the top, one that burned oil instead of electricity. But her knee had been hurting for weeks, and climbing all those stairs quickly would be nearly impossible for her.",
                    "Nora's heart pounded. She hated the dark, twisting stairs more than anything on the island. But she thought about the family out on the stormy water. \"I'll carry the lantern oil,\" she said. \"You show me what to do.\"",
                    "Step by step, Nora climbed, with Grandma slowly following behind and the flashlight beam shaking on the walls. At the top, Nora poured oil into the backup lantern while Grandma struck a long match. A warm golden light blazed out across the waves.",
                    "+For a long time, they watched the tiny light on the water. It moved slowly, turning away from the rocks and toward the harbor. Nora gripped the railing so tightly that her fingers ached.",
                    "At last, the Martins' boat glided safely into the harbor. The next morning, Captain Martin knocked on the lighthouse door with a basket of fresh fish. \"That light saved us,\" he said. \"We were heading straight for the cliffs.\"",
                    "+That afternoon, Nora climbed the lighthouse stairs again, all one hundred and twelve of them, just to look at the view. This time, she counted every step out loud, and she was not afraid at all."
                ] },
                { id: 'talent-show', genre: 'fiction', title: "Play: The Talent Show Tangle", text: [
                    "CHARACTERS: Jada, a fourth grader who loves to sing; Marcus, her best friend, who plays the drums; Ms. Lopez, the music teacher. SETTING: Behind the curtain on the school stage, ten minutes before the talent show.",
                    "(Jada paces back and forth, squeezing a sheet of song lyrics in her hands.) JADA: Marcus, my voice is shaking. What if I forget the words in front of the whole school?",
                    "+MARCUS: (twirling his drumsticks) You sang that song perfectly at practice yesterday. You even hit the high note at the end. JADA: Practice was different. The gym was empty then.",
                    "(Ms. Lopez hurries in, holding a clipboard.) MS. LOPEZ: Bad news, you two. The sound system just stopped working. There will be no microphones and no backing music tonight.",
                    "+JADA: (gasping) No music? My song needs the music! Without it, I'll just be standing there all alone. MARCUS: (looking at his drum) Hmm. Maybe not all alone.",
                    "MARCUS: Jada, what if I play the beat on my drum while you sing? We practiced together a hundred times at recess. JADA: (slowly) We did. And you always keep the beat steady, even when I mess up.",
                    "(The curtain opens. The gym is packed. Jada takes a deep breath and nods at Marcus. He starts a slow, steady beat. Jada's first notes are soft, but her voice grows stronger with every line.)",
                    "+(Halfway through the song, Jada glances at the crowd. Her little brother is waving a homemade sign that says GO JADA! She grins and sings even louder.)",
                    "(The song ends. For one second, the gym is silent. Then the audience jumps up, clapping and cheering.) MS. LOPEZ: (from the side of the stage) That was the best act of the night!",
                    "+JADA: (hugging Marcus) I couldn't have done it without you. MARCUS: Sure you could. You just needed to remember that you weren't alone. (They take a bow as the curtain closes.)"
                ] },
            ],
            '4.RC.4': [
                { id: 'science-fair', genre: 'fiction', title: "Story: The Science Fair Swap", text: [
                    "<strong>Narrator A (Julian):</strong> I spent three weeks perfecting my volcanic eruption model. I built the mountain out of papier-mache, painted every rock by hand, and mixed a special batch of baking soda and red food coloring for the lava.",
                    "+On the morning of the science fair, I set everything up on my table in the cafeteria. My poster explained how real volcanoes erupt, and I had practiced my speech in front of the mirror at least twenty times. I was sure I had a chance to win first place.",
                    "When Maya accidentally bumped my table, red lava splattered across my poster. The words I had written so neatly turned into pink, dripping blobs. My volcano tipped over and rolled onto the floor.",
                    "+\"Watch where you're going!\" I said, louder than I meant to. My face felt hot. Three weeks of work, ruined in one second. I didn't even look at Maya. I just grabbed a handful of paper towels and started wiping.",
                    "When the judges arrived, I had to explain my project with a stained, sticky poster. I tried to smile, but I was so frustrated that my voice shook. All I could think about was how unfair it was.",
                    "<strong>Narrator B (Maya):</strong> The cafeteria was crowded and chaotic. Parents were taking pictures, little brothers and sisters were running between tables, and everyone seemed to be talking at once.",
                    "As I turned around with my presentation board, my foot tripped on an electrical cord, sending me tumbling directly into Julian's table. I never even saw the cord. Someone had stretched it across the aisle to plug in a fan.",
                    "+I heard a crash and a splash, and when I looked up, red goo was dripping down Julian's poster. He yelled at me to watch where I was going. I wanted to explain, but the words got stuck in my throat.",
                    "My cheeks burned with embarrassment. Everyone near us had turned to stare. I mumbled \"sorry\" and hurried away, but I felt terrible for the rest of the morning. Julian's volcano had been the coolest project in the whole fair.",
                    "+Later, I found Julian by the trophy table and showed him the cord. \"I tripped,\" I told him. \"I would never wreck your project on purpose.\" He looked at the cord for a long time. Then he said, \"I guess I would have tripped too.\" We decided to ask the teachers to tape down every cord before next year's fair."
                ] },
                { id: 'library-book', genre: 'fiction', title: "Story: The Missing Library Book", text: [
                    "<strong>Part 1, told by Owen:</strong> I was sure my little brother, Max, had taken my library book. It was a book about sharks, and it was due back on Friday. I had left it on the kitchen table on Monday, and by Tuesday it was gone.",
                    "+Max loves sharks almost as much as I do, and he is always borrowing my things without asking. Last month he took my headphones and returned them with jelly on them. So when the shark book disappeared, I knew exactly who to blame.",
                    "I marched into Max's room and demanded that he give it back. He said he had never touched it, but I did not believe him. I told Mom, and Max ended up crying. I felt angry all week.",
                    "+On Friday, I had to tell Ms. Patel, the librarian, that I had lost the book. My stomach twisted into a knot. I was sure I would have to pay for it with my birthday money.",
                    "When I walked into the library, Ms. Patel smiled and held up my shark book. I had no idea how it got there. All I knew was that I owed my brother an apology.",
                    "<strong>Part 2, told by a narrator:</strong> On Monday evening, Owen's mother noticed a library book on the kitchen table. She knew Owen was busy with soccer practice, so she tucked the book into her bag to return it early on her way to work.",
                    "+She meant to tell Owen, but that night the baby woke up three times, and by morning she had completely forgotten. On Tuesday, she dropped the book into the library's return slot without thinking about it again.",
                    "Ms. Patel found the shark book in the return slot on Tuesday morning. She noticed that it had been returned early, and she set it aside so she could thank Owen in person.",
                    "Meanwhile, Owen blamed his little brother. Max had not touched the book at all. He spent the week feeling hurt and confused, wondering why Owen would not believe him.",
                    "+When Owen came home on Friday, he knocked on Max's door. He apologized and offered to read the shark book with him that night. Max grinned and said yes. Their mother, overhearing from the hallway, suddenly remembered returning the book and laughed at herself."
                ] },
                { id: 'snow-day', genre: 'fiction', title: "Story: The Surprise Snow Day", text: [
                    "<strong>Part 1, Ava's journal:</strong> Thursday night. I am writing this by the window because I cannot stop watching the snow. The weather report said three inches, but it already looks like a lot more. I have my snow pants laid out just in case.",
                    "+I really, really hope school is canceled tomorrow. My best friend, Kiara, and I have planned the perfect snow day. First we will build a snow fort, then we will have a snowball battle, and then we will drink hot chocolate with extra marshmallows.",
                    "Friday morning. I woke up at 5:30 and ran to Mom's phone. NO SCHOOL! I screamed so loud that I woke up the dog. I do not know who decided to cancel school, but I want to thank them.",
                    "+Kiara came over at 9:00. The snow came up past our knees. Our fort has two rooms and a tunnel, and Mom says it is the best fort on our street. My cheeks are frozen, but I do not care.",
                    "This is the best day of the whole year. I wish every day could be a snow day.",
                    "<strong>Part 2, told by a narrator:</strong> At 4:00 on Friday morning, Principal Grant was already awake. He stood at his kitchen window, looking at the snow piling up on his driveway, and worried about the roads.",
                    "+He called the head of the bus garage, Mr. Jenkins, who had been driving the bus routes in his truck since 3:00. \"The country roads are covered with ice,\" Mr. Jenkins reported. \"Two of them have drifts as tall as a mailbox.\"",
                    "Principal Grant did not want to cancel school. He knew that some families would have to find childcare, and that the snow day would have to be made up in June. But he also knew that icy roads could be dangerous for the buses.",
                    "At 5:15, he made the decision. He sent a message to every family: School is canceled today because of unsafe roads. Then he sat down with a cup of coffee and let out a long, tired sigh.",
                    "+Later that morning, Principal Grant drove slowly past the neighborhood near the school. He smiled when he saw two girls building a snow fort with a tunnel. At least someone, he thought, was having a good day."
                ] },
            ],
            '4.RC.5': [
                { id: 'monarchs', genre: 'nonfiction', title: "Informational Text: Monarch Butterfly Migration", text: [
                    "Every autumn, millions of monarch butterflies embark on an extraordinary journey across North America. Traveling over 2,000 miles, these delicate insects fly south from Canada and the United States all the way to the warm forests of central Mexico.",
                    "Because most monarchs live only a few weeks, it takes about four generations of butterflies to complete the annual round-trip cycle. Scientists track their flight paths using lightweight tags placed on their wings to better understand how habitat loss impacts their survival.",
                    "+Monarchs are easy to recognize. Their wings are bright orange with black veins and white spots along the edges. This bold coloring is a warning to birds. Monarchs taste bitter and can make predators sick because of what they eat as caterpillars.",
                    "Monarch caterpillars eat only one kind of plant: milkweed. Milkweed grows in fields and along roadsides, and female monarchs lay their eggs only on its leaves. Without milkweed, monarchs cannot survive.",
                    "+The butterflies that make the long flight south are special. Unlike their parents and grandparents, this generation can live for about eight months. They spend the winter clustered together on fir trees high in the mountains of Mexico, where the cool air helps them rest and save energy.",
                    "In spring, the monarchs fly north and lay eggs along the way. Their children continue the trip, and then their grandchildren. By the time monarchs return to Canada, it is the great-grandchildren of the butterflies that left the year before.",
                    "+Scientists still are not sure exactly how monarchs find their way to the same mountain forests every year, even though no single butterfly has ever made the trip before. Many researchers believe monarchs use the position of the sun as a compass.",
                    "Today, monarch populations face serious challenges. Farms, roads, and new buildings have replaced many fields where milkweed once grew. In Mexico, some of the forests where monarchs spend the winter have been cut down.",
                    "+The wing tags help scientists learn which routes the butterflies follow and where they stop to rest. When someone finds a tagged monarch, they can report its tag number online. Each report helps researchers build a map of the migration.",
                    "People can help monarchs, too. Families, schools, and towns are planting milkweed and colorful flowers in gardens. These small patches of habitat give monarchs places to eat, rest, and lay eggs along their long journey."
                ] },
                { id: 'honeybees', genre: 'nonfiction', title: "Informational Text: Honeybees, Small Insects with Big Jobs", text: [
                    "Honeybees are tiny insects, but they do some of the most important work on Earth. As they buzz from flower to flower, they help plants make the fruits, vegetables, and nuts that people and animals need to eat.",
                    "This important job is called pollination. When a bee lands on a flower to drink its sweet nectar, yellow pollen sticks to the tiny hairs on its body. When the bee visits the next flower, some of that pollen rubs off, which helps the plant make seeds and fruit. Scientists say that about one out of every three bites of food we eat depends on pollinators like bees.",
                    "+Honeybees live together in large groups called colonies. In the summer, a single hive can hold 20,000 to 60,000 bees. Each bee has a job, and the colony works together like a busy factory.",
                    "Every colony has one queen. Her main job is to lay eggs, sometimes up to 2,000 in a single day. Most of the other bees are worker bees. They clean the hive, feed the young, guard the entrance, and fly out to collect nectar and pollen. Male bees, called drones, have only one job: to mate with a queen from another colony.",
                    "+Worker bees have a clever way of sharing information. When a worker finds a good patch of flowers, she returns to the hive and performs a special movement called the waggle dance. The direction and length of her dance tell the other bees which way to fly and how far to go.",
                    "+Bees turn nectar into honey, which they store as food for the winter. Making honey takes a lot of work. In her whole life, one worker bee makes only about one twelfth of a teaspoon of honey.",
                    "Sadly, honeybees face many dangers. Farms and cities have replaced many wildflower fields, so bees have fewer places to find food. Some chemicals sprayed on plants to kill pests can also harm bees. Tiny pests called mites can attack hives and make bees sick.",
                    "Because bees are so important, scientists and beekeepers are working hard to protect them. Beekeepers check their hives for mites, and some farmers are using fewer harmful chemicals.",
                    "+Bees may sting, but only when they feel threatened. A honeybee usually dies after it stings, so it does not sting unless it must protect itself or its hive. Staying calm and slowly moving away is the best way to avoid being stung.",
                    "Kids can help, too. Planting flowers such as sunflowers, clover, and lavender gives bees more food. With a little help, these small insects can keep doing their big jobs for many years to come."
                ] },
                { id: 'sleep', genre: 'nonfiction', title: "Informational Text: Why Your Brain Needs Sleep", text: [
                    "Every night, you spend hours with your eyes closed, barely moving. It might seem like nothing is happening, but sleep is one of the busiest times for your brain and body.",
                    "Scientists say that children ages 6 to 12 need 9 to 12 hours of sleep each night. During that time, the brain sorts through everything you learned during the day and stores the most important information. That is why a good night's sleep can help you remember your spelling words or math facts.",
                    "+Sleep happens in cycles. Each cycle lasts about an hour and a half. In some parts of the cycle, your body is in deep sleep and very still. In another part, called REM sleep, your eyes dart back and forth under your eyelids, and this is when most dreams happen.",
                    "Sleep helps your body, too. While you sleep, your body releases a hormone that helps you grow. Your muscles repair themselves after a busy day, and your body fights off germs that could make you sick.",
                    "+Without enough sleep, people can feel cranky and have trouble paying attention. They may make more mistakes and feel hungrier than usual.",
                    "Many things can make it hard to get enough sleep. Bright screens from phones, tablets, and TVs can trick the brain into thinking it is still daytime. Caffeine in some sodas can keep the body awake for hours.",
                    "+Noise and light in a bedroom can also wake people up during the night. Even a small glowing light can make it harder to stay asleep.",
                    "Doctors suggest a few simple habits. Go to bed at the same time each night. Turn off screens at least an hour before bedtime. Keep your bedroom cool, dark, and quiet.",
                    "+A calm bedtime routine can help, too. Reading a book, taking a warm bath, or listening to soft music tells your body that it is almost time to sleep.",
                    "Sleep is not wasted time. It is when your brain and body get ready for tomorrow. So tonight, when someone says it is time for bed, remember that you are giving your brain the rest it needs to learn and grow."
                ] },
            ],
            '4.RC.6': [
                { id: 'maps', genre: 'nonfiction', title: "Informational Text: Navigating Maps & Diagrams", text: [
                    "Maps contain several key features that help travelers locate destinations. Learning to read these features is like learning a new language. Once you know them, a map can tell you where you are, where you are going, and what you will see along the way.",
                    "The compass rose shows cardinal directions (North, South, East, West). It is usually drawn in a corner of the map. Many compass roses also show in-between directions, such as northeast and southwest.",
                    "The map key explains symbols. A key is sometimes called a legend. A tiny tent might stand for a campground, a blue line might be a river, and a star often marks a capital city.",
                    "+A scale bar tells you how distance on the map compares to distance in real life. For example, one inch on a map might equal ten miles. By measuring with a ruler, you can figure out how far apart two places really are.",
                    "+Many maps also have a grid of lines with letters along one side and numbers along the other. To find a place, you look it up in the map's index, which might say \"C4.\" Then you slide one finger to column C and another to row 4 until they meet.",
                    "Elevation charts use shaded colors to represent land height above sea level. Low land near the ocean might be dark green, while tall mountains might be brown or white. These colors help hikers see where the land rises steeply.",
                    "Reading cross-section diagrams allows geologists to examine layers of rock hidden beneath Earth's surface. A cross-section shows what you would see if you could slice through the ground like a layer cake and look at the side.",
                    "+Informational books about maps use text features too. Bold subheadings tell readers what each section is about, so they can skip to the part they need. Captions explain what a photograph or diagram shows.",
                    "+At the back of many nonfiction books, readers can find a glossary and an index. The glossary gives the meanings of important words. The index lists topics in alphabetical order with the page numbers where they appear.",
                    "Whether you are planning a road trip, hiking a mountain trail, or studying rocks, these features turn a confusing page into useful information. The next time you open a map, take a moment to read the compass rose, the key, and the charts before you begin."
                ] },
                { id: 'volcanoes', genre: 'nonfiction', title: "Informational Text: All About Volcanoes", text: [
                    "<strong>What Is a Volcano?</strong> A volcano is an opening in Earth's surface where melted rock, gases, and ash escape from deep underground. Melted rock under the ground is called <b>magma</b>. When it flows out onto the surface, it is called <b>lava</b>.",
                    "<strong>Parts of a Volcano</strong> Deep below a volcano is the <b>magma chamber</b>, a large pool of melted rock. Magma rises through a tube called the <b>vent</b> and bursts out of the opening at the top, which is called the <b>crater</b>. A diagram of a volcano usually labels each of these parts.",
                    "+<em>Caption: In a volcano diagram, arrows show magma rising from the magma chamber, up through the vent, and out of the crater.</em>",
                    "<strong>Why Do Volcanoes Erupt?</strong> Pressure builds up as gases and magma push upward. When the pressure becomes too strong, the volcano erupts. Some eruptions are gentle, with lava oozing slowly down the sides. Others are explosive, blasting ash high into the sky.",
                    "+<strong>Types of Volcanoes</strong> Shield volcanoes are wide with gentle slopes, like a warrior's shield lying on the ground. Cinder cone volcanoes are small and steep. Composite volcanoes are tall, cone-shaped mountains built from many layers of lava and ash.",
                    "<strong>Famous Eruptions</strong> In 1980, Mount St. Helens in Washington State erupted, blowing away the top of the mountain. In Hawaii, Kilauea has erupted many times, sending rivers of lava toward the ocean.",
                    "+<strong>Did You Know?</strong> There are about 1,350 volcanoes on land around the world that could erupt. Many of them are found along the edges of the Pacific Ocean in an area nicknamed the Ring of Fire.",
                    "<strong>Staying Safe</strong> Scientists called <b>volcanologists</b> study volcanoes to predict eruptions. They measure earthquakes, ground swelling, and gases. When danger is near, they warn people living nearby so they can leave in time.",
                    "+<strong>Volcanoes Can Help, Too</strong> Over time, volcanic ash breaks down into rich soil that is excellent for growing crops. Some countries even use the heat from underground magma to make electricity.",
                    "<strong>Glossary</strong> <b>crater:</b> the bowl-shaped opening at the top of a volcano. <b>lava:</b> melted rock that has reached Earth's surface. <b>magma:</b> melted rock beneath Earth's surface. <b>vent:</b> the tube that magma travels through. <b>volcanologist:</b> a scientist who studies volcanoes."
                ] },
                { id: 'dunes', genre: 'nonfiction', title: "Informational Text: Exploring Indiana Dunes National Park", text: [
                    "<strong>A Park on the Lake</strong> Along the southern shore of Lake Michigan, mountains of sand rise above the water. This is Indiana Dunes National Park, one of the most surprising places in the Hoosier State.",
                    "<strong>How the Dunes Formed</strong> Thousands of years ago, huge sheets of ice called <b>glaciers</b> covered this area. When the glaciers melted, they left behind sand and water. Over time, strong winds blowing off the lake piled the sand into hills called <b>dunes</b>.",
                    "+<em>Caption: In a photo of the park, a steep dune covered in grass and trees rises behind a sandy beach on Lake Michigan.</em>",
                    "<strong>A Dune That Moves</strong> Some dunes are held in place by plant roots. Others are always shifting. Mount Baldy, one of the park's tallest dunes, is a <b>moving dune</b>. Wind pushes its sand a few feet farther from the lake every year.",
                    "+<strong>Did You Know?</strong> Indiana Dunes became a national park in 2019. It was the 61st national park in the United States.",
                    "<strong>Plants and Animals</strong> The park is home to more than 1,000 kinds of plants, from prickly pear cactus to tall pine trees. Visitors may spot deer, foxes, turtles, and hundreds of kinds of birds.",
                    "+<strong>Timeline</strong> 1916: Leaders hold meetings about protecting the dunes. 1966: Congress creates Indiana Dunes National Lakeshore. 2019: The lakeshore becomes Indiana Dunes National Park.",
                    "<strong>Visiting the Park</strong> Visitors can swim at the beaches, hike about 50 miles of trails, and climb steep dunes. Rangers ask hikers to stay on marked trails so that plant roots can keep the dunes from blowing away.",
                    "+<strong>Protecting the Dunes</strong> Scientists study how the dunes change from year to year. Volunteers help by pulling out plants that do not belong there and crowd out the <b>native</b> ones.",
                    "<strong>Glossary</strong> <b>dune:</b> a hill of sand piled up by the wind. <b>glacier:</b> a huge, slow-moving sheet of ice. <b>moving dune:</b> a dune that shifts because plants do not hold its sand in place. <b>native:</b> belonging naturally to a place."
                ] },
            ],
            '4.RC.7': [
                { id: 'storms', genre: 'nonfiction', title: "Informational Text: Tornadoes and Hurricanes", text: [
                    "Tornadoes and hurricanes are both powerful storm systems with rotating winds, but they differ significantly in scale. Both can damage homes, knock down trees, and cause power outages. However, the way they form and the way people prepare for them are very different.",
                    "Tornadoes form quickly over land during severe thunderstorms and last a short time. Most tornadoes last less than ten minutes, though a few have lasted more than an hour.",
                    "+A tornado begins when warm, moist air near the ground meets cooler, drier air above it. The winds blow at different speeds and in different directions, which can make the air start to spin. If a strong updraft tips the spinning air upward, a funnel cloud can form and reach down toward the ground.",
                    "+Tornadoes are usually narrow. Many are only a few hundred feet wide, about the length of a football field. However, the winds inside the strongest tornadoes can spin faster than 200 miles per hour, fast enough to lift cars and tear roofs from houses.",
                    "In contrast, hurricanes form over warm ocean waters, stretch hundreds of miles wide, and can last for days. As warm water evaporates, it rises and forms towering clouds. The storm grows stronger as long as it stays over warm water.",
                    "+Hurricanes cause damage in several ways. Their winds can reach more than 150 miles per hour. Heavy rain causes flooding, and a rise of seawater called a storm surge can push ocean water far inland.",
                    "Consequently, coastal communities receive early evacuation warnings, whereas tornado alerts give residents only minutes to seek shelter. Meteorologists can watch a hurricane on satellite images for days as it moves across the ocean, which gives families time to pack and leave.",
                    "+Because tornadoes form so quickly, scientists use special radar to look for spinning winds inside thunderstorms. When they spot danger, they send out a tornado warning. Many towns sound outdoor sirens, and phones buzz with emergency alerts.",
                    "Because the two storms are different, the safety plans are different too. During a tornado warning, people should go to a basement or a small room in the middle of the lowest floor, away from windows. During a hurricane, people in the storm's path are often told to leave the coast and travel inland.",
                    "Tornadoes and hurricanes are both dangerous, but knowing how they work can keep people safe. By understanding the differences between these storms, families can make the right plan before severe weather arrives."
                ] },
                { id: 'lunchroom', genre: 'nonfiction', title: "Informational Text: The Lunchroom Trash Problem", text: [
                    "At Lincoln Elementary, the lunchroom had a big problem. Every day, students threw away more than ten bags of trash. Half-eaten apples, milk cartons, plastic forks, and paper trays filled the bins until they overflowed.",
                    "+The custodian, Mr. Diaz, spent nearly an hour after every lunch hauling heavy bags to the dumpster. On windy days, loose wrappers blew across the playground and got stuck in the fence.",
                    "The fourth graders decided to study the problem. For one week, they sorted the lunchroom trash into piles. They discovered that most of it was not really trash at all. Food scraps could be composted, cartons and bottles could be recycled, and plastic forks could be replaced.",
                    "The students proposed three solutions. First, the school would set up separate bins for compost, recycling, and trash. Second, students would use metal forks and washable trays instead of plastic and paper. Third, a student \"Green Team\" would stand by the bins each day to help everyone sort correctly.",
                    "+At first, some students were confused about which bin to use. The Green Team made colorful signs with pictures of each item. Before long, even the kindergartners knew that banana peels went in the green compost bin.",
                    "As a result of these changes, the amount of trash dropped from ten bags a day to just two. The food scraps were turned into compost, which the school used to feed its vegetable garden.",
                    "+The new system also saved money. The school no longer needed to buy thousands of plastic forks and paper trays each year, and it paid less for trash pickup.",
                    "However, one problem remained. Many students still threw away whole sandwiches and unopened snacks. To solve this, the Green Team set up a \"share table\" where students could leave food they did not want, so that others could take it.",
                    "+News of the project spread quickly. A local newspaper wrote an article about the Green Team, and two other schools in the district asked for help starting programs of their own.",
                    "The lunchroom project shows that when people work together, even a big problem can be solved. What started as a pile of garbage became a lesson in teamwork, science, and caring for the planet."
                ] },
                { id: 'maple-syrup', genre: 'nonfiction', title: "Informational Text: From Tree to Table", text: [
                    "Pancakes and waffles taste even better with maple syrup. But did you know that this sweet syrup begins as a watery liquid inside a tree? Making maple syrup takes several careful steps.",
                    "First, syrup makers wait for the right weather. In late winter and early spring, when nights are below freezing and days are above freezing, sap begins to flow inside sugar maple trees.",
                    "+Sap is a clear liquid that carries water and sugar through a tree. The change from freezing nights to warm days creates pressure inside the tree, which pushes the sap out of any opening.",
                    "Next, workers tap the trees. They drill a small hole about two inches deep into the trunk and gently tap in a spout. Sap drips out of the spout into a bucket or flows through plastic tubes to a collecting tank.",
                    "+A healthy tree can be tapped for many years. The small hole heals over by the next season, and the tree keeps growing. Most trees are not tapped until they are about 40 years old.",
                    "Then, the sap is boiled in a wide pan called an evaporator, where a fire heats it for hours. As the water boils away as steam, the sap slowly turns thick, golden, and sweet. It takes about 40 gallons of sap to make just 1 gallon of syrup.",
                    "+The sugarhouse fills with sweet-smelling steam all day long. Syrup makers stir and watch the pan carefully so that the syrup does not burn.",
                    "After that, the hot syrup is filtered to remove any bits of sand or sugar crystals. Workers check it with a special tool to make sure it is thick enough.",
                    "+Syrup comes in different grades. Syrup made early in the season is usually lighter in color with a mild taste. Syrup made later is darker, with a stronger flavor.",
                    "Finally, the syrup is poured into bottles and jars while it is still hot. From a cold night in the forest to your breakfast table, every drop of maple syrup is the result of a long, careful process."
                ] },
            ],
            '4.RC.8': [
                { id: 'recess', genre: 'nonfiction', title: "Persuasive Article: Why Recess Matters", text: [
                    "Daily physical exercise is essential for growing children. Running, jumping, and climbing build strong muscles and bones. But exercise does more than keep bodies healthy. It also helps young minds learn.",
                    "Research proves that 30 minutes of unstructured outdoor play improves classroom focus and reduces student stress. Unstructured play means that children choose their own games instead of following directions from an adult.",
                    "+Think about how you feel after sitting at a desk all morning. Your legs get restless, and it becomes harder to pay attention. A break outside gives the brain a chance to rest and recharge, just like a phone needs time on its charger.",
