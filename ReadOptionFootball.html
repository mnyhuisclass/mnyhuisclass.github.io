<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Read Option Football</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen pixel field on a canvas, HTML "scoreboard" panels float over it. Single dark arcade look by design. */
:root{
  --bg:#0a0e18; --panel:#121a2c; --panel2:#1b2640; --ink:#f6f1e3; --muted:#9fa9c4;
  --gold:#ffcc1a; --good:#3ddc6e; --bad:#ff5050; --sky:#3cbcfc; --shadow:#000;
  --c1:#e03c28; --c2:#f8f8f8; --k1:#3cbcfc; --k2:#202020;
  --px:"Press Start 2P", ui-monospace, "Courier New", monospace;
  --read:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--read);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
input{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit}
.px{font-family:var(--px);letter-spacing:.02em;line-height:1.5}
.dim{opacity:.3}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}

/* ---------- HUD scoreboard ---------- */
#hud{position:fixed;top:0;left:0;right:0;z-index:9;display:grid;grid-template-columns:1fr auto 1fr auto;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 6px) max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));
  background:#05070dee;border-bottom:4px solid #000;box-shadow:0 4px 0 #ffffff14}
.tm{display:flex;align-items:center;gap:8px;min-width:0}
.tm.r{justify-content:flex-end}
.chip{width:20px;height:20px;flex:none;border:3px solid var(--c2);background:var(--c1);box-shadow:0 0 0 2px #000}
.chip.cpu{border-color:var(--k2);background:var(--k1)}
.nm{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.sc{font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums;min-width:2ch;text-align:center}
.mid{text-align:center}
.clk{font-size:14px;color:var(--ink)}
.clk.zero{color:var(--bad);animation:blink 1s steps(2) infinite}
.dd{font-size:9px;color:var(--sky);margin-top:3px}
.hbtns{display:flex;gap:6px}
.hbtns button{width:40px;height:40px;background:var(--panel2);border:3px solid #000;box-shadow:inset -3px -3px 0 #0006,inset 3px 3px 0 #fff2;font-family:var(--px);font-size:11px;cursor:pointer}
@keyframes blink{50%{opacity:.2}}

/* ---------- overlay screens ---------- */
#ui{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 72px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(ellipse at center,#05070d99,#05070dd9)}
#ui.notop{padding-top:calc(env(safe-area-inset-top,0px) + 16px)}
#ui:empty{display:none}
.card{position:relative;width:100%;max-width:880px;max-height:100%;display:flex;flex-direction:column;gap:14px;background:var(--panel);padding:20px;
  border:4px solid var(--ink);box-shadow:0 0 0 4px #000,10px 10px 0 4px #0009;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.card.narrow{max-width:620px}
.btn{font-family:var(--px);font-size:14px;line-height:1.4;padding:16px 22px;min-height:56px;background:var(--gold);color:#16120a;border:none;cursor:pointer;
  box-shadow:inset -5px -5px 0 #0005,inset 5px 5px 0 #fff7,0 0 0 4px #000;text-align:center}
.btn:active{transform:translateY(3px)}
.btn:focus-visible,.pcard:focus-visible,.f4card:focus-visible,.swatch:focus-visible{outline:4px dashed var(--sky);outline-offset:4px}
.btn.alt{background:var(--panel2);color:var(--ink)}
.btn.wide{width:100%}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.center{text-align:center;align-items:center}

/* title */
.logo{font-size:clamp(34px,8vw,64px);line-height:1.15;color:var(--gold);text-shadow:4px 4px 0 #b4410e,8px 8px 0 #000;text-align:center;margin:6px 0 0}
.logo small{display:block;font-size:.32em;color:var(--ink);text-shadow:3px 3px 0 #000;margin-top:14px;letter-spacing:.12em}
.tagline{font-size:17px;color:var(--muted);text-align:center;max-width:46ch;margin:0 auto;line-height:1.5}
.rot{font-size:9px;color:var(--sky);text-align:center;display:none}
@media (orientation:portrait){.rot{display:block}}

/* how to */
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.how div{background:var(--panel2);padding:14px;border:3px solid #000}
.how h3{font-family:var(--px);font-size:11px;color:var(--gold);margin:0 0 8px;line-height:1.5}
.how p{margin:0;font-size:16px;line-height:1.5}
.stars{color:var(--gold);letter-spacing:.1em;white-space:nowrap}

/* setup */
h1.hd,h2.hd{font-family:var(--px);font-size:18px;color:var(--gold);margin:0;text-align:center;line-height:1.5}
.lbl{font-family:var(--px);font-size:10px;color:var(--muted);letter-spacing:.08em}
#tname{font-family:var(--px);font-size:16px;text-transform:uppercase;width:100%;max-width:340px;padding:12px;background:#000;color:var(--ink);border:3px solid var(--ink)}
.slots{display:flex;gap:10px;flex-wrap:wrap}
.slot{flex:1 1 150px;display:flex;align-items:center;gap:10px;padding:10px;min-height:52px;background:var(--panel2);border:3px solid #000;cursor:pointer;font-family:var(--px);font-size:10px;text-align:left}
.slot.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.slot .sw{width:28px;height:28px;border:3px solid #000;flex:none}
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.swatch{aspect-ratio:1;max-width:100%;border:3px solid #000;cursor:pointer;position:relative;min-height:36px}
.swatch.on1::after,.swatch.on2::after{position:absolute;inset:-2px;display:grid;place-items:center;font-family:var(--px);font-size:11px;color:#fff;text-shadow:2px 2px 0 #000,-1px -1px 0 #000}
.swatch.on1::after{content:"1";border:3px solid var(--gold)}
.swatch.on2::after{content:"2";border:3px solid var(--sky)}
@media (max-width:520px){.pal{grid-template-columns:repeat(4,1fr)}}
.preview{display:flex;align-items:flex-end;justify-content:center;gap:22px;padding:14px;background:#2f7a23;border:3px solid #000;
  background-image:repeating-linear-gradient(90deg,transparent 0 46px,#ffffff55 46px 49px)}
.preview canvas{width:72px;height:90px;image-rendering:pixelated}
.vs{font-family:var(--px);font-size:12px;color:#fff;text-shadow:2px 2px 0 #000;align-self:center}
.seg{display:flex;gap:8px}
.seg button{font-family:var(--px);font-size:11px;padding:12px 14px;min-height:48px;background:var(--panel2);border:3px solid #000;cursor:pointer}
.seg.wrap{flex-wrap:wrap}
.seg button.on{background:var(--gold);color:#16120a}

/* situation / results */
.res{text-align:center;display:flex;flex-direction:column;gap:8px}
.res .big{font-size:clamp(22px,4.5vw,34px);color:var(--rc,var(--gold));text-shadow:3px 3px 0 #000;line-height:1.3}
.res .sub{font-size:12px;color:var(--ink)}
.res .detail{font-size:17px;line-height:1.5;color:var(--muted);max-width:60ch;margin:0 auto}
.res .detail b{color:var(--good)}
.sit{font-size:16px;text-align:center;line-height:1.6}
.sit .dim{opacity:1;color:var(--muted);font-size:11px;display:block}
.mf{position:relative;height:40px;border:3px solid #000;background:#3c8c2a;overflow:hidden}
.mf .ez{position:absolute;top:0;bottom:0;width:8.333%}
.mf .ez.l{left:0;background:var(--c1)}
.mf .ez.r{right:0;background:var(--k1)}
.mf .yl{position:absolute;top:0;bottom:0;width:2px;background:#ffffff70}
.mf .mk{position:absolute;top:50%;width:16px;height:11px;margin:-6px 0 0 -8px;background:#7a3f12;border:2px solid #000;border-radius:50%;transition:left .4s steps(6)}
.mf .fd{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px;background:var(--gold)}
.mf .los{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px;background:var(--sky)}
.f4h{font-size:12px;text-align:center;color:var(--gold)}
.f4grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.f4grid{grid-template-columns:1fr}}
.f4card{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;padding:16px 12px;background:var(--panel2);border:4px solid #000;cursor:pointer;
  box-shadow:inset -4px -4px 0 #0005,inset 4px 4px 0 #ffffff14}
.f4card:active{transform:translateY(3px)}
.f4card .stars{font-size:22px}
.f4card .px{font-size:12px}
.f4card p{margin:0;font-size:15px;color:var(--muted);line-height:1.4}

/* reading */
.readcard{max-width:900px;padding:0;gap:0;overflow:hidden}
.ctxbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;background:var(--panel2);border-bottom:4px solid #000;font-family:var(--px);font-size:10px}
.ctxbar .stars{font-size:16px}
.scroll{flex:1 1 auto;overflow:auto;-webkit-overflow-scrolling:touch;padding:18px 22px;min-height:0;touch-action:pan-y;user-select:text;-webkit-user-select:text}
.ptitle{font-family:var(--px);font-size:16px;color:var(--gold);margin:0 0 4px;line-height:1.5}
.genre{font-size:13px;color:var(--sky);text-transform:uppercase;letter-spacing:.12em;margin-bottom:12px;font-weight:700}
.scroll p{font-size:20px;line-height:1.6;margin:0 0 14px;max-width:68ch;position:relative;padding-left:34px}
.scroll p.poem{font-style:normal}
.pn{position:absolute;left:0;top:4px;font-family:var(--px);font-size:9px;color:var(--muted);background:#000;padding:3px 4px}
.qbox{padding:14px 22px;background:#0c1220;border-top:4px solid #000}
.qlabel{font-size:10px;color:var(--gold);margin-bottom:6px}
.qtext{font-size:21px;line-height:1.45;font-weight:700}
.foot{padding:14px 18px 16px;background:var(--panel2);border-top:4px solid #000;display:flex;flex-direction:column;gap:8px}
.vh{font-family:var(--px);font-size:11px;color:var(--ink);background:#000;display:inline-block;padding:6px 8px;margin:6px 0 10px}
.cctag{font-family:var(--px);font-size:10px;color:#16120a;background:var(--sky);padding:5px 7px;white-space:nowrap;letter-spacing:.06em}
.foot .hint{font-size:14px;color:var(--muted);text-align:center}

/* plays */
.playscard{max-width:960px}
.timer{position:relative;height:30px;background:#000;border:3px solid var(--ink)}
.tbar{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(90deg,var(--good) 0 14px,#2aa955 14px 18px);transition:width .1s linear}
.tbar.warn{background:repeating-linear-gradient(90deg,var(--gold) 0 14px,#c99a00 14px 18px)}
.tbar.hot{background:repeating-linear-gradient(90deg,var(--bad) 0 14px,#b72c2c 14px 18px)}
.tnum{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:#fff;text-shadow:2px 2px 0 #000}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.pgrid{grid-template-columns:1fr}}
.pcard{display:flex;flex-direction:column;gap:8px;text-align:left;padding:14px;min-height:96px;cursor:pointer;background:#0f2a17;border:4px solid #000;
  box-shadow:inset 0 0 0 2px #ffffff22,inset -5px -5px 0 #0006;
  background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:16px 16px}
.pcard:active{transform:translateY(3px)}
.pname{font-size:10px;color:var(--gold)}
.ptxt{font-size:18px;line-height:1.4;font-weight:700}
.pcard.right{background-color:#14522a;border-color:var(--good);box-shadow:0 0 0 4px var(--good)}
.pcard.wrong{background-color:#5a1414;border-color:var(--bad);box-shadow:0 0 0 4px var(--bad)}
.pcard.fade{opacity:.35}
.pcard[disabled]{cursor:default}
.verdict{text-align:center;font-family:var(--px);font-size:16px;line-height:1.5;min-height:24px}
.verdict.good{color:var(--good)} .verdict.bad{color:var(--bad)}
.peek{align-self:center;font-family:var(--px);font-size:10px;padding:12px 16px;background:transparent;border:3px dashed var(--muted);color:var(--muted);cursor:pointer;min-height:44px}
.peekbox{background:#0c1220;border:3px solid #000;padding:14px;max-height:40vh;overflow:auto;touch-action:pan-y}
.peekbox p{font-size:17px;line-height:1.55;margin:0 0 10px}

/* cpu drive */
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;min-height:120px}
.log li{font-family:var(--px);font-size:11px;line-height:1.6;padding:8px 10px;background:var(--panel2);border-left:6px solid var(--k1);animation:slide .25s steps(4)}
.log li.fin{border-left-color:var(--gold);color:var(--gold)}
@keyframes slide{from{transform:translateX(-12px);opacity:0}}

/* report */
.rep{display:grid;gap:10px}
.rep .rrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--panel2);padding:10px 12px;border:3px solid #000}
.rep .stars{font-size:18px;min-width:4.2em}
.rep .stdc{font-size:10px;color:var(--sky);min-width:6.5em}
.rep .rl{font-size:15px;line-height:1.3}
.rep .rl small{display:block;color:var(--muted);font-size:13px}
.rep .rv{font-family:var(--px);font-size:13px;font-variant-numeric:tabular-nums}
.meter{height:10px;background:#000;margin-top:6px}
.meter i{display:block;height:100%;background:var(--good)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kv div{background:var(--panel2);border:3px solid #000;padding:10px;text-align:center}
.kv b{display:block;font-family:var(--px);font-size:18px;color:var(--gold);margin-bottom:6px}
.kv span{font-size:14px;color:var(--muted)}

/* live play controls */
#touch,#juke,#hint,#joy,#passes{display:none}
body.live #passes{display:flex}
#passes{position:fixed;z-index:8;right:calc(env(safe-area-inset-right,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 160px);gap:10px;align-items:center}
.plbl{font-size:9px;color:#fff;text-shadow:2px 2px 0 #000;writing-mode:vertical-rl;transform:rotate(180deg)}
.pbtn{width:66px;height:66px;border-radius:50%;background:var(--pc);border:4px solid #000;font-family:var(--px);font-size:20px;color:#16120a;
  box-shadow:inset -5px -5px 0 #0005,inset 5px 5px 0 #fff8;touch-action:none;cursor:pointer}
.pbtn.off{filter:grayscale(1) brightness(.55)}
body.live #touch{display:block;position:fixed;inset:0;z-index:7;touch-action:none}
body.live #juke{display:grid}
#juke{position:fixed;z-index:8;right:calc(env(safe-area-inset-right,0px) + 26px);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:118px;height:118px;border-radius:50%;
  place-items:center;font-family:var(--px);font-size:14px;color:#16120a;background:var(--gold);border:5px solid #000;box-shadow:inset -6px -6px 0 #0005,inset 6px 6px 0 #fff8;touch-action:none;cursor:pointer}
#juke.cd{filter:grayscale(1) brightness(.6)}
#joy{position:fixed;z-index:8;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;background:#ffffff1f;border:4px solid #ffffff66;pointer-events:none}
#joy.show{display:block}
#knob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:var(--ink);border:4px solid #000}
body.live.pre #hint{display:flex}
#hint{position:fixed;z-index:8;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 250px);justify-content:space-between;padding:0 max(24px,env(safe-area-inset-left,0px));pointer-events:none}
#hint span{font-family:var(--px);font-size:11px;line-height:1.6;background:#000c;padding:10px 12px;border:3px solid var(--ink);max-width:44%}
#banner{position:fixed;z-index:9;left:0;right:0;top:40%;text-align:center;font-family:var(--px);font-size:clamp(26px,6vw,52px);color:#fff;
  text-shadow:4px 4px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;pointer-events:none;opacity:0;transform:scale(.6);transition:opacity .12s,transform .12s}
#banner.show{opacity:1;transform:scale(1)}
#banner.gold{color:var(--gold)} #banner.bad{color:var(--bad)} #banner.good{color:var(--good)}

/* pause */
#pause{position:fixed;inset:0;z-index:30;background:#05070d;display:flex;align-items:center;justify-content:center;padding:20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="game" aria-label="Football field"></canvas>
<div id="hud" hidden>
  <div class="tm"><span class="chip" id="hc1"></span><span class="px nm" id="hn1">READERS</span><span class="px sc" id="hs1">0</span></div>
  <div class="mid"><div class="px clk" id="hclk">Q1 5:00</div><div class="px dd" id="hdd">1ST &amp; 10 · OWN 25</div></div>
  <div class="tm r"><span class="px sc" id="hs2">0</span><span class="px nm" id="hn2">GLITCH GATORS</span><span class="chip cpu" id="hc2"></span></div>
  <div class="hbtns"><button id="bPause" aria-label="Pause">II</button><button id="bMute" aria-label="Sound on or off">♪</button></div>
</div>
<div id="ui"></div>
<div id="touch"></div>
<div id="joy"><div id="knob"></div></div>
<button id="juke" aria-label="Juke">JUKE</button>
<div id="passes"><span class="px plbl">PASS TO</span><button class="pbtn" data-i="0" style="--pc:#ffcc1a" aria-label="Pass to receiver A">A</button><button class="pbtn" data-i="1" style="--pc:#3cbcfc" aria-label="Pass to receiver B">B</button><button class="pbtn" data-i="2" style="--pc:#f06cb4" aria-label="Pass to receiver C">C</button></div>
<div id="hint"><span>◀ DRAG ON THIS SIDE TO RUN</span><span style="text-align:right">PASS TO A, B OR C BEFORE THE BLUE LINE · JUKE TO DODGE ▶</span></div>
<div id="banner"></div>
<div id="pause" hidden></div>

<script>
"use strict";
/* =====================================================================
   READING CONTENT
   Each passage: t=title, g=genre, p=paragraphs, poem=true for poems.
   q[1] = ★ (DOK 1), q[2] = ★★ (DOK 2), q[3] = ★★★ (DOK 3).
   Each question: [question, CORRECT answer, wrong, wrong, wrong]
   (answers are shuffled when shown).
   ===================================================================== */
const PASSAGES = [
{t:`The Last Drive`, g:`Realistic Fiction`, p:[
`The scoreboard glowed: Hawks 14, Comets 17. Only forty seconds remained. Maya wiped her hands on her towel and jogged into the huddle. Her legs felt like wet noodles, but her voice came out steady.`,
`"We've practiced this play a hundred times," she said. "Dev, you run the slant. Watch for the safety."`,
`Dev nodded, though he had dropped two passes already. Maya noticed his fingers twisting the bottom of his jersey. Before they broke the huddle, she leaned toward him. "I'm throwing it to you no matter what," she whispered. "I trust you."`,
`At the snap, Maya stepped back and saw the safety drift left. She fired the ball to Dev, who snatched it out of the air and spun away from a tackler. He did not stop running until he crossed the goal line.`,
`Later, a reporter asked Dev what changed on that final play. He smiled. "Somebody believed in me before I believed in myself."`],
q:{1:[[`How much time remained when Maya jogged into the huddle?`,`Forty seconds`,`Four minutes`,`Fourteen seconds`,`One minute`],
      [`Which play did Maya call for Dev?`,`The slant`,`A screen pass`,`A run up the middle`,`A deep post`]],
   2:[[`Why did Maya whisper to Dev before the huddle broke?`,`She saw he was nervous and wanted to build his confidence.`,`She wanted to keep the play a secret from the coach.`,`She was angry that he had dropped two passes.`,`She forgot to tell him which play to run.`],
      [`Which word best describes Maya in this passage?`,`Encouraging`,`Careless`,`Boastful`,`Impatient`]],
   3:[[`Which statement best expresses the theme of the passage?`,`Trust from others can help a person succeed.`,`Winning is the most important part of any sport.`,`Practicing a play many times is a waste of time.`,`A quarterback should try to win the game alone.`],
      [`Which detail best supports the idea that Maya stayed calm under pressure?`,`"Her legs felt like wet noodles, but her voice came out steady."`,`"The scoreboard glowed: Hawks 14, Comets 17."`,`"Dev nodded, though he had dropped two passes already."`,`"He did not stop running until he crossed the goal line."`]]}},

{t:`Why Football Helmets Changed`, g:`Informational`, p:[
`In the early 1900s, football players wore leather helmets, and some wore no helmets at all. The soft leather protected against scrapes, but it did little to stop hard hits. In 1939, a company introduced the first plastic helmet. Plastic was lighter and harder than leather, so it spread the force of a hit across a wider area.`,
`Today's helmets do even more. Inside the hard outer shell, layers of foam or air pockets squeeze when a player is hit. This squeezing slows the head down more gradually, which reduces the shock to the brain. Engineers test new designs by dropping helmets onto hard surfaces and measuring the impact with sensors.`,
`Still, scientists say no helmet can prevent every injury. That is why leagues have also changed the rules, such as banning players from leading with the top of their helmet when they tackle. Safer equipment and safer rules work together.`],
q:{1:[[`What were helmets made of in the early 1900s?`,`Leather`,`Plastic`,`Metal`,`Foam`],
      [`In what year was the first plastic helmet introduced?`,`1939`,`1909`,`1959`,`1999`]],
   2:[[`What is the main idea of the passage?`,`Helmets have improved over time, but rules are also needed to keep players safe.`,`Leather helmets protected players better than plastic helmets.`,`Engineers enjoy dropping helmets onto hard surfaces.`,`Football was a safer sport in the early 1900s.`],
      [`According to the passage, how does the foam inside a helmet help a player?`,`It slows the head down more gradually during a hit.`,`It makes the helmet look bigger to opponents.`,`It keeps the player's head warm in cold weather.`,`It makes the helmet heavier so it will not move.`]],
   3:[[`Why does the author include the rule about tackling with the top of the helmet?`,`To show that equipment alone cannot prevent every injury`,`To explain how engineers test new helmets`,`To argue that football should be banned`,`To describe how leather helmets were made`],
      [`Which conclusion is best supported by the passage?`,`Player safety improves most when equipment and rules both change.`,`Modern helmets can prevent all head injuries.`,`Plastic helmets are no better than leather ones.`,`Engineers no longer need to test helmets.`]]}},

{t:`The Bean Experiment`, g:`Realistic Fiction`, p:[
`Jonah was certain his bean plants would love music. For his science fair project, he planted six seeds in identical cups. Three cups sat beside a speaker that played music for two hours each day. The other three sat in a quiet corner of the same sunny windowsill. Each cup got the same amount of water every morning.`,
`After three weeks, Jonah measured the plants with a ruler. The music plants averaged 14 centimeters. The quiet plants averaged 14 centimeters, too.`,
`"It didn't work," Jonah groaned, slumping onto the couch.`,
`His older sister, Rosa, studied his notebook. "Did you follow your procedure?"`,
`"Every single day."`,
`"Then it did work," she said. "Your experiment answered your question. The answer just wasn't the one you wanted."`,
`Jonah sat up slowly. Then he grabbed a marker and wrote a new title across his poster: Do Plants Care About Music? Surprising Results!`],
q:{1:[[`How tall did the music plants grow, on average?`,`14 centimeters`,`6 centimeters`,`2 centimeters`,`21 centimeters`],
      [`How many seeds did Jonah plant?`,`Six`,`Three`,`Two`,`Fourteen`]],
   2:[[`Why did Jonah give every cup the same amount of water?`,`So music would be the only difference between the two groups`,`Because he had run out of cups`,`Because Rosa told him to`,`So the plants would grow faster`],
      [`How do Jonah's feelings change from the middle to the end of the story?`,`From disappointed to excited`,`From happy to angry`,`From bored to scared`,`From confident to confused`]],
   3:[[`What lesson does Rosa help Jonah understand?`,`An experiment can succeed even when the results are not what you expected.`,`Music always helps plants grow taller.`,`Older siblings are always right.`,`A project with boring results should be thrown away.`],
      [`Which evidence best shows that Jonah accepted Rosa's advice?`,`He wrote "Surprising Results!" on his poster.`,`He slumped onto the couch.`,`He measured the plants with a ruler.`,`He watered the plants every morning.`]]}},

{t:`Harriet Tubman, Conductor`, g:`Biography`, p:[
`Harriet Tubman was born into slavery in Maryland around 1822. In 1849, she escaped by traveling about 90 miles to Philadelphia, where slavery was against the law. Freedom was not enough for her, though. Her family and friends were still enslaved.`,
`Over the next ten years, Tubman returned to Maryland about thirteen times and guided around seventy people to freedom. She worked as a "conductor" on the Underground Railroad, a secret network of people and safe houses. She often traveled in winter, when the nights were longer and gave her more hours of darkness to hide in.`,
`Tubman later said, "I never ran my train off the track and I never lost a passenger." During the Civil War, she served as a scout and spy for the Union Army. In 1863, she helped lead a raid along the Combahee River in South Carolina that freed more than 700 enslaved people.`],
q:{1:[[`Where did Harriet Tubman go when she escaped in 1849?`,`Philadelphia`,`Maryland`,`South Carolina`,`Boston`],
      [`About how many people did Tubman guide to freedom on her trips back to Maryland?`,`About seventy`,`About seven`,`More than 700`,`About thirteen`]],
   2:[[`Why did Tubman often travel during the winter?`,`The longer nights gave her more darkness to hide in.`,`The weather was warmer for traveling.`,`The trains only ran in winter.`,`People were too busy to notice her in winter.`],
      [`What is the main idea of the passage?`,`Tubman risked her own freedom again and again to lead others to freedom.`,`Tubman was born in Maryland around 1822.`,`The Underground Railroad was a real train with tracks.`,`The Civil War ended slavery in Philadelphia.`]],
   3:[[`What does Tubman's quote "I never ran my train off the track and I never lost a passenger" suggest?`,`She was proud that every person she guided reached freedom safely.`,`She worked as an engineer on a real railroad.`,`She was worried about losing people on future trips.`,`She did not enjoy being a conductor.`],
      [`Which word best describes Tubman, and why?`,`Courageous, because she returned to dangerous places again and again`,`Cautious, because she never left Maryland`,`Shy, because she worked in secret`,`Lucky, because she escaped only one time`]]}},

{t:`Waiting for the Wind`, g:`Realistic Fiction`, p:[
`Every spring, Grandpa Leo built a kite from newspaper, string, and two thin sticks. This year, Kai wanted to fly it alone.`,
`On the first try, Kai ran across the field as fast as he could. The kite bounced behind him, scraping the grass. On the second try, he yanked the string, and the kite nose-dived into a puddle.`,
`"It's broken," Kai said, holding up the soggy paper.`,
`Grandpa Leo took the kite and pressed it gently between two towels. "Kites don't fly because you pull hard," he said. "They fly because you wait for the wind and let it do the work."`,
`They sat on the hill until the grass began to ripple. "Now," Grandpa said quietly.`,
`Kai let the string slip through his fingers a little at a time. The kite wobbled, then climbed, then hung high above the trees like a bright red period at the end of a sentence.`],
q:{1:[[`What did Grandpa Leo use to dry the kite?`,`Two towels`,`A hair dryer`,`The hot sun`,`Old newspaper`],
      [`What was the kite made from?`,`Newspaper, string, and two thin sticks`,`Plastic and metal rods`,`Cloth and wire`,`Paper plates and tape`]],
   2:[[`Why did the kite fail on Kai's first two tries?`,`Kai ran and pulled too hard instead of waiting for the wind.`,`The kite was already broken before he started.`,`It was raining too hard to fly a kite.`,`The string was much too short.`],
      [`What does the simile "like a bright red period at the end of a sentence" help the reader picture?`,`A small, bright dot high in the sky`,`A kite crashing to the ground`,`A torn and messy kite`,`Words written on the kite`]],
   3:[[`Which statement best expresses the theme of the story?`,`Patience can accomplish more than force.`,`Grandparents should do things for their grandchildren.`,`Homemade toys never work well.`,`Running fast is the key to success.`],
      [`Why does the author describe the grass beginning to "ripple" right before Grandpa says "Now"?`,`To show the wind had arrived, so waiting had worked`,`To show that it was getting dark outside`,`To show that Kai was getting bored`,`To show that the grass needed to be mowed`]]}},

{t:`Honeybees at Work`, g:`Informational`, p:[
`A single honeybee colony can hold more than 50,000 bees, and almost every one has a job. Worker bees, which are all female, clean the hive, care for young bees, guard the entrance, and gather food. The queen lays up to 2,000 eggs a day.`,
`When a worker finds a good patch of flowers, she returns to the hive and performs a "waggle dance." The direction of her dance shows the other bees which way to fly, and the length of the waggle tells them how far to go.`,
`Bees do more than make honey. As they move from flower to flower, they carry pollen that helps plants make fruits and seeds. Scientists estimate that about one out of every three bites of food we eat depends on pollinators like bees. In recent years, bee populations have dropped because of disease, pesticides, and loss of habitat. Planting wildflowers and avoiding harmful sprays are two ways people can help.`],
q:{1:[[`How many eggs can a queen bee lay in one day?`,`Up to 2,000`,`More than 50,000`,`About 200`,`Only 3`],
      [`According to the passage, worker bees are all…`,`Female`,`Male`,`Queens`,`Babies`]],
   2:[[`How does the waggle dance help the colony?`,`It tells other bees where to find food.`,`It scares away animals that attack the hive.`,`It turns nectar into honey.`,`It chooses the next queen.`],
      [`What is the main idea of the last paragraph?`,`Bees are important to our food supply and need protection.`,`Bees make more honey than any other insect.`,`Wildflowers are prettier than other plants.`,`Scientists count every bite of food we eat.`]],
   3:[[`Why does the author include the fact that one out of three bites of food depends on pollinators?`,`To show how much people depend on bees`,`To explain how the waggle dance works`,`To compare bees with other insects`,`To teach readers how honey is made`],
      [`Based on the passage, what would most likely happen if bee populations kept falling?`,`Some fruits and seeds would become harder to grow.`,`Colonies would make more honey than ever.`,`Plants would grow faster without bees.`,`Queens would start laying more eggs.`]]}},

{t:`Keep Our Snow Days`, g:`Opinion`, p:[
`Snow days are a winter tradition. Students wake up, check the news, and cheer when their school is closed. But many districts now use "e-learning days" instead, asking students to complete lessons at home online. Our school should keep real snow days.`,
`First, not every family has fast, reliable internet. During a storm, power and internet can go out, leaving some students unable to finish their work through no fault of their own.`,
`Second, snow days give students a rare chance to rest. Sledding, building snow forts, and spending time with family are healthy activities that help kids return to school refreshed.`,
`Some people argue that missing school puts students behind. However, most districts build extra days into the calendar so that lost time can be made up in June.`,
`A snow day is more than a day off. It is a reminder that learning can happen outside of a classroom, too.`],
q:{1:[[`According to the passage, what are "e-learning days"?`,`Days when students complete lessons at home online`,`Days when students go sledding instead of learning`,`Days when teachers meet without students`,`Days added to the calendar in June`],
      [`When does the author say lost school days can be made up?`,`In June`,`On weekends`,`During winter break`,`On e-learning days`]],
   2:[[`What is the author's main claim?`,`Schools should keep real snow days instead of e-learning days.`,`Students should go to school every day of the year.`,`E-learning days are more fun than snow days.`,`Schools should close whenever it is cold.`],
      [`Which reason does the author give in paragraph 2?`,`Not every family has reliable internet.`,`Sledding is good exercise.`,`Snow days are a winter tradition.`,`Lost days can be made up in June.`]],
   3:[[`How does the author respond to the argument that missing school puts students behind?`,`By explaining that extra days are built into the calendar`,`By ignoring the argument completely`,`By agreeing that snow days are harmful`,`By saying students do not need school`],
      [`Which statement would the author most likely agree with?`,`Rest and play can be valuable for students.`,`Students should be in a classroom every day of the year.`,`Online learning is always better than learning in school.`,`Snow is too dangerous for kids to play in.`]]}},

{t:`Wilma Rudolph Runs`, g:`Biography`, p:[
`When Wilma Rudolph was a small child in Tennessee, she became sick with polio, an illness that weakened her left leg. Doctors told her family she might never walk normally. For years, Wilma wore a heavy metal brace, and her brothers and sisters took turns rubbing her leg every day to make it stronger.`,
`Wilma practiced walking without the brace whenever she could, even when it hurt. By about age twelve, she no longer needed it. Soon she was starring on her school's basketball team, and a college coach noticed how fast she was.`,
`At the 1960 Olympics in Rome, Wilma won three gold medals in running events. She became the first American woman to win three track and field gold medals at a single Olympics.`,
`When she returned home to Clarksville, the town planned a parade in her honor. Wilma said she would only attend if people of all races were welcome together. Her parade became one of the first events in the town's history where Black and white residents celebrated side by side.`],
q:{1:[[`How many gold medals did Wilma Rudolph win at the 1960 Olympics?`,`Three`,`One`,`Two`,`Five`],
      [`What illness weakened Wilma's leg?`,`Polio`,`The flu`,`Measles`,`A broken bone`]],
   2:[[`How did Wilma's family help her get stronger?`,`Her brothers and sisters took turns rubbing her leg every day.`,`They hired a famous running coach.`,`They moved to Rome so she could train.`,`They built her a new metal brace.`],
      [`What happened after Wilma no longer needed her brace?`,`She starred on her school's basketball team.`,`She won three gold medals right away.`,`She became sick with polio.`,`She planned a parade in Clarksville.`]],
   3:[[`Why does the author most likely include the story about the parade?`,`To show that Wilma used her fame to make a positive change beyond sports`,`To explain how parades were planned in the 1960s`,`To show that Wilma did not like celebrations`,`To prove that Wilma was the fastest runner in Tennessee`],
      [`Which sentence best supports the idea that Wilma was determined?`,`"Wilma practiced walking without the brace whenever she could, even when it hurt."`,`"At the 1960 Olympics in Rome, Wilma won three gold medals in running events."`,`"When she returned home to Clarksville, the town planned a parade in her honor."`,`"Doctors told her family she might never walk normally."`]]}},

{t:`Friday Night`, g:`Poem`, poem:true, p:[
`Under the lights on Friday night,\nThe bleachers hum like bees;\nThe band strikes up its brassy song\nThat drifts out through the trees.`,
`My little brother grips my sleeve,\nHis cheeks are cold and pink;\nHe watches number twenty-two\nAnd doesn't dare to blink.`,
`The final whistle splits the air,\nWe lost by one, it's true.\nBut walking home, my brother says,\n"Someday I'll wear twenty-two."`,
`The scoreboard fades behind us now,\nThe stars come out instead;\nAnd twenty-two still runs and runs\nIn dreams inside his head.`],
q:{1:[[`What number does the little brother watch during the game?`,`Twenty-two`,`Twelve`,`Two`,`Thirty-two`],
      [`By how much did the team lose?`,`By one point`,`By a field goal`,`By a touchdown`,`They did not lose`]],
   2:[[`What does the simile "The bleachers hum like bees" suggest about the crowd?`,`The crowd is buzzing with noise and excitement.`,`The crowd is afraid of bees.`,`The bleachers are empty and quiet.`,`The crowd is leaving early.`],
      [`How does the little brother feel about player number twenty-two?`,`He admires him.`,`He is jealous of him.`,`He is bored by him.`,`He is angry at him.`]],
   3:[[`Which statement best expresses the theme of the poem?`,`A game can inspire big dreams, even when the team loses.`,`Losing a football game ruins the whole night.`,`Little brothers should stay home from games.`,`Marching bands are the best part of football.`],
      [`Why does the poet end with "twenty-two still runs and runs / In dreams inside his head"?`,`To show the game left a lasting impression on the brother`,`To show the player could not stop running after the game`,`To show the brother had trouble sleeping because of the noise`,`To show the brother forgot about the game`]]}},

{t:`The Frozen Accident`, g:`Informational`, p:[
`According to a popular story, one cold night in 1905, an eleven-year-old boy named Frank Epperson mixed powdered soda with water on his back porch. He stirred the drink with a wooden stick and then forgot about it.`,
`That night, the temperature dropped below freezing. In the morning, Frank found his drink frozen solid, with the stick standing straight up in the middle. He pulled it out by the stick and took a bite. It was delicious.`,
`Frank did not forget his frozen treat. Years later, as an adult, he began selling the ice pops at an amusement park, and in 1923 he applied for a patent to protect his idea. He first called them "Epsicles," but his own children called them "Pop's 'sicles." That nickname stuck, and today people around the world enjoy Popsicles.`],
q:{1:[[`How old was Frank Epperson when he made his discovery?`,`Eleven`,`Five`,`Nineteen`,`Twenty-three`],
      [`What did Frank use to stir his drink?`,`A wooden stick`,`A metal spoon`,`A straw`,`His finger`]],
   2:[[`Why did Frank's drink freeze?`,`The temperature dropped below freezing during the night.`,`He put it in the freezer on purpose.`,`He added ice to the cup.`,`The powdered soda made it freeze.`],
      [`Where did the name "Popsicle" come from?`,`Frank's children called the treats "Pop's 'sicles."`,`Frank named them after a popular song.`,`An amusement park held a naming contest.`,`It was the name of Frank's soda powder.`]],
   3:[[`What lesson can readers learn from this passage?`,`A mistake can sometimes lead to a great idea.`,`Children should never leave drinks outside.`,`Inventions only happen in laboratories.`,`Patents are not important for inventors.`],
      [`Which detail best shows that Frank understood his idea was valuable?`,`He applied for a patent to protect his idea.`,`He forgot about the drink on the porch.`,`He mixed powdered soda with water.`,`The temperature dropped below freezing.`]]}}
];

{s:`4.RC.1`, t:`The Lunch Table Trade`, g:`Realistic Fiction`, p:[
`On the first day at her new school, Priya opened her lunch box and froze. Inside were her grandmother's pork dumplings, still warm in their foil. Everyone around her had sandwiches.`,
`A boy named Marcus leaned over. "What are those?"`,
`Priya's cheeks burned. She started to close the lid. "Just dumplings," she mumbled.`,
`"They smell amazing," Marcus said. He held up half of a peanut butter sandwich. "Want to trade one?"`,
`Priya hesitated, unsure what to do, then slid a dumpling onto his napkin. Marcus took a bite, and his eyes went wide. "Can your grandma teach my dad how to make these?"`,
`The next day, Priya's grandmother packed twice as many dumplings. By Friday, three kids at the table were asking for trades, and Priya had stopped closing her lunch box.`],
q:{1:[[`What did Marcus offer to trade?`,`Half of a peanut butter sandwich`,`An apple`,`Two cookies`,`A bag of chips`],
      [`What was inside Priya's lunch box on the first day?`,`Her grandmother's pork dumplings`,`A peanut butter sandwich`,`Leftover pizza`,`A salad in foil`]],
   2:[[`Based on details in paragraph 3, how did Priya feel when Marcus asked about her lunch?`,`Embarrassed`,`Proud`,`Angry`,`Sleepy`],
      [`Why did Priya's grandmother most likely pack twice as many dumplings the next day?`,`Priya told her that other kids wanted to try them.`,`Priya was extra hungry after school.`,`Her grandmother made a mistake.`,`Marcus's dad asked her to.`]],
   3:[[`Which detail best supports the inference that Priya became more confident by the end?`,`"Priya had stopped closing her lunch box."`,`"Everyone around her had sandwiches."`,`"Priya's cheeks burned."`,`"Marcus took a bite, and his eyes went wide."`],
      [`A student says, "Marcus is a kind classmate." Which detail best supports this inference?`,`He told Priya her food smelled amazing and offered to trade.`,`He leaned over to look at her lunch.`,`He brought a peanut butter sandwich.`,`He asked a question about her lunch.`]]},
 cc:[[`Read this sentence: "Priya hesitated, unsure what to do, then slid a dumpling onto his napkin." What does hesitated mean?`,`Paused because she was unsure`,`Laughed out loud`,`Moved very quickly`,`Shouted angrily`]]},

{s:`4.RC.1`, t:`Nature's Engineers`, g:`Informational`, p:[
`Beavers are some of nature's best builders. Using their sharp front teeth, they can cut down a small tree in just a few minutes. They drag branches, mud, and stones into a stream to build a dam. The dam blocks the water and creates a calm, deep pond.`,
`In the middle of the pond, beavers build a home called a lodge. The lodge has underwater entrances, so predators such as wolves and bears have a hard time getting inside. Inside, there is a dry room above the waterline where the beaver family sleeps and stays warm in winter.`,
`Beaver dams help other living things, too. The ponds they create become homes for fish, frogs, ducks, and insects. In dry seasons, the ponds hold water that animals need. Because of this, scientists call beavers a keystone species, which means many other species depend on them.`],
q:{1:[[`Where are the entrances to a beaver lodge?`,`Underwater`,`On the roof`,`In a tree trunk`,`On the riverbank`],
      [`What materials do beavers use to build a dam?`,`Branches, mud, and stones`,`Leaves and feathers`,`Sand and shells`,`Grass and string`]],
   2:[[`According to the text, why do underwater entrances help beavers?`,`Predators have a hard time getting inside.`,`They keep the lodge cool in summer.`,`They help beavers catch fish.`,`They let more sunlight into the lodge.`],
      [`Based on the text, what would most likely happen to the frogs if a beaver dam broke and the pond drained?`,`They could lose their home.`,`They would build a new dam.`,`They would move into the lodge.`,`Nothing would change for them.`]],
   3:[[`Which detail best supports the idea that beavers help animals survive dry seasons?`,`"In dry seasons, the ponds hold water that animals need."`,`"They can cut down a small tree in just a few minutes."`,`"The lodge has underwater entrances."`,`"The beaver family sleeps and stays warm in winter."`],
      [`The author calls beavers "nature's best builders." Which example from the text best supports this?`,`They build lodges with underwater entrances and a dry room above the water.`,`Their ponds become homes for fish and frogs.`,`Wolves and bears are their predators.`,`Scientists call them a keystone species.`]]},
 cc:[[`Read this sentence: "Scientists call beavers a keystone species, which means many other species depend on them." What is a keystone species?`,`A species that many other species depend on`,`A species that lives only in stone`,`A species that is in danger of disappearing`,`A species that eats other animals`]]},

{s:`4.RC.1`, t:`The Case of the Missing Medal`, g:`Mystery`, p:[
`When Coach Rivera unlocked the gym on Monday morning, the hook where the team's gold championship medal usually hung was empty. A trail of tiny muddy tracks, each with three thin toes pointing forward, led from the open window across the windowsill.`,
`"Someone stole our medal!" shouted Leo.`,
`Ava knelt beside the tracks. "No person made these," she said. Then she pointed to a shiny black feather stuck to the windowsill.`,
`Outside, the custodian was raking leaves under the big oak tree. Something glinted in the branches above him, sparkling in the sunlight. Ava looked up and grinned. In a messy nest of sticks sat the gold medal, next to two bottle caps and a spoon.`,
`"Our thief," Ava announced, "can fly."`],
q:{1:[[`Where did the muddy tracks lead from?`,`The open window`,`The locker room`,`The front door`,`The custodian's closet`],
      [`Besides the medal, what was in the nest?`,`Two bottle caps and a spoon`,`A whistle and a key`,`Three coins`,`A pencil and an eraser`]],
   2:[[`What kind of thief most likely took the medal?`,`A bird`,`A raccoon`,`A student`,`The custodian`],
      [`Why did Ava grin when she looked up?`,`She figured out where the medal was.`,`She saw a funny squirrel.`,`The custodian told a joke.`,`She found her lost spoon.`]],
   3:[[`Which detail best supports the inference that the thief likes shiny objects?`,`The nest held the medal, two bottle caps, and a spoon.`,`The tracks were muddy.`,`The custodian was raking leaves.`,`Leo shouted that the medal was stolen.`],
      [`Which clues did Ava use to decide the thief was not a person?`,`The tiny three-toed tracks and the black feather`,`The open window and the empty hook`,`The pile of leaves and the oak tree`,`Leo's shout and the coach's keys`]]},
 cc:[[`Read this sentence: "Something glinted in the branches above him, sparkling in the sunlight." What does glinted mean?`,`Gave off small flashes of light`,`Fell to the ground`,`Made a loud noise`,`Hid in the shadows`]]},

{s:`4.RC.1`, t:`Why Leaves Change Color`, g:`Informational`, p:[
`In summer, leaves are green because they are full of chlorophyll, a chemical that helps plants turn sunlight into food. Chlorophyll is so plentiful, or there is so much of it, that it hides the other colors in the leaf.`,
`As fall arrives, days get shorter and nights get cooler. Trees begin to prepare for winter by slowing down their food-making. The chlorophyll breaks down, and the green fades away. Now the yellow and orange colors that were hiding all summer can finally be seen.`,
`Some trees, like red maples, make brand-new red and purple colors in the fall. These colors form when sugar gets trapped in the leaves on sunny days followed by cool nights. That is why a fall with bright, sunny days and chilly nights often produces the most colorful leaves.`],
q:{1:[[`What chemical makes leaves green?`,`Chlorophyll`,`Sugar`,`Sunlight`,`Water`],
      [`According to the text, what happens to the days as fall arrives?`,`They get shorter.`,`They get longer.`,`They get hotter.`,`They stay the same.`]],
   2:[[`According to the text, why can people see yellow and orange leaves in the fall?`,`The green chlorophyll breaks down, so the hidden colors show.`,`Trees paint their leaves new colors.`,`The leaves get too much water.`,`Cold weather turns green into yellow.`],
      [`What do red maples do in the fall that other trees may not?`,`They make brand-new red and purple colors.`,`They keep their green color all winter.`,`They lose their leaves in summer.`,`They make more chlorophyll.`]],
   3:[[`Which detail best supports the idea that yellow and orange were in the leaves all along?`,`Chlorophyll "hides the other colors in the leaf."`,`"Days get shorter and nights get cooler."`,`Red maples make "brand-new red and purple colors."`,`Sugar "gets trapped in the leaves."`],
      [`One fall has cloudy days and warm nights. Based on the text, what can you infer about the leaves that year?`,`They would be less colorful than usual.`,`They would be brighter red than ever.`,`They would stay green forever.`,`They would turn purple overnight.`]]},
 cc:[[`Read this sentence: "Chlorophyll is so plentiful, or there is so much of it, that it hides the other colors." What does plentiful mean?`,`Present in large amounts`,`Very rare`,`Brightly colored`,`Easy to break`]]},

{s:`4.RC.4`, t:`The Spelling Bee, Told Twice`, g:`Point of View`, p:[
`## Version 1`,
`My hands were shaking so hard that the microphone rattled against the stand. The word was "necessary." I knew it. I had practiced it a hundred times with Dad at the kitchen table. But when I opened my mouth, my brain went blank. I spelled it with two c's. The bell dinged, and I walked off the stage wishing the floor would swallow me.`,
`## Version 2`,
`Nora stepped up to the microphone, and the audience grew quiet. In the third row, her father leaned forward and crossed his fingers. When Nora misspelled "necessary," he did not look disappointed. Instead, he stood up and clapped louder than anyone in the gym. Nora was staring at her shoes and never noticed.`],
q:{1:[[`From what point of view is Version 1 told?`,`First person, by Nora`,`Third person, by a narrator outside the story`,`First person, by Nora's father`,`Third person, by the audience`],
      [`Which word from Version 1 shows that it is told in the first person?`,`"my"`,`"Nora"`,`"he"`,`"audience"`]],
   2:[[`What does the reader learn in Version 2 that Nora does not know?`,`Her father clapped louder than anyone.`,`She misspelled the word "necessary."`,`The audience grew quiet.`,`The bell dinged.`],
      [`What does Version 1 show that Version 2 does not?`,`Nora's own thoughts and feelings on stage`,`Where Nora's father was sitting`,`How the audience reacted`,`What Nora's father did after the mistake`]],
   3:[[`How does reading both versions change a reader's understanding of the event?`,`Nora feels like a failure, but the reader sees that her father is proud of her.`,`Both versions show that Nora won the spelling bee.`,`Both versions show that Nora's father was disappointed.`,`Version 2 proves that Nora did not practice.`],
      [`Why might an author choose first person for Version 1?`,`To help readers feel Nora's nervousness from the inside`,`To describe everyone in the gym`,`To tell what Nora's father was thinking`,`To show events Nora could not see`]]},
 cc:[[`Read this sentence: "My hands were shaking so hard that the microphone rattled against the stand." What does rattled mean?`,`Shook and made small knocking sounds`,`Stayed perfectly still`,`Broke into pieces`,`Played a song`]]},

{s:`4.RC.4`, t:`Lost at the Fair`, g:`Point of View`, p:[

    h+=`<div class="mk" style="left:${pct(G.ball)}"></div>`}else h+=extra;
  return h+"</div>";

/* ===================== reading + question ===================== */
function passageHtml(P){let n=0;return`<h2 class="ptitle">${esc(P.t)}</h2><div class="genre">${esc(P.g)}</div>`+
  P.p.map(x=>x.startsWith("## ")?`<h3 class="vh">${esc(x.slice(3))}</h3>`:`<p class="${P.poem?"poem":""}"><span class="pn">${++n}</span>${esc(x).replace(/\n/g,"<br>")}</p>`).join("")}
const lvlTag=l=>l==="cc"?`<span class="cctag">CONTEXT CLUE</span>`:`<span class="stars">${stars(l)}</span>`;
function ctxLabel(c){const k=c.ctx.kind;
  if(k==="down")return`${ORD[G.down]} &amp; ${G.ball+G.toGo>=100?"GOAL":G.toGo} · ${spotTxt(G.ball)}`;
  if(k==="go")return`4TH DOWN · GO FOR IT`;if(k==="pat")return`EXTRA POINT KICK`;if(k==="two")return`2-POINT TRY`;if(k==="fg")return`${c.ctx.dist}-YD FIELD GOAL`;return`4TH DOWN · PUNT`}
function askQuestion(level,ctxo){
  const o=drawQ(level),order=shuffle([0,1,2,3]);
  G.cur={level,std:o.std,ctx:ctxo,P:PASSAGES[o.p],q:o.q[0],ans:order.map(i=>o.q[i+1]),correct:order.indexOf(0),names:shuffle(PLAY_NAMES).slice(0,4)};
  if(level==="cc")G.stats.cc[0]++;else G.stats.asked[level]++;
  const sd=G.stats.std[o.std]||(G.stats.std[o.std]=[0,0]);sd[0]++;
  G.clockRun=!(ctxo.kind==="pat"||ctxo.kind==="two");G.mode="menu";
  const btn=ctxo.kind==="down"?"READY FOR THE PLAYS ▶":"PICK PLAY ▶";
  setUI(`<div class="card readcard">
    <div class="ctxbar"><span>${ctxLabel(G.cur)}</span>${lvlTag(level)}</div>
    <div class="scroll">${passageHtml(G.cur.P)}</div>
    <div class="qbox"><div class="px qlabel">THE QUESTION</div><div class="qtext">${esc(G.cur.q)}</div></div>
    <div class="foot"><button class="btn wide" data-act="ready">${btn}</button><div class="hint">The answer choices appear as play cards. You'll have 15 seconds to choose.</div></div>
  </div>`);
}
ACT.ready=()=>{
  const c=G.cur;c.left=15;c.lastSec=16;c.locked=false;G.timerOn=true;
  setUI(`<div class="card playscard">
    <div class="ctxbar" style="margin:-20px -20px 0"><span>${ctxLabel(c)}</span>${lvlTag(c.level)}</div>
    <div class="timer"><div class="tbar" id="tbar" style="width:100%"></div><div class="tnum" id="tnum">15</div></div>
    <div class="qtext">${esc(c.q)}</div>
    <div class="pgrid">${c.ans.map((a,i)=>`<button class="pcard" data-act="ans" data-i="${i}"><span class="px pname">${"ABCD"[i]} · ${c.names[i]}</span><span class="ptxt">${esc(a)}</span></button>`).join("")}</div>
    <div class="verdict px" id="verdict"></div>
    <button class="peek" data-act="peek">PEEK AT THE PASSAGE</button>
    <div class="peekbox" id="peekbox" hidden>${passageHtml(c.P)}</div>
  </div>`);
};
ACT.peek=b=>{const p=$("#peekbox");p.hidden=!p.hidden;b.textContent=p.hidden?"PEEK AT THE PASSAGE":"HIDE THE PASSAGE"};
ACT.ans=b=>choose(+b.dataset.i,false);
function tickTimer(dt){const c=G.cur;if(!c||c.locked)return;c.left-=dt;const s=Math.ceil(Math.max(0,c.left));
  const bar=$("#tbar"),num=$("#tnum");if(bar){bar.style.width=(Math.max(0,c.left)/15*100)+"%";bar.className="tbar"+(c.left<=5?" hot":c.left<=9?" warn":"")}
  if(num)num.textContent=s;if(s<c.lastSec){c.lastSec=s;if(s<=5&&s>0)SFX.tick()}
  if(c.left<=0){const wrong=[0,1,2,3].filter(i=>i!==c.correct);choose(pick(wrong),true)}}
function choose(i,timedOut){
  const c=G.cur;if(!c||c.locked)return;c.locked=true;G.timerOn=false;G.clockRun=false;
  const right=!timedOut&&i===c.correct;if(right){if(c.level==="cc")G.stats.cc[1]++;else G.stats.right[c.level]++;G.stats.std[c.std][1]++}if(timedOut)G.stats.timeouts++;
  document.querySelectorAll(".pcard").forEach((el,k)=>{el.disabled=true;el.classList.add(k===c.correct?"right":k===i?"wrong":"fade")});
  const v=$("#verdict");if(v){v.className="verdict px "+(right?"good":"bad");v.textContent=right?"GOOD READ! PLAY CALLED.":timedOut?`TIME! THE CLOCK PICKED PLAY ${"ABCD"[i]}…`:"NOT THE RIGHT READ…"}
  right?SFX.good():(timedOut?SFX.buzzer():SFX.bad());
  const gen=G.gen;setTimeout(()=>{if(gen===G.gen)resolveAnswer(right)},right?1300:2300);
}
function resolveAnswer(right){
  const c=G.cur,learn=right?"":`The correct answer was: <b>${esc(c.ans[c.correct])}</b>`;
  G.stats.plays++;
  switch(c.ctx.kind){
    case"down":case"go":right?startLive(c.ctx):badPlay(c.ctx,learn);break;
    case"fg":fieldGoal(right,c.ctx,learn);break;
    case"punt":punt(right,learn);break;
    case"pat":patKick(right,learn);break;
    case"two":right?startLive(c.ctx):interstitial({title:"NO GOOD!",sub:"2-POINT TRY FAILS",detail:learn,color:"var(--bad)"},()=>cpuDrive(75),"KICK OFF ▶");break;
  }
}

/* ===================== wrong-answer outcomes ===================== */
function badPlay(ctxo,learn){
  const roll=Math.random()*100,r=roll<25?"false":roll<50?"sack":roll<85?"inc":"int";
  if(r==="false"){const nb=G.ball-5<1?Math.max(1,Math.floor(G.ball/2)):G.ball-5,yd=G.ball-nb;G.toGo+=yd;G.ball=nb;
    return situation({title:"FALSE START!",sub:`${yd}-YARD PENALTY · REPLAY THE DOWN`,detail:learn,color:"var(--bad)"})}
  if(r==="sack"){const nb=G.ball-5;G.stats.yards-=5;if(nb<=0)return safety(learn);G.ball=nb;G.toGo+=5;G.down++;
    if(G.down>4)return turnoverDowns("SACKED!",learn);return situation({title:"SACKED!",sub:"LOSS OF 5 YARDS",detail:learn,color:"var(--bad)"})}
  if(r==="inc"){G.down++;if(G.down>4)return turnoverDowns("INCOMPLETE!",learn);
    return situation({title:"INCOMPLETE!",sub:"PASS FALLS TO THE GRASS",detail:learn,color:"var(--bad)"})}
  G.stats.ints++;let x=G.ball+ri(6,20)-ri(0,14);if(x>=100)x=80;x=clamp(x,2,98);
  interstitial({title:"INTERCEPTED!",sub:`${G.cpu.name} TAKE OVER`,detail:learn,color:"var(--bad)"},()=>cpuDrive(x));
}
function turnoverDowns(t,learn){interstitial({title:t,sub:"TURNOVER ON DOWNS",detail:learn,color:"var(--bad)"},()=>cpuDrive(G.ball))}
function touchdown(){G.score[0]+=6;G.stats.tds++;G.pat=true;G.clockRun=false;G.timerOn=false;G.mode="menu";document.body.classList.remove("live");
  G.ball=97;G.down=1;G.toGo=3;refreshBg();
  setUI(`<div class="card narrow">${head({title:"TOUCHDOWN!",sub:`${esc(G.team.name)} +6`,color:"var(--gold)"})}
    <div class="px f4h">GO FOR 1 OR GO FOR 2?</div><div class="f4grid">
    <button class="f4card" data-act="pat"><span class="cctag">CONTEXT CLUE</span><span class="px">EXTRA POINT</span><p>Kick for 1 point. Answer a context clue question.</p></button>
    <button class="f4card" data-act="two" data-l="2"><span class="stars">${stars(2)}</span><span class="px">GO FOR 2</span><p>Run it in from the 3-yard line for 2 points.</p></button>
    <button class="f4card" data-act="two" data-l="3"><span class="stars">${stars(3)}</span><span class="px">GO FOR 2</span><p>Same 2 points with a deeper-thinking question.</p></button></div></div>`);
}
ACT.pat=()=>askQuestion("cc",{kind:"pat"});
ACT.two=b=>askQuestion(+b.dataset.l,{kind:"two"});
function patKick(right,learn){
  startKick({x0:G.ball-7,y0:CY,x1:112,y1:right?CY:CY+(Math.random()<.5?-1:1)*rand(5,7),h:7,dur:1.2,
    onLand:()=>{if(right){banner("IT'S GOOD!",1200,"good");SFX.good()}else{banner("NO GOOD!",1200,"bad");SFX.bad()}},
    after:()=>{if(right){G.score[0]+=1;G.stats.pat++}
      interstitial({title:right?"EXTRA POINT GOOD!":"EXTRA POINT MISSED",sub:right?`${esc(G.team.name)} +1`:"",detail:learn,color:right?"var(--good)":"var(--bad)"},()=>cpuDrive(75),"KICK OFF ▶")}});
}
function safety(learn){G.score[1]+=2;SFX.bad();interstitial({title:"SAFETY!",sub:`${G.cpu.name} +2`,detail:(learn?learn+"<br>":"")+"You were brought down in your own end zone.",color:"var(--bad)"},()=>cpuDrive(55))}

/* ===================== kicks ===================== */
function startKick(o){G.mode="kick";G.clockRun=false;setUI("");G.K=Object.assign({t:0,done:false,hold:1.4},o);SFX.kick()}
function fieldGoal(right,ctxo,learn){
  const d=ctxo.dist,inRange=d<=50,good=right&&inRange,ks=G.ball-7;
  let x1=112,y1=CY,h=9;
  if(!inRange){x1=Math.min(ks+rand(42,49),108);h=7}else if(!good){y1=CY+(Math.random()<.5?-1:1)*rand(5,7)}
  startKick({x0:ks,y0:CY,x1,y1,h,dur:1.5,onLand:()=>{if(good){banner("IT'S GOOD!",1300,"good");SFX.good()}else{banner(inRange?"NO GOOD!":"TOO SHORT!",1300,"bad");SFX.bad()}},
    after:()=>{
      if(good){G.score[0]+=3;G.stats.fgs++;interstitial({title:"IT'S GOOD!",sub:`${d}-YARD FIELD GOAL · +3`,color:"var(--good)"},()=>cpuDrive(75),"KICK OFF ▶")}
      else{const det=right&&!inRange?`You read it right, but a ${d}-yard kick is out of range. From 51 yards or more, the smart call is to <b>PUNT</b>.`:learn;
        interstitial({title:"NO GOOD!",sub:"MISSED FIELD GOAL",detail:det,color:"var(--bad)"},()=>cpuDrive(G.ball))}
    }});
}
function punt(right,learn){
  const dist=right?ri(42,54):ri(16,28),land=G.ball+dist,ret=right?ri(0,8):ri(0,5);
  let x=land>=100?80:land-ret;x=clamp(x,1,99);
  startKick({x0:G.ball-12,y0:CY,x1:Math.min(land,108),y1:CY+rand(-6,6),h:right?15:7,dur:right?1.9:1.3,
    onLand:()=>{banner(right?"BOOMING PUNT!":"SHANKED IT!",1200,right?"good":"bad");right?SFX.good():SFX.bad()},
    after:()=>interstitial({title:right?"BOOMING PUNT!":"SHANKED PUNT!",sub:`${dist} YARDS${land>=100?" · TOUCHBACK":""}`,detail:right?`${G.cpu.name} start at ${cpuSpot(x)}.`:learn,color:right?"var(--good)":"var(--bad)"},()=>cpuDrive(x))});
}
function updateKick(dt){const K=G.K;K.t+=dt;if(K.t>=K.dur&&!K.done){K.done=true;K.onLand&&K.onLand()}
  if(K.done){K.hold-=dt;if(K.hold<=0){const f=K.after;G.K=null;G.mode="menu";f()}}}

/* ===================== CPU drive (simulated) ===================== */
function cpuDrive(x){
  G.pat=false;G.mode="menu";G.clockRun=false;document.body.classList.remove("live");
  x=clamp(Math.round(x),1,99);const gen=G.gen,short=1-x/100,r=Math.random();
  const pTD=.14+.38*short+.02*(G.q-1),pFG=.2,pTO=.14;
  const out=r<pTD?"td":r<pTD+pFG?"fg":r<pTD+pFG+pTO?"to":"punt";
  let endX=out==="td"?0:out==="fg"?Math.min(x,ri(10,30)):clamp(x-ri(0,28),out==="to"?3:28,97);
  const lines=[];let cur=x,n=0;const kinds=["Run","Pass complete","Screen pass","Sweep","QB scramble","Draw play"];
  while(cur>endX&&n<8){let g=n===7?cur-endX:Math.min(cur-endX,ri(2,15));cur-=g;lines.push({x:cur,t:`${pick(kinds)} for ${g}`});n++}
  if(out==="punt"){lines.push({x:cur,t:"Incomplete pass"});lines.push({x:cur,t:"Run for no gain"})}
  if(!lines.length)lines.push({x:cur,t:"Run for no gain"});
  let fin,newBall=25;
  if(out==="td"){fin=`TOUCHDOWN ${G.cpu.name} (+7)`;}
  else if(out==="fg"){fin=`${cur+17}-YARD FIELD GOAL (+3)`;}
  else if(out==="to"){fin=`FUMBLE! YOUR DEFENSE RECOVERS!`;newBall=clamp(cur,2,98);}
  else{let land=cur-ri(36,48);newBall=land<=0?20:clamp(land+ri(0,8),1,60);fin=`PUNT. YOU TAKE OVER AT ${spotTxt(newBall)}`;}
  const used=Math.min(G.clock,lines.length*ri(6,9));
  setUI(`<div class="card narrow">
    <div class="res" style="--rc:var(--k1)"><div class="px big">${G.cpu.name} BALL</div><div class="px sub">STARTING AT ${cpuSpot(x)}</div></div>
    ${miniField(`<div class="mk" id="cmk" style="left:${mfPct(x)}"></div>`)}
    <ul class="log" id="clog"></ul><div id="cbtn"></div></div>`);
  let i=0;const log=$("#clog"),mk=$("#cmk");
  const step=()=>{if(gen!==G.gen||!log.isConnected)return;
    if(i<lines.length){const L=lines[i++];const li=document.createElement("li");li.textContent=L.t;log.appendChild(li);mk.style.left=mfPct(L.x);SFX.click();
      if(log.children.length>5)log.removeChild(log.firstChild);setTimeout(step,480)}
    else{const li=document.createElement("li");li.className="fin";li.textContent=fin;log.appendChild(li);
      if(out==="td"){G.score[1]+=7;G.stats.cpuTDs++;SFX.bad()}else if(out==="fg"){G.score[1]+=3;SFX.bad()}else SFX.good();
      G.clock=Math.max(0,G.clock-used);if(G.clock<=0)G.qOver=true;
      G.ball=newBall;G.down=1;G.toGo=Math.min(10,100-G.ball);

/* ===================== live play ===================== */
let passReq=-1;
function startLive(ctxo){
  setUI("");P=buildPlay();P.ctx=ctxo;G.mode="live";G.clockRun=ctxo.kind!=="two";jukeReq=false;passReq=-1;
  document.body.classList.add("live","pre");banner(ctxo.kind==="two"?"2-POINT TRY!":"READY…",1100);updatePassBtns();
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function moveTo(o,tx,ty,sp,dt){const dx=tx-o.x,dy=ty-o.y,m=Math.hypot(dx,dy);if(m<.01){o.vx=o.vy=0;return}
  const s=Math.min(sp,m/dt);o.vx=dx/m*s;o.vy=dy/m*s;o.x+=o.vx*dt;o.y+=o.vy*dt;o.anim+=s*dt*1.2;if(Math.abs(o.vx)>.2)o.face=Math.sign(o.vx)}
function pop(txt,x,y,col="#fff"){P.pops.push({txt,x,y,t:0,col})}
const canPass=()=>{const p=P;return!!(p&&p.phase!=="end"&&p.phase!=="done"&&!p.thrown&&p.car&&p.car===p.passer&&p.car.x<p.los)};
let passOk=null;
function updatePassBtns(){const ok=canPass();if(ok===passOk)return;passOk=ok;document.querySelectorAll(".pbtn").forEach(b=>b.classList.toggle("off",!ok))}
function throwTo(i){const p=P,c=p.car,R=p.wr[i];if(!canPass()||p.phase!=="live"||!R)return;
  const T=clamp(dist(c,R)/20,.35,1.3);
  p.ball={x0:c.x,y0:c.y,x1:clamp(R.x+R.vx*T,-9,109),y1:clamp(R.y+R.vy*T,.5,FW-.5),t:0,T,R};
  p.thrown=true;p.car=null;c.vx=c.vy=0;G.stats.passes++;SFX.kick()}
function blockStep(b,dt,c,p){
  if(b.eng){const d=b.eng;b.engT-=dt;
    if(b.engT<=0||d.eng!==b){if(d.eng===b){d.eng=null;d.stun=.25}b.eng=null;b.cool=.7;return}
    const tx=c?c.x:d.x-1,ty=c?c.y:d.y,dx=tx-d.x,dy=ty-d.y,m=Math.hypot(dx,dy)||1;
    d.x+=dx/m*.8*dt;d.y+=dy/m*.8*dt;b.x=d.x-dx/m*.95;b.y=d.y-dy/m*.95;b.anim+=dt*3;b.face=Math.sign(d.x-b.x)||1;return}
  if(b.cool>0)b.cool-=dt;
  const ref=c||{x:b.x,y:b.y};let best=null,bs=1e9;
  for(const d of p.def){if(d.eng||d.stun>0)continue;const db=dist(b,d);if(db>8)continue;const sc=db+.6*dist(d,ref);if(sc<bs){bs=sc;best=d}}
  if(best&&b.cool<=0){moveTo(b,best.x,best.y,b.spd,dt);if(dist(b,best)<1.1){b.eng=best;best.eng=b;best.cover=null;b.engT=rand(1.3,3.2)*(best.role==="DL"?1.25:.8)}}
  else if(c)moveTo(b,c.x+2.5,c.y+b.off,b.spd*.9,dt);else{b.vx=b.vy=0}
}
function updateLive(dt){
  const p=P;p.pops.forEach(o=>o.t+=dt);p.pops=p.pops.filter(o=>o.t<1);
  if(p.phase==="pre"){p.t+=dt;if(p.t>=p.pre){p.phase="live";p.t=0;SFX.whistle();banner("HUT!",650,"gold");document.body.classList.remove("pre")}passReq=-1;return}
  if(p.phase==="end"){p.endT-=dt;if(p.endT<=0){p.phase="done";resolveLive()}return}
  if(p.phase!=="live")return;
  p.t+=dt;
  if(passReq>=0){const i=passReq;passReq=-1;throwTo(i)}
  updatePassBtns();
  const c=p.car;
  // ---- ball carrier (player controlled)
  if(c){const iv=inputVec();
    c.jcd=Math.max(0,c.jcd-dt);c.juke=Math.max(0,c.juke-dt);c.slow=Math.max(0,c.slow-dt);
    if(jukeReq){jukeReq=false;if(c.jcd<=0){c.juke=.38;c.jcd=1.2;SFX.juke()}}
    $("#juke").classList.toggle("cd",c.jcd>0);
    const sp=c.spd*(c.juke>0?1.5:1)*(c.slow>0?.55:1);let tx=iv.x,ty=iv.y;
    if(c.juke>0&&Math.hypot(tx,ty)<.2){tx=1;ty=0}
    const k=Math.min(1,dt*(c.juke>0?18:9));c.vx+=(tx*sp-c.vx)*k;c.vy+=(ty*sp-c.vy)*k;
    c.x+=c.vx*dt;c.y+=c.vy*dt;c.anim+=Math.hypot(c.vx,c.vy)*dt*1.2;if(Math.abs(c.vx)>.3)c.face=Math.sign(c.vx);
    if(c.x<-9.5){c.x=-9.5;c.vx=0}
    if(!p.crossed&&c.x>p.los+.5)p.crossed=true;
  }else jukeReq=false;
  // ---- pass in the air
  if(p.ball){const B=p.ball;B.t+=dt;
    if(B.t>=B.T){const R=B.R;p.ball=null;
      if(Math.hypot(R.x-B.x1,R.y-B.y1)>3.2){pop("OVERTHROWN",B.x1,B.y1,"#ff5050");return endPlay("inc")}
      let near=null,nd=99;for(const d of p.def){if(d.eng||d.stun>0)continue;const dd=dist(d,R);if(dd<nd){nd=dd;near=d}}
      if(nd<1.1&&Math.random()<.6){pop("BROKEN UP!",R.x,R.y,"#ff5050");return endPlay("inc")}
      carrierize(R);p.car=R;p.caught=true;G.stats.catches++;pop("CATCH!",R.x,R.y,"#3ddc6e");tone(880,.08,"square",.05);tone(1320,.1,"square",.05,.07);
      if(R.x>p.los+.5)p.crossed=true;
    }}
  // ---- receivers
  for(const w of p.wr){if(w===p.car)continue;
    if(p.caught||p.crossed)blockStep(w,dt,p.car,p);
    else if(w.wp<w.route.length){const t=w.route[w.wp];moveTo(w,t.x,t.y,w.spd,dt);if(Math.hypot(w.x-t.x,w.y-t.y)<.3)w.wp++}
    else moveTo(w,w.x+1,w.y,1.5,dt)}
  // ---- QB after the throw just watches
  if(p.passer!==p.car)p.passer.vx=p.passer.vy=0;
  // ---- blockers
  for(const b of p.off)blockStep(b,dt,p.car,p);
  // ---- breakaway: nobody left in front of the ball carrier
  if(p.car&&!p.breakaway&&p.car.x>p.los+1&&!p.def.some(d=>!d.eng&&d.x>p.car.x-.3)){
    p.breakaway=true;banner("BREAKAWAY!",900,"gold");tone(660,.1,"square",.05);tone(990,.14,"square",.05,.1)}
  // ---- defenders
  const cc=p.car;
  for(const d of p.def){
    if(d.stun>0){d.stun-=dt;continue}if(d.eng)continue;
    if(p.t<d.react){if(d.role==="CB"||d.role==="S")d.x+=1.4*dt;continue}
    let sp=p.breakaway?7.6*1.25:d.spd;
    if(p.ball){moveTo(d,p.ball.x1,p.ball.y1,sp*(d.cover?1:.85),dt)}
    else if(d.cover&&!p.caught&&!p.crossed){const w=d.cover;moveTo(d,w.x+1.2,w.y+(w.y<CY?.6:-.6),d.spd*.93,dt)}
    else if(cc){const dd=dist(d,cc),L=Math.min(.9,dd/(sp*1.6))*d.leadK;moveTo(d,cc.x+cc.vx*L,cc.y+cc.vy*L,sp,dt)}
    d.y=clamp(d.y,-1.5,FW+1.5);
  }
  for(let i=0;i<p.def.length;i++)for(let j=i+1;j<p.def.length;j++){const a=p.def[i],b=p.def[j],dx=b.x-a.x,dy=b.y-a.y,m=Math.hypot(dx,dy);
    if(m>0&&m<.8){const push=(.8-m)/2;a.x-=dx/m*push;a.y-=dy/m*push;b.x+=dx/m*push;b.y+=dy/m*push}}
  if(!cc)return;
  // ---- tackles
  for(const d of p.def){if(d.eng||d.stun>0)continue;if(dist(d,cc)<.95){
    if(cc.juke>0){d.stun=1.1;pop("JUKED!",d.x,d.y,"#ffcc1a");continue}
    if(!cc.broke&&Math.random()<.18){cc.broke=true;d.stun=.9;cc.slow=.35;pop("BROKE IT!",cc.x,cc.y,"#3ddc6e");SFX.hit();continue}
    return endPlay("tackle")}}
  if(cc.x>=100)return endPlay("td");
  if(cc.y<0||cc.y>FW)return endPlay("oob");
}
function endPlay(kind){const p=P;p.phase="end";p.kind=kind;p.endT=kind==="td"?2:1.4;if(p.car)p.car.vx=p.car.vy=0;G.clockRun=false;
  joy.active=false;joyEl.classList.remove("show");updatePassBtns();
  if(kind==="td"){banner(p.ctx.kind==="two"?"IT'S GOOD!":"TOUCHDOWN!!",1900,"gold");SFX.td()}
  else{SFX.whistle();if(kind==="tackle")SFX.hit();banner(kind==="oob"?"OUT OF BOUNDS":kind==="inc"?"INCOMPLETE":"TACKLED!",1300,kind==="inc"?"bad":"")}}
function resolveLive(){
  const p=P;document.body.classList.remove("live","pre");G.mode="menu";G.clockRun=false;P=null;
  const old=G.ball,line=old+G.toGo,ctxo=p.ctx;
  if(ctxo.kind==="two"){G.score[0]+=2;G.stats.two++;
    return interstitial({title:"2-POINT CONVERSION!",sub:`${esc(G.team.name)} +2`,detail:p.kind==="td"?"You ran it in yourself!":"Your great read carried the team across the goal line!",color:"var(--good)"},()=>cpuDrive(75),"KICK OFF ▶")}
  if(p.kind==="td"){G.stats.yards+=100-old;return touchdown()}
  let spot=p.kind==="inc"?old:Math.min(99,Math.round(p.car.x));
  if(spot<=0){G.stats.yards+=spot-old;return safety("")}
  const gain=spot-old;G.stats.yards+=gain;
  const title=p.kind==="inc"?"INCOMPLETE PASS":gain>0?`GAIN OF ${gain}!`:gain===0?"NO GAIN":`LOSS OF ${-gain}`;
  let detail=p.kind==="oob"?"Pushed out of bounds.":p.kind==="inc"?"Look for an open receiver, or tuck it and run.":"";
  if(ctxo.kind==="go"&&spot<line){detail=p.kind==="inc"?"Pass interference on the defense! Your great read still moves the chains.":"Great read! Your line surged forward to convert on 4th down.";
    if(line>=100){G.ball=99;G.down=1;G.toGo=1;return situation({title,sub:"CONVERTED! 1ST &amp; GOAL",detail,color:"var(--good)"})}
    spot=line}
  G.ball=spot;
  if(spot>=line){G.down=1;G.toGo=Math.min(10,100-spot);return situation({title,sub:"FIRST DOWN!",detail,color:"var(--good)"})}
  G.down++;G.toGo=line-spot;if(G.down>4)return turnoverDowns(title,"");
  situation({title,sub:"",detail,color:gain>0?"var(--good)":"var(--bad)"});
}

  if(G.mode==="kick"&&G.K){const K=G.K,u=Math.min(1,K.t/K.dur),gx=K.x0+(K.x1-K.x0)*u,gy=K.y0+(K.y1-K.y0)*u,z=4*K.h*u*(1-u);
    lx.fillStyle="rgba(0,0,0,.4)";lx.fillRect(X(gx)-2,Y(gy),4,2);const sz=2+Math.round(z/4);
    lx.fillStyle="#000";lx.fillRect(X(gx)-sz/2-1,Y(gy)-Math.round(z*PPY*.6)-sz/2-1,sz+2,sz+1);lx.fillStyle="#8b4513";lx.fillRect(X(gx)-sz/2,Y(gy)-Math.round(z*PPY*.6)-sz/2,sz,sz-1)}
  ctx.imageSmoothingEnabled=false;ctx.drawImage(low,0,0,cvs.width,cvs.height);
}

/* ===================== HUD ===================== */
function updateHUD(){if(!G.started)return;
  const m=Math.floor(G.clock/60),s=Math.floor(G.clock%60),c=$("#hclk");
  c.textContent=`Q${G.q} ${m}:${String(s).padStart(2,"0")}`;c.classList.toggle("zero",G.clock<=0);
  $("#hs1").textContent=G.score[0];$("#hs2").textContent=G.score[1];
  $("#hdd").innerHTML=G.pat?"TRY FOR POINTS":`${downTxt()} · ${spotTxt(G.ball)}`}
$("#bMute").addEventListener("click",()=>{G.muted=!G.muted;$("#bMute").style.opacity=G.muted?.4:1;if(!G.muted){ac();SFX.click()}});
$("#bPause").addEventListener("click",()=>{ac();setPause(true)});
function setPause(on){if(!G.started)return;G.paused=on;const pz=$("#pause");pz.hidden=!on;
  if(on)pz.innerHTML=`<div class="card narrow center"><h2 class="hd">PAUSED</h2><p class="tagline">The game clock and play clock are stopped.</p>
    <button class="btn wide" id="pzR">RESUME ▶</button><button class="btn alt wide" id="pzQ">QUIT TO TITLE</button></div>`;
  if(on){$("#pzR").onclick=()=>setPause(false);$("#pzQ").onclick=()=>{setPause(false);G.gen++;P=null;titleScreen()}}}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&G.started&&(G.clockRun||G.timerOn||G.mode==="live"))setPause(true)});

/* ===================== loop ===================== */
let last=performance.now(),hudT=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!G.paused){
    if(G.started&&G.clockRun&&!G.qOver){G.clock-=dt;if(G.clock<=0){G.clock=0;G.qOver=true}}
    if(G.timerOn)tickTimer(dt);
    if(G.mode==="live"&&P)updateLive(dt);
    if(G.mode==="kick"&&G.K)updateKick(dt);
  }
  updateCam(dt);render();hudT-=dt;if(hudT<=0){hudT=.1;updateHUD()}
  requestAnimationFrame(loop)}
titleScreen();updateCam(0,true);
(document.fonts&&document.fonts.load?document.fonts.load('8px "Press Start 2P"'):Promise.resolve()).finally(()=>requestAnimationFrame(loop));
</script>
