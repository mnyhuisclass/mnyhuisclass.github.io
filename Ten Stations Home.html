<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ten Stations Home</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: a single-theme cockpit. Starfield behind everything; each screen is a console panel.
   Reading panels use a hyperlegible face at a large size; HUD labels use a squared tech face. */
:root {
  --space: #0d0a22;
  --panel: #19153a;
  --panel-2: #231e4d;
  --line: #3a3370;
  --ink: #f1edff;
  --muted: #aaa3d6;
  --graw: #f08a3c;
  --graw-deep: #b8571c;
  --fuel: #5fe3b5;
  --fuel-deep: #1f8f6b;
  --miss: #ff7a8a;
  --gold: #ffd166;
  --f-display: "Bungee", "Impact", "Arial Black", system-ui, sans-serif;
  --f-read: "Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
  --f-hud: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--space);
  color: var(--ink);
  font-family: var(--f-read);
  font-size: 17px;
  line-height: 1.55;
  overflow-x: hidden;
}
#stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
.wrap {
  position: relative; z-index: 1;
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
h1, h2, h3 { text-wrap: balance; margin: 0; }
.display { font-family: var(--f-display); font-weight: 400; letter-spacing: .01em; }
.hud { font-family: var(--f-hud); text-transform: uppercase; letter-spacing: .12em; font-size: 12px; font-weight: 600; color: var(--muted); }
p { margin: 0; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

.btn {
  font-family: var(--f-hud); font-weight: 700; font-size: 16px; letter-spacing: .08em; text-transform: uppercase;
  border: 0; border-radius: 10px; padding: 14px 22px;
  background: var(--graw); color: #1d0e02;
  box-shadow: 0 4px 0 var(--graw-deep);
  transition: transform .08s, box-shadow .08s, filter .15s;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--graw-deep); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.go { background: var(--fuel); color: #032319; box-shadow: 0 4px 0 var(--fuel-deep); }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-size: 18px; color: var(--graw); }
.icon-btn { background: var(--panel); color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-family: var(--f-hud); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }

/* ---------- Intro ---------- */
.intro { display: grid; grid-template-columns: 1.15fr .85fr; gap: 32px; align-items: center; min-height: 80vh; }
.intro h1 { font-family: var(--f-display); font-size: clamp(40px, 7vw, 84px); line-height: .95; color: var(--ink); }
.intro h1 span { color: var(--graw); display: block; }
.log { margin-top: 22px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; max-width: 60ch; }
.log .hud { margin-bottom: 8px; color: var(--graw); }
.log p { font-size: 18px; }
.namebox { margin-top: 22px; display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
.namebox label { display: grid; gap: 6px; flex: 1 1 220px; }
.namebox input {
  font: inherit; font-size: 18px; padding: 12px 14px; border-radius: 10px;
  border: 2px solid var(--line); background: var(--space); color: var(--ink);
}
.namebox input:focus { border-color: var(--graw); outline: none; }
.intro-art { position: relative; aspect-ratio: 1; max-width: 100%; }
.graw-planet {
  position: absolute; inset: 8% 4% 4% 8%; border-radius: 50%;
  background:
    radial-gradient(circle at 70% 30%, rgba(255,255,255,.18), transparent 35%),
    radial-gradient(circle at 30% 70%, #9a4210 0 6%, transparent 7%),
    radial-gradient(circle at 62% 64%, #a84a14 0 4%, transparent 5%),
    radial-gradient(circle at 45% 40%, #c45e1d 0 3%, transparent 4%),
    radial-gradient(circle at 35% 35%, #ffb06a, #e2722a 50%, #7d3209 100%);
  box-shadow: 0 0 80px rgba(240,138,60,.35), inset -30px -40px 70px rgba(30,8,0,.55);
}
.ted { position: absolute; width: 34%; right: 6%; bottom: 0; }
.bubble {
  position: relative; background: var(--ink); color: #1a1438; border-radius: 14px; padding: 12px 14px;
  font-size: 16px; line-height: 1.45;
}
.ted-row { display: flex; gap: 12px; align-items: flex-start; }
.ted-row .ted-mini { flex: 0 0 64px; width: 64px; }
.ted-row .bubble { flex: 1; min-width: 0; }
.ted-row .bubble::before {
  content: ""; position: absolute; left: -8px; top: 18px; border: 8px solid transparent; border-left: 0; border-right-color: var(--ink);
}
.bubble b { color: #8a3a0a; }

/* ---------- Map ---------- */
.map-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
.map-head h2 { font-family: var(--f-display); font-size: clamp(24px, 4vw, 38px); }
.map-card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 10px; overflow: hidden; }
.map-card svg { display: block; width: 100%; height: auto; }
.map-foot { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; margin-top: 18px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

/* ---------- Planet ---------- */
.planet-head { display: flex; align-items: center; gap: 18px; margin-bottom: 18px; flex-wrap: wrap; }
.orb { width: 72px; height: 72px; border-radius: 50%; flex: 0 0 auto; }
.planet-head h2 { font-family: var(--f-display); font-size: clamp(26px, 4.5vw, 44px); line-height: 1; }
.planet-head .grow { flex: 1 1 260px; min-width: 0; }
.gauge { display: grid; gap: 6px; flex: 0 0 auto; }
.cells { display: flex; gap: 4px; }
.cell { width: 34px; height: 22px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); transition: background .3s, box-shadow .3s; }
.cell.on { background: var(--fuel); border-color: var(--fuel); box-shadow: 0 0 12px rgba(95,227,181,.55); }
.cell.off { background: repeating-linear-gradient(45deg, #3b1a28 0 4px, #2a1430 4px 8px); border-color: #5a2a3e; }

.station { display: grid; grid-template-columns: 1.1fr 1fr; gap: 22px; align-items: start; }
.passage { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px; min-width: 0; }
.passage h3 { font-family: var(--f-read); font-size: 24px; font-weight: 700; margin: 6px 0 14px; }
.passage .paras { display: grid; gap: 14px; }
.para { display: grid; grid-template-columns: 26px 1fr; gap: 8px; font-size: 18.5px; line-height: 1.65; max-width: 66ch; }
.para p { white-space: pre-line; }
.para .n { font-family: var(--f-hud); font-size: 13px; color: var(--muted); padding-top: 5px; text-align: right; }
.para.flash { animation: flash 1.6s ease; border-radius: 6px; }
@keyframes flash { 0%,100% { background: transparent; } 20%,60% { background: rgba(255,209,102,.18); } }
.qpanel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: grid; gap: 14px; min-width: 0; }
.qcard { background: var(--panel-2); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
.qmeta { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.dok { font-family: var(--f-hud); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; }
.dok1 { background: #2b4a8a; color: #cfe0ff; }
.dok2 { background: #6b3a8f; color: #f0d9ff; }
.dok3 { background: #8f4a1f; color: #ffe2cc; }
.qtext { font-size: 19px; font-weight: 700; line-height: 1.45; }
.choices { display: grid; gap: 10px; margin-top: 14px; }
.choice {
  text-align: left; background: var(--panel); color: var(--ink); border: 2px solid var(--line); border-radius: 12px;
  padding: 12px 14px; font-size: 17px; line-height: 1.4; display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: start;
  transition: border-color .15s, background .15s;
}
.choice:hover:not([disabled]) { border-color: var(--graw); }
.choice .k { font-family: var(--f-hud); font-weight: 700; color: var(--graw); }
.choice[disabled] { cursor: default; }
.choice.right { border-color: var(--fuel); background: rgba(95,227,181,.12); }
.choice.wrong { border-color: var(--miss); background: rgba(255,122,138,.12); }
.choice.dim { opacity: .5; }
.feedback { margin-top: 14px; border-radius: 12px; padding: 12px 14px; font-size: 16px; }
.feedback.good { background: rgba(95,227,181,.12); border: 1px solid var(--fuel-deep); }
.feedback.bad { background: rgba(255,122,138,.1); border: 1px solid #8a3346; }
.feedback strong { display: block; font-family: var(--f-hud); letter-spacing: .08em; text-transform: uppercase; font-size: 13px; margin-bottom: 4px; }
.feedback.good strong { color: var(--fuel); }
.feedback.bad strong { color: var(--miss); }
.qnav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
.dots { display: flex; gap: 6px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.dots i.cur { background: var(--gold); }
.dots i.ok { background: var(--fuel); }
.dots i.no { background: var(--miss); }
.look { background: none; border: 0; color: var(--gold); text-decoration: underline; padding: 0; font-size: 15px; }

.result { text-align: center; display: grid; gap: 14px; justify-items: center; }
.result h3 { font-family: var(--f-display); font-size: 28px; }

/* ---------- Home ---------- */
.home { display: grid; gap: 22px; }
.home-hero { position: relative; border-radius: 22px; overflow: hidden; background: linear-gradient(#1c2f6b, #3b6fb3 60%, #7fb8e0); min-height: 340px; }
.home-hero svg { display: block; width: 100%; height: auto; }
.banner {
  position: absolute; left: 50%; top: 18px; transform: translateX(-50%) rotate(-1.5deg);
  background: var(--gold); color: #3a2300; font-family: var(--f-display); font-size: clamp(16px, 3.4vw, 32px);
  padding: 8px 22px; border-radius: 6px; white-space: nowrap; box-shadow: 0 6px 0 #b8871c; max-width: 94%; overflow: hidden; text-overflow: ellipsis;
}
.home h2 { font-family: var(--f-display); font-size: clamp(30px, 6vw, 60px); line-height: 1; }
.home h2 span { color: var(--gold); }
.home-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 22px; }
.story-card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: grid; gap: 12px; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat { background: var(--panel-2); border-radius: 12px; padding: 14px; text-align: center; }
.stat b { display: block; font-family: var(--f-display); font-size: 28px; color: var(--fuel); font-variant-numeric: tabular-nums; }
.dokbars { display: grid; gap: 10px; }
.dokbar { display: grid; grid-template-columns: 74px 1fr 52px; gap: 10px; align-items: center; font-variant-numeric: tabular-nums; }
.dokbar .track { height: 12px; background: var(--panel-2); border-radius: 6px; overflow: hidden; }
.dokbar .fill { height: 100%; background: var(--fuel); border-radius: 6px; }
.medal-row { display: flex; gap: 6px; flex-wrap: wrap; }
.medal { width: 22px; height: 22px; border-radius: 50%; flex: 0 0 auto; }
.read-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 15px; }
.read-list li { display: flex; gap: 10px; align-items: center; }

.fade-in { animation: fadeIn .45s ease both; }
@keyframes fadeIn { from { opacity: .001; transform: translateY(8px); } to { opacity: 1; transform: none; } }


/* ---------- Flight ---------- */
html.flying, html.flying body { overflow: hidden; overscroll-behavior: none; }
.flight {
  position: fixed; inset: 0; z-index: 20; background: #07051a; overflow: hidden;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
.flight canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.fhud {
  position: absolute; left: 0; right: 0; top: 0; z-index: 2; display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px); padding-bottom: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(rgba(7,5,26,.92), rgba(7,5,26,.55)); border-bottom: 1px solid var(--line);
}
.fgroup { display: grid; gap: 4px; }
.fgroup.grow { flex: 1 1 160px; min-width: 0; }
.pips { display: flex; gap: 5px; }
.pips i { width: 22px; height: 12px; border-radius: 3px; background: var(--panel-2); border: 1px solid var(--line); }
.pips i.on { background: #7fd6ff; border-color: #7fd6ff; box-shadow: 0 0 8px rgba(127,214,255,.6); }
.bar { height: 12px; background: var(--panel-2); border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.bar.small { width: 90px; }
.bar > div { height: 100%; width: 0; background: var(--gold); border-radius: 6px; }
.bar > div.laser { background: var(--fuel); }
.bar > div.laser.low { background: var(--miss); }
.fscore { font-family: var(--f-display); font-size: 18px; color: var(--fuel); font-variant-numeric: tabular-nums; line-height: 1; }
.fire {
  position: absolute; z-index: 2; width: 112px; height: 112px; border-radius: 50%;
  right: calc(max(16px, env(safe-area-inset-right, 0px)) + 10px); bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  border: 4px solid rgba(255,255,255,.35); background: radial-gradient(circle at 35% 30%, #ff9a7a, #e0443a 60%, #8a1c22);
  color: #fff; font-family: var(--f-display); font-size: 20px; letter-spacing: .04em;
  box-shadow: 0 6px 0 #5a1016, 0 0 30px rgba(255,90,80,.35); touch-action: none;
}
.fire.down { transform: translateY(4px); box-shadow: 0 2px 0 #5a1016, 0 0 40px rgba(255,90,80,.6); }
.flight.lefty .fire { right: auto; left: calc(max(16px, env(safe-area-inset-left, 0px)) + 10px); }
.steer-hint {
  position: absolute; z-index: 1; pointer-events: none; width: 150px; height: 150px; border-radius: 50%;
  left: calc(max(16px, env(safe-area-inset-left, 0px)) + 20px); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  border: 2px dashed rgba(241,237,255,.35); display: grid; place-items: center; text-align: center;
  font-family: var(--f-hud); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: rgba(241,237,255,.7);
}
.flight.lefty .steer-hint { left: auto; right: calc(max(16px, env(safe-area-inset-right, 0px)) + 20px); }
.ftoast {
  position: absolute; z-index: 3; left: 50%; top: 32%; transform: translate(-50%, -50%); pointer-events: none;
  font-family: var(--f-display); font-size: clamp(22px, 5vw, 44px); color: var(--gold); text-align: center; text-shadow: 0 3px 0 #3a2300, 0 0 20px rgba(0,0,0,.6);
  width: 90%;
}
.ftoast.pop { animation: pop .35s ease; }
@keyframes pop { from { transform: translate(-50%, -50%) scale(.6); } to { transform: translate(-50%, -50%) scale(1); } }
.fover { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; background: rgba(7,5,26,.6); touch-action: pan-y;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px)); }
.fover:empty { display: none; }
.fpanel { width: min(620px, 100%); max-height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: grid; gap: 14px; }
.fpanel h3 { font-family: var(--f-display); font-size: clamp(22px, 4vw, 30px); line-height: 1.05; }
.controls { display: grid; gap: 10px; }
.ctl { display: grid; grid-template-columns: 110px 1fr; gap: 12px; background: var(--panel-2); border-radius: 10px; padding: 10px 12px; font-size: 16px; }
.ctl b { font-family: var(--f-hud); text-transform: uppercase; letter-spacing: .08em; font-size: 13px; color: var(--graw); padding-top: 3px; }
.lefty-opt { display: flex; gap: 10px; align-items: center; font-size: 16px; }
.lefty-opt input { width: 22px; height: 22px; accent-color: var(--graw); }
.fbtns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.fbtns .btn { min-height: 52px; min-width: 180px; }
.fstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; }
.fstats > div { background: var(--panel-2); border-radius: 12px; padding: 12px 6px; }
.fstats b { display: block; font-family: var(--f-display); font-size: 26px; color: var(--fuel); font-variant-numeric: tabular-nums; }
@media (max-width: 560px) {
  .fhud { gap: 10px 14px; }
  .bar.small { width: 60px; }
  .fire { width: 92px; height: 92px; font-size: 17px; }
  .ctl { grid-template-columns: 1fr; gap: 2px; }
}
@media (max-width: 860px) {
  .intro { grid-template-columns: 1fr; min-height: 0; }
  .intro-art { max-width: 300px; margin: 0 auto; order: -1; }
  .station { grid-template-columns: 1fr; }
  .qpanel { position: static; }
  .home-grid { grid-template-columns: 1fr; }
  .map-foot { grid-template-columns: 1fr; }
}
@media (max-width: 480px) {
  .para { grid-template-columns: 18px 1fr; font-size: 17.5px; }
  .passage { padding: 18px 16px; }
  .cell { width: 26px; }
  .stat b { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<script>
/* =================== CONTENT =================== */
const DOK_NAMES = { 1: "DOK 1 · Recall", 2: "DOK 2 · Skill & Concept", 3: "DOK 3 · Strategic Thinking" };

const PLANETS = [
  {
    name: "Mossmoor", colors: ["#9be37a", "#3f8f45", "#13361b"], keeper: "Grandma Burl, a toad in a rain hat",
    greet: "Welcome, pilot! Grab a cattail stool. Here's a story every frog on Mossmoor knows by heart.",
    title: "The Frog Who Could Not Glow", genre: "Story",
    paras: [
      "Mossmoor is a soggy green planet covered in bogs and tall reeds. Every night, thousands of glowfrogs climb onto lily pads and light up the swamp with a soft blue shine. The light helps travelers find their way along the narrow wooden paths.",
      "A young glowfrog named Pip had a problem. No matter how hard he puffed his throat, he could not make his skin glow. The other frogs called him \"Dim Pip,\" and he spent most nights hiding under a log.",
      "One stormy night, the wind blew so hard that the glowfrogs dove underwater to stay safe. The swamp went completely dark. Pip heard a cry from the path. A family of travelers had lost their way and were close to stepping into deep mud.",
      "Pip could not glow, but he had something else: the loudest croak in Mossmoor. He hopped to the edge of the path and croaked again and again. The travelers followed his voice, one careful step at a time, until they reached the filling station safely.",
      "The next morning, nobody called him \"Dim Pip.\" They called him \"Pip the Guide.\""
    ],
    qs: [
      { dok: 1, p: 1, q: "What do the glowfrogs do every night?",
        a: "They light up the swamp with a soft blue shine.",
        d: ["They sing songs to the travelers.", "They build wooden paths through the bog.", "They hide underwater until morning."],
        why: "Paragraph 1 says the glowfrogs \"light up the swamp with a soft blue shine.\"" },
      { dok: 1, p: 3, q: "Why did the swamp go completely dark on the stormy night?",
        a: "The glowfrogs dove underwater to stay safe from the wind.",
        d: ["Pip blew out all the lanterns.", "The travelers covered the lily pads.", "The glowfrogs were too tired to glow."],
        why: "Paragraph 3 says the wind was so strong that the glowfrogs dove underwater, so the swamp went dark." },
      { dok: 2, p: 2, q: "How did Pip's feelings about himself most likely change from the beginning of the story to the end?",
        a: "He went from feeling embarrassed to feeling proud.",
        d: ["He went from feeling proud to feeling embarrassed.", "He went from feeling angry to feeling bored.", "His feelings never changed."],

const SEEN_KEY = "ten-stations-home-seen";
function pickStories() {
  let seen = {};
  try { seen = JSON.parse(localStorage.getItem(SEEN_KEY)) || {}; } catch (e) {}
  const picks = PLANETS.map((p, i) => {
    const counts = p.stories.map((_, k) => seen[i + ":" + k] || 0);
    const min = Math.min(...counts);
    const options = counts.map((c, k) => (c === min ? k : -1)).filter(k => k >= 0);
    const k = options[Math.floor(Math.random() * options.length)];
    seen[i + ":" + k] = (seen[i + ":" + k] || 0) + 1;
    return k;
  });
  try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch (e) {}
  return picks;
}

/* Questions for a planet. Veyra's last question links back to stories this player actually read. */
function buildQs(planet, story) {
  return story.qs.map(q => {
    if (q) return q;
    const L = story.link;
    const read = S.picks.slice(0, 9).map((k, i) => ({ planet: PLANETS[i].name, s: PLANETS[i].stories[k] }));
    const match = shuffle(read.filter(r => L.themes.includes(r.s.theme)));
    const others = shuffle(read.filter(r => !L.themes.includes(r.s.theme) && !L.near.includes(r.s.theme)));
    if (!match.length || others.length < 3) return story.fallback;
    const fmt = r => `${r.planet}: ${r.s.recap}`;
    return { dok: 3, p: story.fallback.p, q: L.prompt, a: fmt(match[0]), d: others.slice(0, 3).map(fmt),
      why: `${L.why} On ${match[0].planet}, ${match[0].s.recap}. That is the same kind of lesson.` };
  });
}

const TIER = i => i < 3 ? { label: "Tier 1 · DOK 1–2", tip: "These answers are right there in the passage. If you're stuck, go back and find the sentence that says it." }
  : i < 6 ? { label: "Tier 2 · DOK 1–3", tip: "Some answers are in the text and some need you to put clues together. Check the paragraph number on each question." }
  : i < 9 ? { label: "Tier 3 · DOK 2–3", tip: "Now you're thinking like a detective. Use evidence from the text to explain why, not just what." }
  : { label: "Tier 4 · DOK 3", tip: "The last station is the hardest. Every question asks you to think deeply and use evidence. You can do this." };

const NEED = 3; // fuel cells needed to launch (out of 4)

/* =================== STATE =================== */
const KEY = "ten-stations-home-v1";

  return { screen: "intro", name: "", at: 0, results: [], attempts: 0, q: 0, cur: null, muted: false, finishedAt: null };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function load() { try { const v = JSON.parse(localStorage.getItem(KEY)); return v && typeof v === "object" ? v : null; } catch (e) { return null; } }

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* =================== SOUND =================== */
let actx = null;
function beep(type) {
  if (S.muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (type === "pew" || type === "boom") {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
      o.type = type === "pew" ? "square" : "triangle";
      o.frequency.setValueAtTime(type === "pew" ? 1400 : 180, t);
      o.frequency.exponentialRampToValueAtTime(type === "pew" ? 300 : 40, t + (type === "pew" ? 0.09 : 0.3));
      g.gain.setValueAtTime(type === "pew" ? 0.04 : 0.15, t); g.gain.exponentialRampToValueAtTime(0.0001, t + (type === "pew" ? 0.1 : 0.32));
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.35);
      return;
    }
    const notes = { good: [660, 880], bad: [220, 170], launch: [200, 400, 800], cheer: [523, 659, 784, 1046], tick: [520] }[type] || [440];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type === "bad" ? "sawtooth" : "triangle";
      o.frequency.value = f;
      const t = actx.currentTime + i * 0.11;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.25);
    });
  } catch (e) {}
}

function render() {
  save();
  const s = S.screen;
  stopConfetti();
  if (s !== "flight") stopFlight();
  if (s === "flight") return renderFlight();
  if (s === "intro") return renderIntro();
  if (s === "map") return renderMap();
  if (s === "planet") return renderPlanet();

}

  return `<div class="topbar"><div class="brand">Ten Stations Home</div>

}

/* Map: 12 stops snaking in two rows: Graw, P1..P10, Home */
function mapNodes() {
  const pts = [];
  for (let i = 0; i < 6; i++) pts.push({ x: 60 + i * 96, y: 82 });
  for (let i = 0; i < 6; i++) pts.push({ x: 540 - i * 96, y: 238 });
  return pts;
}
function mapSVG(shipAt) {
  const pts = mapNodes();
  const stops = [{ name: "Graw", colors: ["#ffb06a", "#e2722a", "#7d3209"] }, ...PLANETS, { name: "Home", colors: ["#9fe0ff", "#2f7fd0", "#0b3b2a"] }];
  let d = `M${pts[0].x} ${pts[0].y}`;
  for (let i = 1; i < pts.length; i++) {
    if (i === 6) d += ` C ${pts[5].x + 60} ${pts[5].y}, ${pts[6].x + 60} ${pts[6].y}, ${pts[6].x} ${pts[6].y}`;
    else d += ` L ${pts[i].x} ${pts[i].y}`;
  }
  const doneIdx = S.at; // stops 0..S.at reached (0 = Graw)
  let defs = "", nodes = "";
  stops.forEach((st, i) => {
    const p = pts[i], c = st.colors, id = "g" + i;
    defs += `<radialGradient id="${id}" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="${c[0]}"/><stop offset=".55" stop-color="${c[1]}"/><stop offset="1" stop-color="${c[2]}"/></radialGradient>`;
    const r = i === 0 || i === 11 ? 26 : 21;
    const reached = i <= doneIdx;
    const next = i === doneIdx + 1;
    const ring = next ? `<circle cx="${p.x}" cy="${p.y}" r="${r + 9}" fill="none" stroke="#ffd166" stroke-width="3" stroke-dasharray="6 6"><animateTransform attributeName="transform" type="rotate" from="0 ${p.x} ${p.y}" to="360 ${p.x} ${p.y}" dur="12s" repeatCount="indefinite"/></circle>` : "";
    const check = reached && i > 0 ? `<circle cx="${p.x + r - 4}" cy="${p.y - r + 4}" r="9" fill="#5fe3b5"/><path d="M${p.x + r - 8} ${p.y - r + 4} l3 3 l6 -6" stroke="#032319" stroke-width="2.4" fill="none"/>` : "";
    const num = "";
    nodes += `<g opacity="${reached || next || i === 11 ? 1 : .55}">${ring}<circle cx="${p.x}" cy="${p.y}" r="${r}" fill="url(#${id})"/>${check}
      <text x="${p.x}" y="${p.y + r + 22}" text-anchor="middle" font-family="Chakra Petch, sans-serif" font-weight="700" font-size="15" fill="${next ? "#ffd166" : "#f1edff"}">${num}${st.name}</text></g>`;
  });
  const sp = pts[shipAt];
  return `<svg viewBox="0 0 600 310" role="img" aria-label="Star map from Graw to Home with ten planets. You are at stop ${shipAt} of 11.">
    <defs>${defs}</defs>
    <path d="${d}" fill="none" stroke="#3a3370" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
    ${nodes}
    <g id="shipg" transform="translate(${sp.x} ${sp.y - 40})">${shipSVG()}</g>
  </svg>`;
}

    <div class="map-foot">
      ${tedTalk(S.at === 0 ? `First stop is <b>Mossmoor</b>! The keeper there is ${esc(next.keeper)}. ${tier.tip}` : `Nice flying through that belt! You're orbiting <b>${esc(next.name)}</b>, home of ${esc(next.keeper)}. ${tier.tip}`)}

    else startPlanet();

function startPlanet() {
  if (!S.picks) S.picks = pickStories();
  const story = S.picks[S.at];
  const qs = buildQs(S.at, PLANETS[S.at].stories[story]);
  S.cur = {
    planet: S.at, story, qs,
    items: qs.map((q, i) => ({ i, order: shuffle([q.a, ...q.d]), picked: null })),
    q: 0
  };
  S.attempts = (S.attempts || 0);
  S.arrived = false;
  S.screen = "planet";
  render();
  window.scrollTo({ top: 0 });
}

function renderPlanet() {
  const P = PLANETS[S.cur.planet];
  const C = S.cur;
  const ST = P.stories[C.story];
  const unit = ST.unit || "Paragraph";
  const done = C.items.every(it => it.picked !== null);
  const fuel = C.items.filter(it => it.picked !== null && it.order[it.picked] === C.qs[it.i].a).length;
  const cells = C.items.map(it => {
    if (it.picked === null) return `<span class="cell"></span>`;
    return it.order[it.picked] === C.qs[it.i].a ? `<span class="cell on"></span>` : `<span class="cell off"></span>`;
  }).sort((a, b) => (b.includes("on") - a.includes("on"))).join("");

  const paras = ST.paras.map((t, i) => `<div class="para" id="para${i + 1}"><span class="n">${i + 1}</span><p>${esc(t)}</p></div>`).join("");

  let right;
  if (!done || C.q < C.items.length) {
    const it = C.items[C.q];
    const Q = C.qs[it.i];
    const answered = it.picked !== null;
    const correctIdx = it.order.indexOf(Q.a);
    const choices = it.order.map((c, k) => {
      let cls = "choice";
      if (answered) {
        if (k === correctIdx) cls += " right";
        else if (k === it.picked) cls += " wrong";
        else cls += " dim";
      }
      return `<button class="${cls}" data-k="${k}" ${answered ? "disabled" : ""}><span class="k">${"ABCD"[k]}</span><span>${esc(c)}</span></button>`;
    }).join("");
    const ok = answered && it.picked === correctIdx;
    const dots = C.items.map((x, k) => {
      let c = "";
      if (x.picked !== null) c = x.order[x.picked] === C.qs[x.i].a ? "ok" : "no";
      if (k === C.q) c += " cur";
      return `<i class="${c}"></i>`;
    }).join("");
    right = `<div class="qcard fade-in" id="qcard">
      <div class="qmeta"><span class="hud">Question ${C.q + 1} of 4 · ${unit} ${Q.p}</span><span class="dok dok${Q.dok}">${DOK_NAMES[Q.dok]}</span></div>
      <div class="qtext">${esc(Q.q)}</div>
      <div class="choices">${choices}</div>
      ${answered ? `<div class="feedback ${ok ? "good" : "bad"}"><strong>${ok ? "Fuel cell filled!" : "Cell sealed. No fuel this time."}</strong>${esc(Q.why)}</div>` : ""}
      <div class="qnav">
        <div class="dots" aria-hidden="true">${dots}</div>
        ${answered ? `<button class="btn" id="nextq">${C.q < 3 ? "Next question" : "Check fuel tank"}</button>` : `<button class="look" id="lookback">Look back at ${unit.toLowerCase()} ${Q.p}</button>`}
      </div>
    </div>`;
  }
  if (done && C.q >= C.items.length) {
    const pass = fuel >= NEED;
    right = `<div class="qcard result fade-in">
      <div class="hud">Fuel tank report</div>
      <h3 style="color:${pass ? "var(--fuel)" : "var(--miss)"}">${fuel} of 4 cells filled</h3>
      ${pass
        ? tedTalk(fuel === 4 ? `A perfect fill! ${esc(P.keeper.split(",")[0])} is waving you off. Next stop: ${S.at === 9 ? "<b>HOME</b>!" : `<b>${esc(PLANETS[S.at + 1].name)}</b>.`}` : `That's enough fuel to fly! Next stop: ${S.at === 9 ? "<b>HOME</b>!" : `<b>${esc(PLANETS[S.at + 1].name)}</b>.`}`)
        : tedTalk(`Not quite enough to launch. You need ${NEED} cells. No worries, pilot: reread the story, look closely at the paragraph numbers, and try the station again. The answers will be in a new order.`)}
      ${pass ? `<button class="btn go" id="launch">${S.at === 9 ? "Fly home!" : "Launch"}</button>` : `<button class="btn" id="retry">Reread and try again</button>`}
    </div>`;
  }

  app.innerHTML = `${topbar(`<button class="icon-btn" id="tomap">Star map</button>`)}
  <section class="fade-in">
    <div class="planet-head">
      <div class="orb" style="${orbStyle(P.colors)}" aria-hidden="true"></div>
      <div class="grow"><div class="hud">Station ${S.cur.planet + 1} of 10 · ${TIER(S.cur.planet).label}</div><h2>${esc(P.name)}</h2></div>
      <div class="gauge"><span class="hud">Fuel · need ${NEED}</span><div class="cells" role="img" aria-label="${fuel} of 4 fuel cells filled">${cells}</div></div>
    </div>
    <div style="margin-bottom:18px;max-width:72ch">${tedTalk(`<b>${esc(P.keeper)}</b> says: “${esc(ST.greet || P.greet)}”`)}</div>
    <div class="station">
      <article class="passage">
        <div class="hud">${esc(ST.genre)}</div>
        <h3>${esc(ST.title)}</h3>
        <div class="paras">${paras}</div>
      </article>
      <div class="qpanel">${right}</div>
    </div>
  </section>`;
  bindTop();
  document.getElementById("tomap").onclick = () => { S.screen = "map"; render(); };
  app.querySelectorAll(".choice:not([disabled])").forEach(b => b.onclick = () => answer(+b.dataset.k));
  const nq = document.getElementById("nextq");
  if (nq) nq.onclick = () => { C.q++; render(); focusQ(); };
  const lb = document.getElementById("lookback");
  if (lb) lb.onclick = () => {
    const el = document.getElementById("para" + C.qs[C.items[C.q].i].p);
    el.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "center" });
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  };
  const rt = document.getElementById("retry");
  if (rt) rt.onclick = () => { S.attempts++; startPlanet(); };
  const ln = document.getElementById("launch");
  if (ln) ln.onclick = launch;
}
function focusQ() {
  const q = document.getElementById("qcard");
  if (q && window.innerWidth <= 860) q.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "start" });
}

function answer(k) {
  const C = S.cur;
  const it = C.items[C.q];
  it.picked = k;
  const ok = it.order[k] === C.qs[it.i].a;
  beep(ok ? "good" : "bad");
  // Record the first attempt at this planet for stats
  S.results[C.planet] = S.results[C.planet] || { tries: 0, log: [] };
  const R = S.results[C.planet];
  if (C.items.every(x => x.picked !== null)) {
    R.tries++;
    if (R.tries === 1) R.log = C.items.map(x => ({ dok: C.qs[x.i].dok, ok: x.order[x.picked] === C.qs[x.i].a }));
    R.best = Math.max(R.best || 0, C.items.filter(x => x.order[x.picked] === C.qs[x.i].a).length);
  }
  render();
}

/* =================== FLIGHT (asteroid belt between planets) =================== */
const HOME_STOP = { name: "Home", colors: ["#9fe0ff", "#2f7fd0", "#0b3b2a"] };
const destOf = to => (to <= 10 ? PLANETS[to - 1] : HOME_STOP);
const isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
let FL = null;          // live flight runtime (not saved)
const keys = { up: 0, down: 0, left: 0, right: 0, fire: 0 };

function launch() {
  beep("launch");
  const from = S.at + 1; // map stop of the planet just refueled
  S.at++;
  S.cur = null;
  S.flight = { to: from + 1 > 10 ? 11 : from + 1, tries: 0 };
  S.screen = "flight";
  render();
}

function renderFlight() {
  const dest = destOf(S.flight.to);
  document.documentElement.classList.add("flying");
  app.innerHTML = `
  <div class="flight ${S.fireLeft ? "lefty" : ""}" id="flight">
    <canvas id="fc" aria-label="Asteroid belt. Steer the ship and fire lasers."></canvas>
    <div class="fhud" id="fhud">

      <div class="fgroup grow"><span class="hud">Distance to ${esc(dest.name)}</span><div class="bar"><div id="pbar"></div></div></div>
      <div class="fgroup"><span class="hud">Laser</span><div class="bar small"><div id="ebar" class="laser"></div></div></div>
      <div class="fgroup"><span class="hud">Score</span><b id="fscore" class="fscore">0</b></div>
      <button class="icon-btn" id="fpause">Pause</button>

function overlay(html) {
  const o = document.getElementById("fover");
  o.innerHTML = html ? `<div class="fpanel fade-in">${html}</div>` : "";
  o.hidden = !html;
  return o;
}

function briefing() {
  const F = S.flight, dest = destOf(F.to), fromName = PLANETS[F.to - 2].name;
  const n = F.to - 1;
  const o = overlay(`
    <div class="hud">Flight ${n} of 10 · ${esc(fromName)} to ${esc(dest.name)}</div>
    <h3>${n === 1 ? "Asteroid belt ahead!" : F.to === 11 ? "The final belt. Home is on the other side!" : "Another belt to cross"}</h3>
    ${tedTalk(n === 1
      ? `The space between planets is full of rocks and old satellite junk. <b>Dodge</b> what you can. If something is about to hit you and you can't get around it, <b>blast it</b>! Lasers need time to recharge, so don't waste shots.`
      : `Rocks get faster the closer you get to home. Watch for <b>rock walls</b>: if there's no gap, blast one open!`)}
    <div class="controls">
      <div class="ctl"><b>${isTouch ? "Steer" : "Steer with the mouse"}</b><span>${isTouch ? "Put a finger anywhere on the screen and slide it. The ship moves the same way your finger moves, so your finger never covers the ship." : "Move the mouse and the ship follows. Click and hold to fire."}</span></div>
      <div class="ctl"><b>Fire</b><span>Press and hold the <b>FIRE</b> button to shoot lasers.${isTouch ? " A second finger tapped anywhere also fires." : ""}</span></div>
      <div class="ctl"><b>Keyboard</b><span>Arrow keys or W A S D to steer. Space bar to fire. P to pause.</span></div>
    </div>
    ${isTouch ? `<label class="lefty-opt"><input type="checkbox" id="lefty" ${S.fireLeft ? "checked" : ""}> Put the FIRE button on the left side</label>` : ""}
    <div class="fbtns"><button class="btn go" id="fgo">Launch</button></div>`);
  const l = document.getElementById("lefty");
  if (l) l.onchange = () => { S.fireLeft = l.checked; save(); document.getElementById("flight").classList.toggle("lefty", l.checked); };
  document.getElementById("fgo").onclick = () => { overlay(""); countdown(); };
}

function countdown() {
  newRun();
  let n = 3;
  const tick = () => {
    if (!FL) return;
    if (n === 0) { toast("Go!", 700); FL.run.running = true; return; }
    toast(String(n), 800); beep("tick"); n--; FL.cd = setTimeout(tick, 800);
  };
  tick();
}

function toast(text, ms = 1600) {
  const t = document.getElementById("ftoast"); if (!t) return;
  t.textContent = text; t.hidden = false;
  t.classList.remove("pop"); void t.offsetWidth; t.classList.add("pop");
  clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, ms);
}

function setupFlight() {
  stopFlight();
  const el = document.getElementById("flight"), cv = document.getElementById("fc");
  FL = { el, cv, ctx: cv.getContext("2d"), W: 0, H: 0, L: 50, top: 70, run: null, last: performance.now(),
         steerId: null, sx: 0, sy: 0, firePtrs: new Set(), mouseFire: false, bg: [] };
  sizeFlight();
  FL.bg = [0.25, 0.5, 1].flatMap((sp, layer) => Array.from({ length: 40 + layer * 20 }, () => ({ x: Math.random(), y: Math.random(), sp, r: 0.5 + layer * 0.6 })));

  // keep iOS from scrolling, zooming or showing the callout menu during play
  const stop = e => { if (!e.target.closest(".fpanel")) e.preventDefault(); };
  el.addEventListener("touchmove", stop, { passive: false });
  el.addEventListener("touchstart", e => { if (!e.target.closest(".fpanel, button, input, label")) e.preventDefault(); }, { passive: false });
  el.addEventListener("gesturestart", e => e.preventDefault());
  el.addEventListener("contextmenu", e => e.preventDefault());

  cv.addEventListener("pointerdown", e => {
    const p = local(e);
    if (e.pointerType === "mouse") { FL.mouseFire = true; setTarget(p.x, p.y); return; }
    if (FL.steerId === null) {
      FL.steerId = e.pointerId; FL.sx = p.x; FL.sy = p.y;
      const h = document.getElementById("steerhint"); if (h) h.hidden = true;
    } else FL.firePtrs.add(e.pointerId); // second finger fires
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  });
  cv.addEventListener("pointermove", e => {
    const p = local(e);
    if (e.pointerType === "mouse") { setTarget(p.x, p.y); return; }
    if (e.pointerId !== FL.steerId || !FL.run) return;
    const k = 1.6; // finger travel multiplier, so small thumb motions cover the screen
    FL.run.ship.tx += (p.x - FL.sx) * k; FL.run.ship.ty += (p.y - FL.sy) * k;
    FL.sx = p.x; FL.sy = p.y; clampShip();
  });
  const up = e => {
    if (e.pointerType === "mouse") { FL.mouseFire = false; return; }
    if (e.pointerId === FL.steerId) FL.steerId = null;
    FL.firePtrs.delete(e.pointerId);
  };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up); cv.addEventListener("lostpointercapture", up);

  const fire = document.getElementById("fire");
  fire.addEventListener("pointerdown", e => { e.preventDefault(); FL.firePtrs.add("b" + e.pointerId); fire.classList.add("down"); try { fire.setPointerCapture(e.pointerId); } catch (_) {} });
  const fup = e => { FL.firePtrs.delete("b" + e.pointerId); fire.classList.remove("down"); };
  fire.addEventListener("pointerup", fup); fire.addEventListener("pointercancel", fup); fire.addEventListener("lostpointercapture", fup);

  document.getElementById("fpause").onclick = pauseFlight;
  FL.raf = requestAnimationFrame(frame);
}
function local(e) { const r = FL.cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function setTarget(x, y) { if (!FL.run) return; FL.run.ship.tx = x; FL.run.ship.ty = y; clampShip(); }
function clampShip() {
  const s = FL.run.ship, L = FL.L;
  s.tx = Math.max(L * 0.7, Math.min(FL.W * 0.62, s.tx));
  s.ty = Math.max(FL.top + L * 0.4, Math.min(FL.H - L * 0.5, s.ty));
}
function sizeFlight() {
  if (!FL) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  FL.W = FL.el.clientWidth; FL.H = FL.el.clientHeight;
  FL.cv.width = FL.W * dpr; FL.cv.height = FL.H * dpr; FL.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  FL.L = Math.max(42, Math.min(78, Math.min(FL.W, FL.H) * 0.085));
  const hud = document.getElementById("fhud");
  FL.top = hud ? hud.getBoundingClientRect().bottom - FL.el.getBoundingClientRect().top + 4 : 70;
  if (FL.run) clampShip();
}
addEventListener("resize", () => sizeFlight());
addEventListener("orientationchange", () => setTimeout(sizeFlight, 300));
document.addEventListener("visibilitychange", () => { if (document.hidden && FL && FL.run && FL.run.running) pauseFlight(); });

function stopFlight() {
  if (FL) { cancelAnimationFrame(FL.raf); clearTimeout(FL.cd); }
  FL = null;
  document.documentElement.classList.remove("flying");
}

function newRun() {
  const lvl = S.flight.to - 1; // 1..10
  FL.lvl = lvl;
  FL.run = {
    t: 0, dur: 32 + Math.min(lvl, 8), running: false, paused: false, done: false,
    ship: { x: FL.W * 0.18, y: (FL.top + FL.H) / 2, tx: FL.W * 0.18, ty: (FL.top + FL.H) / 2 },
    shields: 3, inv: 0, energy: 100, cool: 0, rocks: [], bolts: [], parts: [],
    spawnT: 1.4, wallT: 8 + Math.random() * 3, firstWall: true, blasted: 0, hits: 0, score: 0, shake: 0
  };
  updHud();
}

function pauseFlight() {
  const R = FL && FL.run; if (!R || !R.running || R.done) return;
  R.paused = true;
  overlay(`<div class="hud">Paused</div><h3>Ship on hold</h3>${tedTalk("Take a breath, pilot. The rocks will wait.")}<div class="fbtns"><button class="btn go" id="fresume">Resume</button></div>`);
  document.getElementById("fresume").onclick = () => { overlay(""); R.paused = false; FL.last = performance.now(); };
}

const rand = (a, b) => a + Math.random() * (b - a);
function makeRock(type, y, vx) {
  const L = FL.L;
  const r = type === "big" ? L * rand(0.55, 0.7) : type === "junk" ? L * 0.42 : L * rand(0.27, 0.34);
  const verts = Array.from({ length: 10 }, () => rand(0.72, 1.08));
  const craters = Array.from({ length: type === "big" ? 3 : 1 }, () => ({ a: rand(0, 6.28), d: rand(0, 0.5), s: rand(0.12, 0.22) }));
  return { type, x: FL.W + r + 10, y, r, vx, vy: type === "wall" ? 0 : rand(-0.06, 0.06) * FL.H, rot: rand(0, 6.28), vr: rand(-1.5, 1.5),
           hp: type === "big" ? 2 : 1, pts: type === "big" ? 25 : type === "junk" ? 15 : 10, verts, craters, flash: 0,
           tint: Math.random() < 0.5 ? ["#8a7868", "#5d4e42"] : ["#7d7f8f", "#4f5262"] };
}
function baseSpeed() { return FL.W / Math.max(2.6, 5.4 - FL.lvl * 0.26); }
function spawnOne() {
  const R = FL.run, roll = Math.random();
  const type = roll < 0.28 ? "big" : (FL.lvl >= 2 && roll > 0.74) ? "junk" : "small";
  let y = rand(FL.top + FL.L * 0.5, FL.H - FL.L * 0.5);
  if (Math.random() < 0.3) y = Math.max(FL.top + FL.L * 0.5, Math.min(FL.H - FL.L * 0.5, R.ship.y + rand(-FL.L, FL.L))); // aimed at the ship
  const v = baseSpeed() * rand(0.85, 1.25) * (type === "big" ? 0.8 : 1);
  R.rocks.push(makeRock(type, y, -v));
}
function spawnWall() {
  const R = FL.run, rs = FL.L * 0.3, step = rs * 2.4;
  const n = Math.floor((FL.H - FL.top) / step);
  const y0 = FL.top + ((FL.H - FL.top) - (n - 1) * step) / 2;
  const sealed = FL.lvl >= 5;
  const gap = Math.floor(rand(1, n - 2));
  const v = -baseSpeed() * 0.6;
  for (let i = 0; i < n; i++) {
    if (!sealed && (i === gap || i === gap + 1)) continue;
    const r = makeRock("small", y0 + i * step, v);
    r.r = rs; r.vy = 0; r.wall = true; r.x += rand(-4, 4);
    R.rocks.push(r);
  }
  toast(sealed ? (R.firstWall ? "Rock wall! No gap: blast an opening!" : "Rock wall!") : (R.firstWall ? "Rock wall! Find the gap!" : "Rock wall!"), 1800);
  R.firstWall = false;
}
function boom(x, y, n, col) {
  const R = FL.run;
  for (let i = 0; i < n; i++) { const a = rand(0, 6.28), s = rand(40, 220); R.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.35, 0.8), max: 0.8, c: col || (Math.random() < 0.5 ? "#ffd166" : "#ff7a4a"), r: rand(1.5, 3.5) }); }
}

function update(dt) {
  const R = FL.run, s = R.ship, L = FL.L;
  R.t += dt;
  const kx = keys.right - keys.left, ky = keys.down - keys.up;
  if (kx || ky) { s.tx += kx * FL.H * 1.0 * dt; s.ty += ky * FL.H * 1.0 * dt; clampShip(); }
  const k = Math.min(1, dt * 14);
  s.x += (s.tx - s.x) * k; s.y += (s.ty - s.y) * k;

  R.cool -= dt; R.energy = Math.min(100, R.energy + 26 * dt);
  const firing = keys.fire || FL.mouseFire || FL.firePtrs.size > 0;
  if (firing && R.cool <= 0 && R.energy >= 12) {
    R.energy -= 12; R.cool = 0.16;
    R.bolts.push({ x: s.x + L * 0.55, y: s.y });
    beep("pew");
  }

  const ending = R.t > R.dur - 3.5;
  if (!ending) {
    R.spawnT -= dt;
    if (R.spawnT <= 0) { spawnOne(); R.spawnT = rand(0.6, 1.2) * Math.max(0.42, 1.15 - FL.lvl * 0.07); }
    R.wallT -= dt;
    if (R.wallT <= 0 && R.t < R.dur - 7) { spawnWall(); R.wallT = rand(9, 12); }
  }

  for (const r of R.rocks) {
    r.x += r.vx * dt; r.y += r.vy * dt; r.rot += r.vr * dt; r.flash = Math.max(0, r.flash - dt);
    if (r.y < FL.top + r.r || r.y > FL.H - r.r) r.vy *= -1;
  }
  for (const b of R.bolts) b.x += FL.W * 1.5 * dt;

  for (const b of R.bolts) for (const r of R.rocks) {
    if (b.dead || r.dead) continue;
    if (Math.hypot(b.x - r.x, b.y - r.y) < r.r + 5) {
      b.dead = true; r.hp--; r.flash = 0.1; boom(b.x, b.y, 4, "#9ff5d8");
      if (r.hp <= 0) { r.dead = true; R.blasted++; R.score += r.pts; boom(r.x, r.y, r.type === "big" ? 22 : 12); beep("boom"); }
    }
  }
  R.inv = Math.max(0, R.inv - dt);
  if (R.inv <= 0) for (const r of R.rocks) {
    if (r.dead) continue;
    if (Math.hypot(r.x - s.x, r.y - s.y) < r.r * 0.85 + L * 0.28) {
      r.dead = true; R.shields--; R.hits++; R.inv = 1.6; R.shake = 0.35;
      boom(r.x, r.y, 18, "#ff7a8a"); beep("bad");
      if (R.shields <= 0) { flightFail(); break; }
      toast(R.shields === 1 ? "Shields low!" : "Hit! Shields down to " + R.shields, 1100);
      break;
    }
  }
  R.rocks = R.rocks.filter(r => !r.dead && r.x > -r.r * 2);
  R.bolts = R.bolts.filter(b => !b.dead && b.x < FL.W + 20);
  for (const p of R.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  R.parts = R.parts.filter(p => p.life > 0);
  R.shake = Math.max(0, R.shake - dt);
  if (R.t >= R.dur && !R.done) flightWin();
  updHud();
}

function updHud() {
  const R = FL.run; if (!R) return;
  const pips = document.getElementById("pips");
  if (pips) pips.innerHTML = [0, 1, 2].map(i => `<i class="${i < R.shields ? "on" : ""}"></i>`).join("");
  const pb = document.getElementById("pbar"); if (pb) pb.style.width = Math.min(100, 100 * R.t / R.dur) + "%";
  const eb = document.getElementById("ebar"); if (eb) { eb.style.width = R.energy + "%"; eb.classList.toggle("low", R.energy < 12); }
  const sc = document.getElementById("fscore"); if (sc) sc.textContent = R.score;
}

function frame(now) {
  if (!FL) return;
  const dt = Math.min(0.05, (now - FL.last) / 1000); FL.last = now;
  const R = FL.run;
  if (R && R.running && !R.paused && !R.done) update(dt);
  drawFlight(dt, R && R.running && !R.paused);
  FL.raf = requestAnimationFrame(frame);
}

function drawFlight(dt, moving) {
  const { ctx, W, H, L } = FL, R = FL.run;
  ctx.save();
  if (R && R.shake > 0 && !reduced) ctx.translate(rand(-6, 6) * R.shake * 2, rand(-6, 6) * R.shake * 2);
  ctx.fillStyle = "#07051a"; ctx.fillRect(-10, -10, W + 20, H + 20);
  const neb = ctx.createRadialGradient(W * 0.7, H * 0.3, 0, W * 0.7, H * 0.3, W * 0.7);
  neb.addColorStop(0, "rgba(110,60,180,.25)"); neb.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = neb; ctx.fillRect(0, 0, W, H);
  for (const s of FL.bg) {
    if (moving) { s.x -= s.sp * dt * 0.25; if (s.x < 0) { s.x = 1; s.y = Math.random(); } }
    ctx.fillStyle = `rgba(241,237,255,${0.25 + s.sp * 0.6})`;
    ctx.fillRect(s.x * W, s.y * H, s.r * (moving ? 1 + s.sp * 3 : 1), s.r);
  }
  if (!R) { ctx.restore(); return; }

  // destination planet slides in for the last few seconds
  const left = R.dur - R.t;
  if (left < 4) {
    const c = destOf(S.flight.to).colors, pr = H * 0.38, k = Math.min(1, (4 - left) / 3.5);
    const px = W + pr - k * pr * 1.25, py = H * 0.55;
    const g = ctx.createRadialGradient(px - pr * 0.3, py - pr * 0.3, pr * 0.1, px, py, pr);
    g.addColorStop(0, c[0]); g.addColorStop(0.55, c[1]); g.addColorStop(1, c[2]);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, pr, 0, 6.283); ctx.fill();
  }

  for (const r of R.rocks) drawRock(r);
  ctx.strokeStyle = "#5fe3b5"; ctx.lineWidth = 3; ctx.shadowColor = "#5fe3b5"; ctx.shadowBlur = 10;
  for (const b of R.bolts) { ctx.beginPath(); ctx.moveTo(b.x - 16, b.y); ctx.lineTo(b.x + 4, b.y); ctx.stroke(); }
  ctx.shadowBlur = 0;
  for (const p of R.parts) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); }
  ctx.globalAlpha = 1;
  if (!(R.inv > 0 && Math.floor(R.inv * 10) % 2 === 0) && R.shields > 0) drawShip(R.ship.x, R.ship.y, L, R.ship.ty - R.ship.y);
  ctx.restore();
}

function drawRock(r) {
  const ctx = FL.ctx;
  ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.rot);
  if (r.type === "junk") {
    const s = r.r;
    ctx.fillStyle = "#2f6fb3"; ctx.fillRect(-s * 1.1, -s * 0.28, s * 0.7, s * 0.56); ctx.fillRect(s * 0.4, -s * 0.28, s * 0.7, s * 0.56);
    ctx.strokeStyle = "#9cc7ff"; ctx.lineWidth = 1;
    for (let i = 1; i < 3; i++) { ctx.beginPath(); ctx.moveTo(-s * 1.1 + i * s * 0.23, -s * 0.28); ctx.lineTo(-s * 1.1 + i * s * 0.23, s * 0.28); ctx.moveTo(s * 0.4 + i * s * 0.23, -s * 0.28); ctx.lineTo(s * 0.4 + i * s * 0.23, s * 0.28); ctx.stroke(); }
    ctx.fillStyle = r.flash ? "#fff" : "#c9ccd6"; ctx.fillRect(-s * 0.4, -s * 0.45, s * 0.8, s * 0.9);
    ctx.fillStyle = "#ff7a4a"; ctx.fillRect(-s * 0.1, -s * 0.15, s * 0.2, s * 0.3);
    ctx.strokeStyle = "#c9ccd6"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, -s * 0.45); ctx.lineTo(0, -s * 0.85); ctx.stroke();
  } else {
    ctx.beginPath();
    r.verts.forEach((v, i) => { const a = i / r.verts.length * 6.283; const x = Math.cos(a) * r.r * v, y = Math.sin(a) * r.r * v; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.closePath();
    const g = ctx.createRadialGradient(-r.r * 0.3, -r.r * 0.3, r.r * 0.1, 0, 0, r.r);
    g.addColorStop(0, r.flash ? "#ffffff" : r.tint[0]); g.addColorStop(1, r.tint[1]);
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = "rgba(0,0,0,.22)";
    for (const c of r.craters) { ctx.beginPath(); ctx.arc(Math.cos(c.a) * c.d * r.r, Math.sin(c.a) * c.d * r.r, c.s * r.r, 0, 6.283); ctx.fill(); }
    if (r.type === "big" && r.hp === 1) { ctx.strokeStyle = "#ffd166"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-r.r * 0.5, -r.r * 0.2); ctx.lineTo(0, 0.1 * r.r); ctx.lineTo(r.r * 0.4, -r.r * 0.3); ctx.stroke(); }
  }
  ctx.restore();
}

function drawShip(x, y, L, tilt) {
  const ctx = FL.ctx, s = L / 50;
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.max(-0.35, Math.min(0.35, tilt * 0.01))); ctx.scale(s, s);
  const f = Math.random();
  ctx.fillStyle = "#ffd166"; ctx.beginPath(); ctx.moveTo(-22, -5); ctx.lineTo(-34 - f * 12, 0); ctx.lineTo(-22, 5); ctx.fill();
  ctx.fillStyle = "#ff7a4a"; ctx.beginPath(); ctx.moveTo(-10, -9); ctx.lineTo(-22, -17); ctx.lineTo(-16, 0); ctx.lineTo(-22, 17); ctx.lineTo(-10, 9); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#e9e6ff"; ctx.beginPath(); ctx.moveTo(-16, -7); ctx.lineTo(20, -7); ctx.quadraticCurveTo(34, 0, 20, 7); ctx.lineTo(-16, 7); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#5fe3b5"; ctx.beginPath(); ctx.arc(10, 0, 3.6, 0, 6.283); ctx.fill();
  if (FL.run && FL.run.inv > 0) { ctx.strokeStyle = "rgba(127,214,255,.6)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(2, 0, 30, 0, 6.283); ctx.stroke(); }
  ctx.restore();
}

function logFlight(extra) {
  const R = FL.run;
  S.flightLog = S.flightLog || {};
  const prev = S.flightLog[S.flight.to] || { blasted: 0 };
  S.flightLog[S.flight.to] = Object.assign({ blasted: prev.blasted + R.blasted, hits: R.hits, tries: S.flight.tries + 1, score: R.score }, extra);
}

function flightFail() {
  const R = FL.run; R.done = true; R.running = false;
  S.flight.tries++; save();
  logFlight({ crashed: true });
  setTimeout(() => {
    if (!FL) return;
    overlay(`<div class="hud">Shields at zero</div><h3>Ted towed you back!</h3>
      ${tedTalk(`Whoa, that was a bumpy ride! I hooked a tow cable to your ship and pulled you back to the start of the belt. Shields are recharged. Remember: <b>dodge first</b>, and <b>blast</b> anything you can't get around.`)}
      <div class="fbtns"><button class="btn go" id="fagain">Try the flight again</button>
      ${S.flight.tries >= 2 ? `<button class="btn ghost" id="fauto">Use autopilot</button>` : ""}</div>`);
    document.getElementById("fagain").onclick = () => { overlay(""); countdown(); };
    const a = document.getElementById("fauto");
    if (a) a.onclick = () => { logFlight({ auto: true }); arrive(); };
  }, 700);
}

function flightWin() {
  const R = FL.run; R.done = true; R.running = false;
  if (R.hits === 0) R.score += 50;
  logFlight({});
  const dest = destOf(S.flight.to);
  beep("good");
  overlay(`<div class="hud">Belt cleared</div><h3>${S.flight.to === 11 ? "Home is in sight!" : "Arrived at " + esc(dest.name) + "!"}</h3>
    <div class="fstats"><div><b>${R.blasted}</b><span class="hud">Rocks blasted</span></div><div><b>${R.hits}</b><span class="hud">Hits taken</span></div><div><b>${R.score}</b><span class="hud">Score</span></div></div>
    ${R.hits === 0 ? `<p class="hud" style="color:var(--gold);text-align:center">No-hit bonus +50</p>` : ""}
    ${tedTalk(S.flight.to === 11 ? "I can see your home planet! I think... is that a crowd down there?" : `Great flying! The station on <b>${esc(dest.name)}</b> is waving you in.`)}
    <div class="fbtns"><button class="btn go" id="fland">${S.flight.to === 11 ? "Land at home" : "Enter orbit"}</button></div>`);
  document.getElementById("fland").onclick = arrive;
}

function arrive() {
  const to = S.flight.to;
  S.flight = null;
  if (to === 11) { S.finishedAt = new Date().toISOString(); S.screen = "home"; render(); window.scrollTo({ top: 0 }); beep("cheer"); }
  else { S.arrived = true; S.screen = "map"; render(); window.scrollTo({ top: 0 }); }
}

addEventListener("keydown", e => {
  if (!FL) return;
  const k = e.key.toLowerCase();
  const map = { arrowup: "up", w: "up", arrowdown: "down", s: "down", arrowleft: "left", a: "left", arrowright: "right", d: "right", " ": "fire" };
  if (map[k]) { keys[map[k]] = 1; if (!e.target.closest || !e.target.closest("input")) e.preventDefault(); }
  if (k === "p" || k === "escape") pauseFlight();
});
addEventListener("keyup", e => {
  const map = { arrowup: "up", w: "up", arrowdown: "down", s: "down", arrowleft: "left", a: "left", arrowright: "right", d: "right", " ": "fire" };
  const k = map[e.key.toLowerCase()]; if (k) keys[k] = 0;
});
addEventListener("blur", () => { for (const k in keys) keys[k] = 0; });

/* =================== HOME =================== */
function homeSVG() {
  // crowd of cheering figures, a landing pad, flags and Ted
  let crowd = "";
  const skin = ["#f3c7a0", "#d89a6a", "#a86b3c", "#6e4325", "#ffd9b8"];
  const shirts = ["#ff7a4a", "#5fe3b5", "#ffd166", "#b18cff", "#ff7a8a", "#7fd6ff"];
  for (let i = 0; i < 26; i++) {
    const x = 20 + i * 37 + (i % 2) * 8;
    if (x > 380 && x < 620) continue;
    const y = 300 + (i % 3) * 10;
    const sk = skin[i % skin.length], sh = shirts[(i * 7) % shirts.length];
    const up = i % 2 === 0;
    crowd += `<g class="fan" style="animation-delay:${(i % 5) * 0.12}s">
      <rect x="${x - 9}" y="${y}" width="18" height="30" rx="6" fill="${sh}"/>
      <circle cx="${x}" cy="${y - 9}" r="9" fill="${sk}"/>
      <path d="M${x - 8} ${y + 6} L${x - 16} ${up ? y - 14 : y + 18}" stroke="${sh}" stroke-width="5" stroke-linecap="round"/>
      <path d="M${x + 8} ${y + 6} L${x + 16} ${y - 14}" stroke="${sh}" stroke-width="5" stroke-linecap="round"/>
    </g>`;
  }
  let flags = "";
  for (let i = 0; i < 14; i++) {
    const x = 40 + i * 66, y = 70 + Math.sin(i / 13 * Math.PI) * 26;
    flags += `<path d="M${x} ${y} l18 0 l-9 18 z" fill="${shirts[i % shirts.length]}"/>`;
  }
  return `<svg viewBox="0 0 1000 360" aria-hidden="true">
    <style>.fan{animation:hop .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom}@keyframes hop{to{transform:translateY(-8px)}}
    .landed{animation:drop 1.4s cubic-bezier(.2,.8,.3,1) both}@keyframes drop{from{transform:translateY(-260px)}to{transform:none}}
    @media (prefers-reduced-motion: reduce){.fan,.landed{animation:none}}</style>
    <path d="M0 70 Q500 130 1000 70" stroke="#ffffff88" stroke-width="2" fill="none"/>
    ${flags}
    <path d="M0 300 Q250 270 500 290 T1000 280 L1000 360 L0 360 Z" fill="#3d8a4f"/>
    <path d="M0 330 Q300 315 600 330 T1000 325 L1000 360 L0 360 Z" fill="#2c6b3c"/>
    <ellipse cx="500" cy="318" rx="120" ry="16" fill="#e9e6ff" opacity=".85"/>
    <ellipse cx="500" cy="318" rx="88" ry="10" fill="none" stroke="#ffd166" stroke-width="3" stroke-dasharray="8 8"/>
    <g class="landed"><g transform="translate(500 268) rotate(-90) scale(3)">${shipSVG()}</g></g>
    ${crowd}
    <g transform="translate(610 238) scale(.62)">${tedSVG().replace(/^<svg[^>]*>/, "").replace(/<\/svg>$/, "")}</g>
  </svg>`;
}

function renderHome() {
  const all = S.results.flatMap(r => (r && r.log) || []);
  const firstRight = all.filter(x => x.ok).length;
  const totalTries = S.results.reduce((n, r) => n + ((r && r.tries) || 0), 0);
  const firstTryPlanets = S.results.filter(r => r && r.tries === 1).length;
  const blasted = Object.values(S.flightLog || {}).reduce((n, f) => n + (f.blasted || 0), 0);
  const byDok = [1, 2, 3].map(d => { const xs = all.filter(x => x.dok === d); return { d, n: xs.length, ok: xs.filter(x => x.ok).length }; });
  const date = new Date(S.finishedAt || Date.now()).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
  const medals = PLANETS.map((p, i) => `<li><span class="medal" style="${orbStyle(p.colors)}"></span><span><b>${esc(p.name)}</b> · ${esc(p.stories[(S.picks || [])[i] || 0].title)}</span></li>`).join("");

  app.innerHTML = `${topbar(`<button class="icon-btn" id="restart">Restart</button>`)}
  <section class="home fade-in">
    <div class="home-hero">${homeSVG()}<div class="banner">Welcome home, ${esc(S.name)}!</div></div>
    <div>
      <div class="hud">${date} · Mission complete</div>
      <h2 style="margin-top:8px">A hero's welcome for <span>${esc(S.name)}</span></h2>
    </div>
    <div class="home-grid">
      <div class="story-card">
        <p style="font-size:19px">The whole town is at the landing pad. Bands are playing, kids are waving flags, and someone has painted your name on a giant banner. You left Graw with an empty tank and no map home. You crossed ten planets, listened to ten stories, and earned every drop of fuel by reading closely.</p>
        <p style="font-size:19px">The mayor pins a star-shaped medal on your jacket and calls you the <b>Hero of the Ten Stations</b>.</p>
        ${tedTalk(`Psst! Look who stowed away in your cargo hold. I wasn't going to miss your party! You did it, ${esc(S.name)}. Just like Captain Oda said, you're carrying a map full of lessons now.`)}
        <div><div class="hud" style="margin-bottom:8px">Stories you read</div><ul class="read-list">${medals}</ul></div>
      </div>
      <div class="story-card">
        <div class="hud">Flight report</div>
        <div class="stats">
          <div class="stat"><b>10</b><span class="hud">Planets</span></div>
          <div class="stat"><b>${firstRight}/40</b><span class="hud">First-try</span></div>
          <div class="stat"><b>${firstTryPlanets}</b><span class="hud">One-try stops</span></div>
          <div class="stat"><b>${blasted}</b><span class="hud">Rocks blasted</span></div>
        </div>
        <div class="hud" style="margin-top:6px">First-try accuracy by DOK level</div>
        <div class="dokbars">
          ${byDok.map(b => `<div class="dokbar"><span class="dok dok${b.d}">DOK ${b.d}</span><div class="track"><div class="fill" style="width:${b.n ? Math.round(100 * b.ok / b.n) : 0}%"></div></div><span>${b.ok}/${b.n}</span></div>`).join("")}
        </div>
        <p style="color:var(--muted);font-size:15px">Total station visits: ${totalTries}. Show this screen to your teacher.</p>
        <button class="btn go" id="again" style="justify-self:start;align-self:end">Fly again</button>
      </div>
    </div>
  </section>`;
  bindTop();
  document.getElementById("again").onclick = () => { const m = S.muted, n = S.name; S = freshState(); S.muted = m; S.name = n; S.screen = "intro"; render(); };
  startConfetti();
}

/* =================== BACKGROUND FX =================== */
const sc = document.getElementById("stars"), sx = sc.getContext("2d");
let stars = [];
function sizeStars() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  sc.width = innerWidth * dpr; sc.height = innerHeight * dpr; sx.setTransform(dpr, 0, 0, dpr, 0, 0);
  stars = Array.from({ length: Math.round(innerWidth * innerHeight / 3500) }, () => ({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: Math.random() * 1.4 + .2, t: Math.random() * 6, s: Math.random() * .25 + .03 }));
}
function drawStars(t) {
  sx.clearRect(0, 0, innerWidth, innerHeight);
  const g = sx.createRadialGradient(innerWidth * .85, innerHeight * .1, 0, innerWidth * .85, innerHeight * .1, innerWidth * .6);
  g.addColorStop(0, "rgba(120,70,190,.22)"); g.addColorStop(1, "rgba(0,0,0,0)");
  sx.fillStyle = g; sx.fillRect(0, 0, innerWidth, innerHeight);
  for (const s of stars) {
    if (!reduced) { s.x -= s.s; if (s.x < 0) s.x = innerWidth; }
    const a = .5 + .5 * Math.sin(t / 700 + s.t);
    sx.fillStyle = `rgba(241,237,255,${.25 + a * .6})`;
    sx.beginPath(); sx.arc(s.x, s.y, s.r, 0, 6.283); sx.fill();
  }
  requestAnimationFrame(drawStars);
}
addEventListener("resize", () => { sizeStars(); sizeConfetti(); });

const cc = document.getElementById("confetti"), cx = cc.getContext("2d");
let bits = [], confRun = false, confEnd = 0;
function sizeConfetti() { cc.width = innerWidth; cc.height = innerHeight; }
function startConfetti() {
  if (reduced) return;
  sizeConfetti();
  const cols = ["#ffd166", "#5fe3b5", "#ff7a4a", "#b18cff", "#7fd6ff", "#ff7a8a"];
  bits = Array.from({ length: 180 }, () => ({ x: Math.random() * innerWidth, y: -Math.random() * innerHeight, w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, vy: 1.5 + Math.random() * 2.5, vx: -1 + Math.random() * 2, r: Math.random() * 6, vr: -.2 + Math.random() * .4, c: cols[Math.floor(Math.random() * cols.length)] }));
  confEnd = performance.now() + 9000;
  if (!confRun) { confRun = true; requestAnimationFrame(drawConfetti); }
}
function stopConfetti() { confEnd = 0; }
function drawConfetti(t) {
  cx.clearRect(0, 0, cc.width, cc.height);
  if (t > confEnd) { confRun = false; return; }
  for (const b of bits) {
    b.y += b.vy; b.x += b.vx + Math.sin(t / 400 + b.r); b.r += b.vr;
    if (b.y > innerHeight + 20) { b.y = -20; b.x = Math.random() * innerWidth; }
    cx.save(); cx.translate(b.x, b.y); cx.rotate(b.r); cx.fillStyle = b.c; cx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); cx.restore();
  }
  requestAnimationFrame(drawConfetti);
}

/* =================== BOOT =================== */
function start(hotData) {
  const prev = (hotData && hotData.state) || load();
  if (prev && prev.screen) S = Object.assign(freshState(), prev);
  if (S.screen === "planet" && !S.cur) S.screen = "map";
  if (S.screen !== "intro" && !S.name) S.screen = "intro";
  // land returning players on the intro so they can choose Continue
  if (!hotData || !hotData.state) { if (S.screen === "map" || S.screen === "planet" || S.screen === "flight") S.screen = "intro"; }
  if (S.screen === "flight" && !S.flight) S.screen = "map";
  if (!S.picks) S.picks = pickStories();
  if (S.cur && !S.cur.qs) S.cur = null;
  sizeStars(); requestAnimationFrame(drawStars);
  render();
}
window.claude?.hot?.snapshot?.(() => ({ state: S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
